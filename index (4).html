ponsible party"],"ic":["❌","✅","❌","❌"],"w":["❌ Professional responsibility doesn't mean pushing through every time. Forcing yourself to work when focus/readiness has dropped may increase risk to the patient.","✅ Appropriately disclosing a limitation that may affect safety is part of responsibility, not avoiding duty — Safety action should occur before harm, not only after harm (as in #5).","❌ Trying to reduce drowsiness on your own doesn't replace notifying the supervisor when fatigue is affecting your ability to work safely — no error yet doesn't mean nothing needs to be done.","❌ A student should not decide to leave the work area alone without coordinating with the responsible party. Adjusting how you work should be done together with your supervisor."],"l":["Non-maleficence / Patient Safety — fatigue affecting focus may increase risk to patients","Professional Responsibility + Accountability — knowing your limits and communicating appropriately","Skill: Self-Assessment of Readiness for Practice — Recognize → Inform → Adjust safely"],"r":["👁️ Recognize — notice whether fatigue is affecting your focus, decisions, or ability to work","🔍 Assess — consider how risky and precision-demanding the upcoming task is","🗣️ Speak — tell your supervisor directly when you're concerned about safety","🔄 Adjust — work together to adjust tasks, rest, assistance, or supervision as appropriate","✅ Reassess — reassess your readiness before returning to higher-risk work"],"qq":"During placement, a student feels very drowsy and their focus starts dropping, but no error has occurred yet. What is most appropriate?","qo":["Keep going until an error happens, then tell the instructor","Avoid only medication tasks but continue everything else without telling anyone","Tell the supervisor how fatigue is affecting readiness to work, and work together to set a safe approach","Go home immediately without coordinating with anyone"],"qc":2}},{"id":12,"cat":"clinical","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Autonomy ✔ — Respect ≠ Agreement การเคารพไม่ได้แปลว่าต้องเห็นด้วย","en":"⚡ Autonomy ✔ — Respect ≠ Agreement; respecting a decision doesn't mean agreeing with it"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[true,true,false,false],"ju":[false,true,false,false]},"th":{"e":"🙏","t":"ผู้ป่วยปฏิเสธเลือดตามความเชื่อส่วนบุคคล","s":"ผู้ป่วยผู้ใหญ่รู้สึกตัวดี สื่อสารรู้เรื่อง และได้รับข้อมูลเกี่ยวกับความจำเป็น ประโยชน์ และความเสี่ยงของการให้เลือดแล้ว ผู้ป่วยระบุอย่างชัดเจนว่าตามความเชื่อของตนไม่ประสงค์รับเลือด แม้ครอบครัวจะขอให้ทีมให้เลือดเพื่อรักษาชีวิต","c":["ให้เลือดตามความต้องการของครอบครัว เพราะการรักษาชีวิตสำคัญกว่าความเชื่อของผู้ป่วย","เคารพการตัดสินใจของผู้ป่วย ตรวจสอบ/สนับสนุนความเข้าใจ และประสานทีมเพื่อพิจารณาทางเลือกการดูแลที่สอดคล้องกับความต้องการของผู้ป่วย","พยายามโน้มน้าวผู้ป่วยต่อไปจนยอมรับเลือด เพราะทีมทราบว่าการรักษาใดดีที่สุด","ไม่ต้องดำเนินการดูแลอื่นต่อ เพราะผู้ป่วยเป็นผู้เลือกปฏิเสธการรักษาเอง"],"ic":["❌","✅","❌","❌"],"w":["❌ ครอบครัวไม่สามารถใช้อำนาจแทนที่การตัดสินใจของผู้ป่วยที่มีความสามารถในการตัดสินใจได้เพียงเพราะไม่เห็นด้วย — Family concern ≠ automatic authority to override the patient's decision","✅ การเคารพ Autonomy คือการสนับสนุนให้ผู้ป่วยตัดสินใจอย่างมีข้อมูล — Respect ≠ Agreement ทีมยังสามารถประสานเพื่อพิจารณาทางเลือกที่ผู้ป่วยยอมรับได้","❌ การให้ข้อมูลเพิ่มเติมทำได้ แต่การพยายามโน้มน้าวต่อไปหลังผู้ป่วยตัดสินใจชัดเจนแล้วอาจกลายเป็นการกดดัน (coercion) — Inform, clarify, support ไม่ใช่ pressure","❌ Refusal of one treatment ≠ refusal of all care การปฏิเสธการรักษาหนึ่งอย่างไม่ได้หมายถึงการปฏิเสธการดูแลทั้งหมด ทีมยังต้องดูแลอาการ สนับสนุน และประสานทางเลือกอื่นต่อไป"],"l":["หลัก Autonomy — สนับสนุนผู้ป่วยที่มีความสามารถตัดสินใจให้ตัดสินใจอย่างมีข้อมูลและเป็นอิสระ","หลัก Beneficence + Respect for Persons — เคารพคุณค่าและความเชื่อของผู้ป่วยรายนี้ ไม่ใช่เหมารวมจากกลุ่มความเชื่อ","ทักษะ Informed Refusal — Respect ≠ Agreement"],"r":["🧠 Capacity — พิจารณาว่าผู้ป่วยสามารถมีส่วนร่วมในการตัดสินใจได้หรือไม่","💬 Understand — ตรวจสอบว่าผู้ป่วยเข้าใจข้อมูลสำคัญเกี่ยวกับทางเลือกและผลที่อาจเกิดขึ้น","🙏 Respect — เคารพการตัดสินใจและคุณค่าของผู้ป่วย ไม่ตัดสินจากความเชื่อของตนเอง","🔍 Explore — สำรวจว่ามีทางเลือกใดที่ผู้ป่วยยอมรับได้","🤝 Coordinate — ประสานทีมเพื่อดำเนินการตามเป้าหมายและความต้องการของผู้ป่วยอย่างเหมาะสม"],"qq":"ผู้ป่วยผู้ใหญ่ที่สื่อสารและตัดสินใจได้ปฏิเสธหัตถการที่ทีมเห็นว่ามีประโยชน์ หลังได้รับข้อมูลแล้ว ครอบครัวขอให้ทีมทำหัตถการนั้นต่อไป แนวทางใดเหมาะสมที่สุด?","qo":["ทำตามครอบครัวเพราะต้องรักษาชีวิตก่อน","ให้ครอบครัวตัดสินใจแทนเพราะเป็นญาติใกล้ชิด","ตรวจสอบความเข้าใจของผู้ป่วย เคารพการตัดสินใจ และประสานทีมเพื่อดูแล/เสนอทางเลือกที่เหมาะสมต่อ","ยุติการดูแลทั้งหมดเพราะผู้ป่วยปฏิเสธการรักษา"],"qc":2},"en":{"e":"🙏","t":"Patient Refuses Blood on Personal Grounds","s":"An alert, communicative adult patient, capable of decision-making, has received information about the necessity, benefits, and risks of blood transfusion. The patient clearly states that per their personal beliefs they do not wish to receive blood, even though the family asks the team to give blood to save their life.","c":["Give blood per the family's wishes, since saving life matters more than the patient's beliefs","Respect the patient's decision, verify/support their understanding, and coordinate with the team to consider care alternatives consistent with the patient's wishes","Keep trying to persuade the patient to accept blood, since the team knows what treatment is best","Don't provide any further care, since the patient chose to refuse treatment themselves"],"ic":["❌","✅","❌","❌"],"w":["❌ A family cannot use their authority to override the decision of a patient capable of deciding, simply because they disagree — Family concern ≠ automatic authority to override the patient's decision.","✅ Respecting Autonomy means supporting the patient to decide with information — Respect ≠ Agreement. The team can still coordinate to consider alternatives the patient would accept.","❌ Providing more information is fine, but continuing to persuade after the patient has clearly decided can become coercion — Inform, clarify, support, not pressure.","❌ Refusal of one treatment ≠ refusal of all care. Refusing one treatment doesn't mean refusing all care — the team still needs to manage symptoms, support the patient, and coordinate other options."],"l":["Autonomy — support a capable patient to decide with information and independence","Beneficence + Respect for Persons — respect this patient's values and beliefs, not generalize from a belief group","Skill: Informed Refusal — Respect ≠ Agreement"],"r":["🧠 Capacity — consider whether the patient can participate in decision-making","💬 Understand — verify the patient understands key information about options and possible outcomes","🙏 Respect — respect the decision and the patient's values, without judging based on your own beliefs","🔍 Explore — explore what alternatives the patient would accept","🤝 Coordinate — coordinate with the team to proceed per the patient's goals and wishes appropriately"],"qq":"A communicative, decision-capable adult patient refuses a procedure the team considers beneficial, after receiving information. The family asks the team to proceed anyway. What is most appropriate?","qo":["Follow the family since saving life comes first","Let the family decide instead, since they are close relatives","Verify the patient's understanding, respect the decision, and coordinate the team to continue care/offer appropriate alternatives","End all care since the patient refused treatment"],"qc":2}},{"id":13,"cat":"digital","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Confidentiality ✔ — Educational purpose ≠ automatic permission; ลบชื่อ ≠ ได้รับอนุญาตให้ใช้ AI","en":"⚡ Confidentiality ✔ — educational purpose ≠ automatic permission; removing a name ≠ authorized to use AI"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[false,true,false,false],"ju":[false,true,false,false]},"th":{"e":"🤖","t":"AI และความลับผู้ป่วย","s":"หลังฝึกปฏิบัติงาน นักศึกษาต้องการใช้ Generative AI ช่วยทบทวนกรณีศึกษา จึงกำลังจะพิมพ์ข้อมูลจากผู้ป่วยจริง รวมทั้งชื่อ อายุ อาการ และรายละเอียดการรักษา ลงในเครื่องมือ AI ส่วนตัวที่แหล่งฝึกไม่ได้ระบุว่าอนุญาตให้ใช้กับข้อมูลผู้ป่วย","c":["ใช้ได้ เพราะมีวัตถุประสงค์เพื่อการศึกษาและไม่ได้เผยแพร่บน social media","ยังไม่นำข้อมูลผู้ป่วยเข้าสู่เครื่องมือนั้น ตรวจสอบนโยบาย/เครื่องมือที่ได้รับอนุญาต และใช้เฉพาะข้อมูลที่จำเป็นตามกระบวนการที่กำหนด","ลบเฉพาะชื่อผู้ป่วยแล้วส่งรายละเอียดที่เหลือเข้า AI ได้ทันที","ใช้ข้อมูลทั้งหมดได้หากลบประวัติการสนทนาหลังใช้งานเสร็จ"],"ic":["❌","✅","❌","❌"],"w":["❌ Educational purpose ≠ automatic permission เจตนาเพื่อการศึกษาไม่ได้ตอบคำถามว่ามีสิทธิส่งข้อมูลนั้นเข้าสู่ระบบภายนอกหรือไม่","✅ ตรวจสอบ authorization ก่อน แล้วจึง minimize/de-identify ตามกระบวนการที่กำหนด — ไม่ควรนำข้อมูลผู้ป่วยจากการดูแลจริงเข้าสู่เครื่องมือที่ไม่ได้รับอนุญาตโดยพลการ","❌ De-identification reduces risk; it does not automatically authorize use — การลบชื่อเพียงอย่างเดียวไม่ได้แปลว่าได้รับอนุญาตให้ใช้เครื่องมือนั้น และรายละเอียดอื่นที่เหลืออาจยังเชื่อมโยงถึงบุคคลได้","❌ การลบบทสนทนาภายหลังไม่ได้ย้อนกลับการที่ข้อมูลผู้ป่วยถูกส่งเข้าสู่ระบบภายนอกไปแล้ว ปัญหาอยู่ที่การส่งข้อมูลโดยไม่ได้รับอนุญาตตั้งแต่แรก"],"l":["หลัก Confidentiality + Privacy — ข้อมูลจากบริบทการดูแลไม่ควรถูกนำไปใช้กับเครื่องมือภายนอกโดยไม่ได้รับอนุญาต","หลัก Professional Responsibility — ตรวจสอบนโยบายและขอบเขตการใช้เครื่องมือก่อนนำข้อมูลเข้าสู่ระบบ","ทักษะ Responsible AI Use / Digital Professionalism — AI output ไม่ควรใช้แทนการประเมินทางคลินิกหรือการกำกับดูแลของผู้รับผิดชอบ"],"r":["🎯 Purpose — จำเป็นต้องใช้ข้อมูลจากผู้ป่วยจริงหรือไม่ และใช้เพื่ออะไร","✅ Permission — เครื่องมือและการใช้งานลักษณะนี้ได้รับอนุญาตจากแหล่งฝึกหรือไม่","🔒 Minimize — ใช้ข้อมูลให้น้อยที่สุดเท่าที่จำเป็น และลดข้อมูลที่สามารถเชื่อมโยงถึงบุคคล","🛡️ Protect — ใช้ช่องทางและวิธีการจัดการข้อมูลที่ได้รับอนุญาต","🔍 Verify — ตรวจสอบผลลัพธ์จาก AI กับแหล่งข้อมูล/ผู้กำกับดูแลที่เหมาะสมก่อนนำไปใช้"],"qq":"นักศึกษาลบชื่อและเลขประจำตัวของผู้ป่วยออกจากกรณีศึกษาแล้ว แต่ต้องการนำรายละเอียดจากผู้ป่วยจริงไปใช้กับ AI ที่ไม่ทราบว่าแหล่งฝึกอนุญาตหรือไม่ ควรทำอย่างไร?","qo":["ใช้ได้ เพราะลบ direct identifiers แล้ว","ตรวจสอบก่อนว่าเครื่องมือและการใช้ข้อมูลลักษณะนี้ได้รับอนุญาตหรือไม่ และใช้เฉพาะข้อมูลที่จำเป็นตามแนวทางที่กำหนด","ใช้ได้ถ้าไม่บอก AI ว่าข้อมูลมาจากโรงพยาบาล","ใช้ได้ถ้าลบ conversation หลังได้รับคำตอบ"],"qc":1},"en":{"e":"🤖","t":"AI and Patient Confidentiality","s":"After clinical placement, a student wants Generative AI to help review a case study, and is about to type in real patient information — including name, age, symptoms, and treatment details — into a personal AI tool that the facility has not stated is authorized for use with patient data.","c":["It's fine, since the purpose is educational and it won't be shared on social media","Do not enter patient data into that tool yet; check the policy/authorized tools, and use only necessary information per the defined process","Remove just the patient's name, then send the rest of the details into the AI right away","Use all the information if you delete the conversation history afterward"],"ic":["❌","✅","❌","❌"],"w":["❌ Educational purpose ≠ automatic permission. A good educational intent doesn't answer whether you have the right to send that information into an external system.","✅ Verify authorization first, then minimize/de-identify per the defined process — real patient information from care should not be entered into an unauthorized tool on your own initiative.","❌ De-identification reduces risk; it does not automatically authorize use. Removing just the name doesn't mean you're authorized to use that tool, and the remaining details may still be identifiable.","❌ Deleting the conversation afterward doesn't undo the fact that patient data was already sent into an external system. The problem is sending unauthorized data in the first place, not erasing traces afterward."],"l":["Confidentiality + Privacy — information from the care context should not be used with an unauthorized external tool","Professional Responsibility — check policy and scope of tool use before entering data into a system","Skill: Responsible AI Use / Digital Professionalism — AI output should not replace clinical judgment or the responsible provider's oversight"],"r":["🎯 Purpose — is real patient data actually necessary, and for what?","✅ Permission — is this tool and type of use authorized by the facility?","🔒 Minimize — use as little data as necessary and reduce identifiable details","🛡️ Protect — use authorized channels and data-handling methods","🔍 Verify — check AI output against appropriate sources/supervisors before use"],"qq":"A student has removed the patient's name and ID number from a case, but wants to use real patient details with an AI tool not known to be authorized by the facility. What should they do?","qo":["It's fine since direct identifiers were removed","Verify first whether this tool and this type of data use is authorized, and use only necessary information per guidance","It's fine as long as you don't tell the AI the data is from a hospital","It's fine if you delete the conversation after getting the answer"],"qc":1}},{"id":14,"cat":"digital","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Confidentiality ✔ — Real-time disclosure ต้องหยุดทันที ไม่ใช่รอให้จบก่อน","en":"⚡ Confidentiality ✔ — real-time disclosure must be stopped immediately, not after the fact"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[false,true,false,false],"ju":[false,true,false,false]},"th":{"e":"📺","t":"Live Stream ในโรงพยาบาล","s":"ระหว่างการ round ในหอผู้ป่วย เพื่อนนักศึกษาเปิด Live ผ่านบัญชี social media ส่วนตัวเพื่อแชร์บรรยากาศการฝึก ขณะถ่ายทอดสดอาจมีภาพ เสียงสนทนา หรือข้อมูลจากบริเวณดูแลผู้ป่วยถูกส่งออกไป","c":["ปล่อยให้ Live ต่อถ้ายังไม่เห็นใบหน้าผู้ป่วย","แจ้งให้หยุดการถ่ายทอดสดทันทีเพื่อป้องกันการเปิดเผยข้อมูลเพิ่มเติม และแจ้งผู้รับผิดชอบเพื่อประเมิน/จัดการตามแนวทางของแหล่งฝึก","ให้ Live ต่อได้หากเปลี่ยนบัญชีเป็น private","รอให้การ round เสร็จแล้วค่อยเตือน เพราะการหยุดระหว่างนั้นอาจรบกวนทีม"],"ic":["❌","✅","❌","❌"],"w":["❌ No patient face ≠ no patient information — เสียงเรียกชื่อ การรายงานอาการ บทสนทนาของทีม หรือข้อมูลในสภาพแวดล้อมก็สามารถเปิดเผยข้อมูลผู้ป่วยได้แม้ไม่เห็นใบหน้า","✅ Stop the exposure first — ยุติการเปิดเผยที่กำลังเกิดขึ้นก่อน (real-time) แล้วแจ้งผู้รับผิดชอบเพื่อประเมินว่ามีข้อมูลใดถูกเผยแพร่ไปแล้วและดำเนินการตามแนวทางของแหล่งฝึก","❌ จำนวนผู้ชมไม่ได้สร้างสิทธิในการนำข้อมูลจากบริบทการดูแลไปเผยแพร่ผ่านบัญชีส่วนตัว — Private account ไม่ได้แก้ปัญหาการเปิดเผยข้อมูลโดยอัตโนมัติ","❌ การรอให้จบก่อนค่อยเตือนปล่อยให้ความเสี่ยงจาก real-time disclosure ดำเนินต่อไปโดยไม่จำเป็น ควรหยุดทันทีที่สังเกตเห็น"],"l":["หลัก Confidentiality + Privacy — ข้อมูลภาพ เสียง และสภาพแวดล้อมสามารถเปิดเผยข้อมูลผู้ป่วยได้ระหว่าง live streaming","หลัก Professional Responsibility + Advocacy — หยุดการเปิดเผยที่กำลังเกิดขึ้นเมื่อเห็นเพื่อนกำลังจะเผยแพร่ข้อมูล","ทักษะ Digital Professionalism / Preventing Real-time Disclosure"],"r":["🛑 Stop — ยุติ ongoing livestream เพื่อป้องกันการเปิดเผยเพิ่มเติม","🔒 Protect — หลีกเลี่ยงการส่งต่อหรือเผยแพร่ข้อมูลเพิ่มเติม","📢 Notify — แจ้งพยาบาลผู้รับผิดชอบ/อาจารย์นิเทศตามความเหมาะสม","🔍 Assess — ร่วมกับผู้รับผิดชอบตรวจสอบว่ามีข้อมูลใดถูกเปิดเผยไปแล้ว","📋 Follow up — ดำเนินการตามกระบวนการของแหล่งฝึก"],"qq":"นักศึกษาเปิด Live ในบริเวณดูแลผู้ป่วย โดยกล้องหันเข้าหาตนเองและไม่เห็นใบหน้าผู้ป่วย แต่ระหว่าง Live สามารถได้ยินทีมพูดชื่อและข้อมูลการรักษาของผู้ป่วย แนวทางใดเหมาะสมที่สุด?","qo":["Live ต่อได้เพราะไม่เห็นผู้ป่วย","Live ต่อได้หากปิด comment","Live ต่อได้ถ้าผู้ติดตามมีเฉพาะเพื่อนนักศึกษา","หยุดการถ่ายทอดและดำเนินการตามแนวทางของแหล่งฝึก เพราะข้อมูลผู้ป่วยสามารถถูกเปิดเผยผ่านเสียงได้"],"qc":3},"en":{"e":"📺","t":"Live Streaming in the Hospital","s":"During ward rounds, a classmate opens a live stream on a personal social media account to share the training atmosphere. During the broadcast, images, conversations, or information from the care area may be transmitted live.","c":["Let the live stream continue as long as no patient face is shown","Tell them to stop the live stream immediately to prevent further disclosure, and notify the responsible party to assess/handle it per facility guidance","Let the live stream continue if the account is switched to private","Wait until rounds are finished before mentioning it, since stopping midway might disrupt the team"],"ic":["❌","✅","❌","❌"],"w":["❌ No patient face ≠ no patient information — a name called out, symptom reports, team conversation, or environmental information can disclose patient information even without a visible face.","✅ Stop the exposure first — end the ongoing (real-time) disclosure first, then notify the responsible party to assess what information may have already been disclosed and act per facility guidance.","❌ The number of viewers doesn't create a right to broadcast information from the care context via a personal account — a private account does not automatically solve the disclosure problem.","❌ Waiting until it's over before mentioning it lets the risk from real-time disclosure continue unnecessarily. You should stop as soon as you notice."],"l":["Confidentiality + Privacy — images, sound, and environment can disclose patient information during live streaming","Professional Responsibility + Advocacy — stop an ongoing disclosure when you see a colleague about to broadcast information","Skill: Digital Professionalism / Preventing Real-time Disclosure"],"r":["🛑 Stop — end the ongoing livestream to prevent further disclosure","🔒 Protect — avoid forwarding or further disclosing information","📢 Notify — notify the responsible nurse/instructor as appropriate","🔍 Assess — work with the responsible party to check what information may already have been disclosed","📋 Follow up — act per facility procedure"],"qq":"A student live streams in a care area with the camera facing themselves and no patient visible, but during the broadcast the team can be heard saying the patient's name and treatment details. What is most appropriate?","qo":["Continue since no patient is visible","Continue if comments are disabled","Continue if followers are limited to classmates","Stop the broadcast and follow facility guidance, since patient information may be disclosed through audio"],"qc":3}},{"id":15,"cat":"digital","correct":1,"scores":[0,10,4],"cn":{"th":"⚡ Confidentiality ✔ — การเปิดเผยข้อมูลของผู้ป่วยเองไม่ได้เปลี่ยนหน้าที่รักษาความลับของบุคลากร","en":"⚡ Confidentiality ✔ — patient self-disclosure doesn't change a professional's duty of confidentiality"},"conflict":{"au":[false,true,false],"be":[false,true,false],"nm":[false,true,false],"ju":[false,true,true]},"th":{"e":"⭐","t":"รีวิวโรงพยาบาลออนไลน์","s":"ผู้ป่วยโพสต์รีวิวเชิงลบเกี่ยวกับการรักษาบนสื่อออนไลน์ ระบุชื่อพยาบาลและข้อมูลการเจ็บป่วยของตนเอง โดยมีข้อมูลบางส่วนที่คุณเห็นว่าไม่ตรงกับเหตุการณ์ที่เกิดขึ้น เพื่อนเสนอให้คุณตอบรีวิวเพื่อชี้แจงข้อเท็จจริง คุณควรทำอย่างไร?","c":["ตอบรีวิวเพื่อแก้ไขข้อมูลที่ไม่ถูกต้อง โดยเปิดเผยเฉพาะข้อมูลที่จำเป็น","ไม่ตอบโต้หรือเปิดเผยข้อมูลเกี่ยวกับการดูแลผู้ป่วยผ่านบัญชีส่วนตัว และแจ้งอาจารย์นิเทศ/พยาบาลผู้รับผิดชอบเพื่อดำเนินการผ่านช่องทางของหน่วยงาน","ขอให้ผู้ป่วยลบโพสต์"],"ic":["❌","✅","⚠️"],"w":["❌ ความต้องการแก้ไขข้อมูลที่ไม่ถูกต้องไม่ได้ทำให้การนำข้อมูลจากการดูแลผู้ป่วยไปเปิดเผยในพื้นที่สาธารณะเหมาะสมโดยอัตโนมัติ ควรใช้ช่องทางของหน่วยงานในการจัดการข้อร้องเรียนหรือการสื่อสารกับผู้ป่วย","✅ แม้ผู้ป่วยจะเปิดเผยข้อมูลเกี่ยวกับตนเองต่อสาธารณะ บุคลากรไม่ควรนำข้อมูลที่ได้รับจากบริบทการดูแลมาใช้ตอบโต้หรือชี้แจงผ่านพื้นที่สาธารณะด้วยตนเอง การตอบสนองควรดำเนินผ่านระบบที่เหมาะสมของหน่วยงาน","⚠️ ไม่ควรติดต่อผู้ป่วยด้วยตนเองเพื่อกดดันให้ลบ ควรดำเนินการตามนโยบายของหน่วยงาน"],"l":["หลัก Confidentiality — การเปิดเผยข้อมูลของผู้ป่วยเองไม่ได้เปลี่ยนหน้าที่รักษาความลับของบุคลากร","หลัก Professional Boundaries — ขอบเขตการสื่อสารทางวิชาชีพในพื้นที่ออนไลน์","หลัก Professional Responsibility — การจัดการข้อร้องเรียนผ่านช่องทางที่เหมาะสมของหน่วยงาน"],"r":["⏸️ Pause — หลีกเลี่ยงการโต้ตอบหรือชี้แจงข้อมูลการดูแลผ่านบัญชีส่วนตัว","🔒 Protect — ไม่เปิดเผยข้อมูลเพิ่มเติม แม้ผู้ป่วยจะเปิดเผยข้อมูลบางส่วนด้วยตนเองแล้ว","📢 Notify — แจ้งอาจารย์นิเทศ/พยาบาลผู้รับผิดชอบ","📋 Refer — ให้ข้อร้องเรียนหรือการสื่อสารดำเนินการตามระบบของหน่วยงาน"],"qq":"ผู้ป่วยโพสต์ข้อความสาธารณะวิจารณ์การดูแลของหอผู้ป่วย พร้อมเปิดเผยโรคของตนเอง และมีข้อมูลบางส่วนที่นักศึกษาทราบว่าไม่ตรงกับเหตุการณ์จริง นักศึกษาควรทำอย่างไรเหมาะสมที่สุด?","qo":["ตอบชี้แจงข้อเท็จจริงเฉพาะส่วนที่จำเป็น เพราะผู้ป่วยเปิดเผยโรคของตนเองแล้ว","ส่งข้อความส่วนตัวพร้อมภาพจากเวชระเบียนเพื่ออธิบายให้ผู้ป่วยเข้าใจ","ไม่ตอบด้วยข้อมูลจากการดูแลด้วยตนเอง และแจ้งผู้กำกับดูแลเพื่อดำเนินการผ่านช่องทางที่เหมาะสม","ให้เพื่อนตอบแทนโดยไม่ระบุว่าเป็นนักศึกษาของโรงพยาบาล"],"qc":2},"en":{"e":"⭐","t":"Online Hospital Review","s":"A patient posts a negative review online about their care, naming a nurse and disclosing their own illness. Some of the information, in your view, doesn't match what actually happened. A friend suggests you respond to the review to clarify the facts. What should you do?","c":["Respond to correct the inaccurate information, disclosing only what's necessary","Don't respond or disclose care-related information via a personal account, and notify the instructor/responsible nurse to handle it through the facility's channel","Ask the patient to delete the post"],"ic":["❌","✅","⚠️"],"w":["❌ Wanting to correct inaccurate information doesn't automatically make it appropriate to disclose information from patient care in a public space. Use the facility's channel for handling complaints or communicating with the patient.","✅ Even if a patient discloses information about themselves publicly, staff should not use information obtained from the care context to respond to or clarify things in public on their own. Response should go through the facility's appropriate system.","⚠️ Do not contact the patient yourself to pressure them into deleting it; act per facility policy instead."],"l":["Confidentiality — a patient's own disclosure doesn't change a staff member's duty of confidentiality","Professional Boundaries — the scope of professional communication in online spaces","Professional Responsibility — handling complaints through the facility's appropriate channel"],"r":["⏸️ Pause — avoid responding or clarifying care information via a personal account","🔒 Protect — do not disclose more, even though the patient has disclosed some information themselves","📢 Notify — notify the instructor/responsible nurse","📋 Refer — let complaints or communication go through the facility's system"],"qq":"A patient publicly criticizes their ward care and discloses their own illness, and some of what they say the student knows doesn't match what actually happened. What is most appropriate?","qo":["Respond to clarify just the necessary facts, since the patient already disclosed their illness","Send a private message with medical-record images to help the patient understand","Don't respond with care information yourself, and notify the supervisor to act through an appropriate channel","Have a friend respond instead without identifying as a student from the hospital"],"qc":2}},{"id":16,"cat":"family","correct":1,"scores":[0,10,4],"cn":{"th":"⚡ Autonomy + Veracity ✔ — Honesty ≠ information dumping; Compassion ≠ deception","en":"⚡ Autonomy + Veracity ✔ — Honesty ≠ information dumping; Compassion ≠ deception"},"conflict":{"au":[false,true,false],"be":[false,true,true],"nm":[true,true,false],"ju":[false,true,false]},"th":{"e":"💬","t":"ครอบครัวขอให้ซ่อนความจริงจากผู้ป่วย","s":"แพทย์ตัดสินใจไม่บอกผู้ป่วยว่าป่วยเป็นมะเร็งระยะสุดท้าย ครอบครัวเห็นด้วย แต่ผู้ป่วยถามคุณโดยตรง","c":["โกหก บอกว่าแค่ป่วยธรรมดา","รับฟังและสำรวจว่าผู้ป่วยเข้าใจสถานการณ์และต้องการทราบข้อมูลมากน้อยเพียงใด ตอบอย่างซื่อสัตย์ภายในขอบเขตบทบาท และรีบประสานทีมเพื่อให้ผู้ป่วยได้รับข้อมูลอย่างเหมาะสม","บอกความจริงทั้งหมดทันที"],"ic":["❌","✅","⚠️"],"w":["❌ การบอกข้อมูลเท็จละเมิด Veracity อย่างชัดเจน แม้เจตนาจะปกป้องผู้ป่วยหรือทำตามคำขอของครอบครัวก็ตาม","✅ ความซื่อสัตย์ต่อผู้ป่วยควรดำเนินควบคู่กับการประเมินความต้องการรับรู้ข้อมูล การสื่อสารอย่างเหมาะสม และการประสานทีม ไม่ใช่การหลีกเลี่ยงคำถามหรือปิดบังข้อมูล","⚠️ การเปิดเผยข้อมูลทั้งหมดทันทีโดยไม่สำรวจว่าผู้ป่วยรู้อะไรอยู่แล้วหรือพร้อมรับข้อมูลมากน้อยเพียงใด อาจไม่สอดคล้องกับแผนการสื่อสารของทีมและความต้องการที่แท้จริงของผู้ป่วย"],"l":["หลัก Autonomy — สิทธิผู้ป่วยรับรู้ข้อมูลเกี่ยวกับตนเอง","หลัก Veracity — ความซื่อสัตย์ต่อผู้ป่วย","หลัก Beneficence/Compassionate Communication — การสื่อสารที่คำนึงถึงความพร้อมของผู้ป่วย"],"r":["👂 Ask/Listen — รับฟังคำถามของผู้ป่วยโดยไม่หลบเลี่ยง","🔍 Explore — สำรวจว่าผู้ป่วยรู้อะไรอยู่แล้วและต้องการทราบอะไร","💬 Respond — ตอบอย่างซื่อสัตย์ในขอบเขตที่เหมาะสม ไม่โกหกหรือสร้างข้อมูลเท็จ","📢 Coordinate — ประสานแพทย์/พยาบาลผู้รับผิดชอบ/ทีมเพื่อการสื่อสารต่อเนื่อง","❤️ Support — อยู่กับผู้ป่วยและครอบครัว ช่วยจัดการความกังวลและความต้องการต่อไป"],"qq":"ครอบครัวขอให้ทีมไม่บอกการวินิจฉัยที่ร้ายแรงแก่ผู้ป่วยเพราะกลัวผู้ป่วยหมดกำลังใจ ต่อมาผู้ป่วยถามนักศึกษาว่า \"ทุกคนกำลังปิดบังอะไรฉันอยู่หรือเปล่า?\" แนวทางใดเหมาะสมที่สุด?","qo":["บอกข้อมูลทั้งหมดทันที เพราะผู้ป่วยมีสิทธิรู้","รับฟังและสำรวจว่าผู้ป่วยเข้าใจและต้องการรู้อะไร ตอบอย่างซื่อสัตย์ภายในขอบเขตบทบาท และประสานทีมเพื่อสื่อสารต่ออย่างเหมาะสม","บอกว่าไม่มีอะไร เพื่อไม่ให้ผู้ป่วยเครียด","บอกให้รอถามแพทย์และยุติการสนทนา"],"qc":1},"en":{"e":"💬","t":"Family Asks You to Hide the Truth","s":"A physician decides not to tell a patient they have terminal cancer. The family agrees, but the patient asks you directly.","c":["Lie and say it's just a minor illness","Listen and explore how much the patient understands and wants to know, answer honestly within your role, and promptly coordinate with the team so the patient receives appropriate information","Tell the full truth immediately"],"ic":["❌","✅","⚠️"],"w":["❌ Giving false information clearly violates Veracity, even with intent to protect the patient or comply with the family's request.","✅ Honesty toward the patient should go together with assessing their desire for information, appropriate communication, and team coordination — not avoiding the question or withholding information.","⚠️ Disclosing everything immediately without first exploring what the patient already knows or how much they're ready to receive may not align with the team's communication plan or the patient's actual needs."],"l":["Autonomy — the patient's right to know information about themselves","Veracity — honesty toward the patient","Beneficence/Compassionate Communication — communication that considers the patient's readiness"],"r":["👂 Ask/Listen — listen to the patient's question without avoiding it","🔍 Explore — explore what the patient already knows and wants to know","💬 Respond — answer honestly within an appropriate scope; don't lie or fabricate information","📢 Coordinate — coordinate with the physician/responsible nurse/team for continued communication","❤️ Support — stay with the patient and family, helping manage ongoing concerns and needs"],"qq":"A family asks the team not to tell the patient a serious diagnosis, fearing it will crush their spirit. Later the patient asks the student, \"Is everyone hiding something from me?\" What is most appropriate?","qo":["Tell them everything immediately, since the patient has a right to know","Listen and explore what the patient understands and wants to know, answer honestly within your role, and coordinate the team to communicate appropriately","Say there's nothing wrong, to avoid stressing the patient","Tell them to wait and ask the physician, then end the conversation"],"qc":1}},{"id":17,"cat":"family","correct":1,"scores":[4,10,8],"cn":{"th":"⚡ Confidentiality ✔ — Protect confidentiality ≠ ignore a safety concern; ปรึกษาทีมเสมอ","en":"⚡ Confidentiality ✔ — protecting confidentiality ≠ ignoring a safety concern; always consult the team"},"conflict":{"au":[false,true,true],"be":[false,true,true],"nm":[false,true,true],"ju":[false,true,true]},"th":{"e":"🔐","t":"ผู้ป่วยขอให้ปิดข้อมูล HIV จากสามี","s":"ผู้ป่วยที่ได้รับการวินิจฉัยว่าติดเชื้อ HIV ขอไม่ให้คุณเปิดเผยผลแก่คู่สมรส ระหว่างการสนทนาคุณเกิดความกังวลเกี่ยวกับสุขภาพของคู่สมรส","c":["บอกสามีทันทีเพื่อความปลอดภัยของเขา","ไม่เปิดเผยข้อมูลของผู้ป่วยแก่คู่สมรสด้วยตนเอง รับฟังและให้การสนับสนุนผู้ป่วยในการพิจารณาการสื่อสารกับคู่สมรส พร้อมแจ้งพยาบาลผู้รับผิดชอบ/ประสานทีมเพื่อดำเนินการตามแนวทางที่เหมาะสม","บอกแพทย์และให้แพทย์ตัดสินใจ"],"ic":["⚠️","✅","⚠️"],"w":["❌ ความสัมพันธ์ทางครอบครัวหรือการเป็นคู่สมรสไม่ได้ทำให้บุคคลนั้นสามารถเข้าถึงข้อมูลสุขภาพของผู้ป่วยได้โดยอัตโนมัติ การเปิดเผยข้อมูลต้องดำเนินการอย่างเหมาะสมผ่านกระบวนการที่เกี่ยวข้อง","✅ เมื่อความลับของผู้ป่วยเกี่ยวข้องกับความกังวลต่อความปลอดภัยของบุคคลอื่น นักศึกษาไม่ควรเปิดเผยข้อมูลแก่บุคคลนั้นหรือพยายามตัดสินข้อยกเว้นด้วยตนเอง ควรรักษาความลับในขอบเขตบทบาท สนับสนุนการสื่อสารที่เหมาะสม และรีบปรึกษาผู้รับผิดชอบ/ทีมเพื่อประเมินและดำเนินการตามระบบ","⚠️ การประสานแพทย์/ทีมเป็นสิ่งที่ควรทำ แต่ไม่ควรเป็นการโยนภาระทั้งหมดโดยไม่รักษาความลับหรือสนับสนุนผู้ป่วยระหว่างทาง ควรเริ่มจากไม่เปิดเผยข้อมูลเองและสนับสนุนผู้ป่วยไปพร้อมกัน"],"l":["หลัก Confidentiality — การรักษาความลับข้อมูลสุขภาพของผู้ป่วย","หลัก Non-maleficence + Professional Responsibility — การจัดการความขัดแย้งผ่านระบบที่เหมาะสม แทนการตัดสินใจคนเดียว","ข้อขัดแย้งเชิงจริยธรรม: Patient confidentiality ↔ concern for third-party safety — นักศึกษาไม่ควรตัดสินข้อยกเว้นด้วยตนเอง ควรปรึกษาทีมเสมอ"],"r":["🔒 Protect — ไม่เปิดเผยข้อมูลแก่คู่สมรสหรือบุคคลอื่นด้วยตนเอง","🔍 Explore — รับฟังเหตุผลและอุปสรรคที่ทำให้ผู้ป่วยไม่ต้องการเปิดเผย","🤝 Encourage — สนับสนุนการสื่อสารที่เหมาะสมโดยไม่บังคับหรือข่มขู่","📢 Consult — เมื่อมี concern ต่อความปลอดภัยของบุคคลอื่น ให้ปรึกษาผู้รับผิดชอบ/ทีม ไม่ตัดสินใจเปิดเผยเอง","❤️ Support — ดูแลผู้ป่วยต่อเนื่องโดยไม่ตีตราหรือลดคุณค่าของผู้ป่วย"],"qq":"ผู้ป่วยขอให้เก็บข้อมูลเกี่ยวกับโรคติดต่อของตนเป็นความลับ แต่ข้อมูลที่ได้รับทำให้นักศึกษากังวลว่าอาจเกี่ยวข้องกับความปลอดภัยของคู่สมรส แนวทางใดเหมาะสมที่สุด?","qo":["แจ้งคู่สมรสทันที เพราะความปลอดภัยสำคัญกว่าความลับเสมอ","รับปากว่าจะไม่พูดเรื่องนี้กับใครและไม่ดำเนินการเพิ่มเติม","ไม่เปิดเผยข้อมูลแก่คู่สมรสด้วยตนเอง รับฟังและสนับสนุนผู้ป่วย พร้อมปรึกษาผู้รับผิดชอบ/ทีมเพื่อดำเนินการอย่างเหมาะสม","บอกครอบครัวคนอื่นก่อนเพื่อให้ช่วยโน้มน้าวผู้ป่วย"],"qc":2},"en":{"e":"🔐","t":"Patient Asks to Hide HIV Status from Spouse","s":"A patient diagnosed with HIV asks you not to disclose the result to their spouse. During the conversation you become concerned about the spouse's health.","c":["Tell the spouse immediately for their safety","Do not disclose the patient's information to the spouse yourself; listen and support the patient in considering how to communicate with their spouse, and notify the responsible nurse/coordinate with the team to act appropriately","Tell the physician and let them decide"],"ic":["⚠️","✅","⚠️"],"w":["❌ Being a family member or spouse doesn't automatically grant access to a patient's health information. Disclosure must go through an appropriate process.","✅ When a patient's confidentiality intersects with a concern about a third party's safety, a student should not disclose to that person or try to decide the exception themselves. Maintain confidentiality within your role, support appropriate communication, and promptly consult the responsible party/team to assess and act per the system.","⚠️ Coordinating with the physician/team is something you should do, but it shouldn't mean offloading the entire matter without maintaining confidentiality or supporting the patient along the way. Start by not disclosing yourself and supporting the patient at the same time."],"l":["Confidentiality — maintaining confidentiality of the patient's health information","Non-maleficence + Professional Responsibility — manage the conflict through an appropriate system, not a solo decision","Ethical tension: Patient confidentiality ↔ concern for third-party safety — a student should not decide the exception themselves; always consult the team"],"r":["🔒 Protect — do not disclose information to the spouse or others yourself","🔍 Explore — listen to the reasons and barriers behind the patient's reluctance to disclose","🤝 Encourage — support appropriate communication without forcing or threatening","📢 Consult — when concerned about a third party's safety, consult the responsible party/team; don't decide to disclose yourself","❤️ Support — continue caring for the patient without stigma or diminishing their worth"],"qq":"A patient asks that information about their communicable disease be kept confidential, but what you learn makes you concerned it may relate to their spouse's safety. What is most appropriate?","qo":["Tell the spouse immediately, since safety always matters more than confidentiality","Promise not to tell anyone and take no further action","Do not disclose to the spouse yourself; listen and support the patient, and consult the responsible party/team to act appropriately","Tell other family members first to help persuade the patient"],"qc":2}},{"id":18,"cat":"family","correct":1,"scores":[4,10,0],"cn":{"th":"⚡ Beneficence/Caring ✔ — Compassion ≠ unilateral authority","en":"⚡ Beneficence/Caring ✔ — Compassion ≠ unilateral authority"},"conflict":{"au":[false,true,false],"be":[false,true,true],"nm":[true,true,false],"ju":[false,true,false]},"th":{"e":"👥","t":"ญาติขอเยี่ยมนอกเวลา ICU","s":"ญาติแจ้งว่าอาการผู้ป่วยทรุดลงและกังวลว่าอาจไม่มีโอกาสได้พบกันอีก แต่ขณะนั้นอยู่นอกเวลาเยี่ยม","c":["ปฏิเสธ ทำตามกฎวอร์ดอย่างเคร่งครัด","รับฟังเหตุผลและประเมินความต้องการของผู้ป่วย/ครอบครัว แล้วปรึกษาพยาบาลผู้รับผิดชอบเพื่อพิจารณาการเยี่ยมอย่างยืดหยุ่นตามสถานการณ์และแนวทางของหน่วยงาน","ให้เข้าได้เลย ใจดีกว่า"],"ic":["⚠️","✅","❌"],"w":["⚠️ การปฏิบัติตามระเบียบเป็นสิ่งสำคัญ แต่เมื่อมีสถานการณ์พิเศษควรประเมินความต้องการและปรึกษาผู้รับผิดชอบก่อน ไม่ควรปฏิเสธโดยอัตโนมัติโดยไม่พิจารณาบริบท","✅ ระเบียบการเยี่ยมมีความสำคัญต่อการดูแลและความปลอดภัย แต่การใช้ระเบียบไม่ควรเป็นไปอย่างตายตัวโดยไม่พิจารณาความต้องการเฉพาะของผู้ป่วยและครอบครัว ในสถานการณ์พิเศษ นักศึกษาควรรับฟังและนำความต้องการนั้นไปปรึกษาผู้มีหน้าที่ตัดสินใจ แทนการปฏิเสธหรืออนุญาตด้วยตนเอง","❌ การเห็นอกเห็นใจครอบครัวเป็นสิ่งเหมาะสม แต่นักศึกษาไม่ควรตัดสินใจยกเว้นแนวทางของหน่วยงานด้วยตนเอง ควรนำความต้องการนั้นไปปรึกษาผู้รับผิดชอบเพื่อหาทางออกที่เหมาะสม"],"l":["หลัก Beneficence/Caring — การดูแลด้วยความเห็นอกเห็นใจ","หลัก Respect for Persons + Professional Responsibility — เคารพความต้องการของผู้ป่วย/ครอบครัวภายในขอบเขตอำนาจของตน","แนวคิด Patient- and Family-Centered Care — ใช้วิจารณญาณตามบริบท ไม่ใช่การทำตามกฎอย่างตายตัวหรือละเลยกฎโดยสิ้นเชิง"],"r":["👂 Listen — รับฟังเหตุผลและความต้องการของผู้ป่วย/ครอบครัว","🔎 Assess — พิจารณาความเร่งด่วน สภาพผู้ป่วย และบริบทของหน่วยงาน","📞 Consult — ปรึกษาพยาบาลผู้รับผิดชอบ/ผู้มีอำนาจตัดสินใจ ไม่อนุญาตหรือปฏิเสธเองโดยอัตโนมัติ","🤝 Facilitate — หากเหมาะสม ช่วยให้ผู้ป่วยและครอบครัวได้พบกันภายใต้เงื่อนไขที่ปลอดภัยและเหมาะสม"],"qq":"ในช่วงที่หอผู้ป่วยจำกัดการเยี่ยมชั่วคราวเนื่องจากกำลังทำกิจกรรมการดูแล ญาติที่เดินทางมาจากต่างจังหวัดขอพบผู้ป่วยซึ่งมีอาการทรุดลงและอาจต้องย้ายไปดูแลในระดับที่สูงขึ้น นักศึกษาควรทำอย่างไรเหมาะสมที่สุด?","qo":["ปฏิเสธทันที เพราะช่วงนี้หน่วยงานจำกัดการเยี่ยม","อนุญาตให้เข้าเอง เพราะญาติเดินทางมาไกล","รับฟังและประเมินบริบท แล้วปรึกษาพยาบาลผู้รับผิดชอบเพื่อพิจารณาวิธีที่เหมาะสมในการสนับสนุนให้ผู้ป่วยและครอบครัวได้พบกัน","บอกให้ญาติรอจนกว่าหน่วยงานจะกลับเข้าสู่การเยี่ยมตามปกติโดยไม่ต้องแจ้งทีม"],"qc":2},"en":{"e":"👥","t":"Family Requests After-Hours ICU Visit","s":"A relative tells you the patient's condition has deteriorated and they're worried there may be no chance to see them again, but it's currently outside visiting hours.","c":["Refuse, strictly following ward policy","Listen to the reasons and assess the patient's/family's needs, then consult the responsible nurse to consider a flexible visit based on the situation and facility guidance","Let them in right away, it's kinder"],"ic":["⚠️","✅","❌"],"w":["⚠️ Following policy matters, but in an exceptional situation you should assess the need and consult the responsible party first, rather than refusing automatically without considering context.","✅ Visiting policy matters for care and safety, but shouldn't be applied rigidly without considering the specific needs of the patient and family. In an exceptional situation, a student should listen and bring the request to whoever has decision-making authority, rather than refusing or approving it themselves.","❌ Compassion for the family is appropriate, but a student should not decide to make an exception to facility policy on their own — bring the request to the responsible party to find an appropriate solution."],"l":["Beneficence/Caring — caring for people with compassion","Respect for Persons + Professional Responsibility — respect patient/family needs within the scope of your authority","Concept: Patient- and Family-Centered Care — use contextual judgment, not rigid rule-following or complete rule-bypassing"],"r":["👂 Listen — listen to the reasons and needs of the patient/family","🔎 Assess — consider urgency, the patient's condition, and the facility context","📞 Consult — consult the responsible nurse/decision-maker; don't approve or refuse automatically yourself","🤝 Facilitate — when appropriate, help the patient and family meet under safe and suitable conditions"],"qq":"While a ward temporarily restricts visits due to ongoing care activities, a relative who has traveled from another province asks to see a patient whose condition has deteriorated and who may need to be moved to a higher level of care. What is most appropriate?","qo":["Refuse immediately since the unit is currently restricting visits","Let them in yourself since the relative traveled far","Listen and assess the context, then consult the responsible nurse on an appropriate way to support the patient and family meeting","Tell the relative to wait until normal visiting resumes, without notifying the team"],"qc":2}},{"id":19,"cat":"family","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Autonomy (DNAR) ✔ — DNAR ≠ Do Not Care","en":"⚡ Autonomy (DNAR) ✔ — DNAR ≠ Do Not Care"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[true,true,false,false],"ju":[false,true,false,false]},"th":{"e":"📜","t":"แผน DNAR เมื่อครอบครัวขอให้ทำ CPR","s":"ผู้ป่วยระยะท้ายมีแผนการดูแลที่ทีมได้ยืนยันและบันทึกไว้อย่างชัดเจนว่า หากหัวใจหยุดเต้นจะไม่ทำ CPR ต่อมาผู้ป่วยเกิดภาวะหัวใจหยุดเต้น ขณะที่บุตรซึ่งอยู่ข้างเตียงร้องขอให้ทีม \"ช่วยปั๊มหัวใจทุกอย่าง\"","c":["เริ่ม CPR ตามที่ครอบครัวร้องขอ เพราะครอบครัวอยู่กับผู้ป่วยในขณะนั้น","ปฏิบัติตามแผน DNAR ที่ได้รับการยืนยัน แจ้งพยาบาลผู้รับผิดชอบ/ทีมทันที และช่วยสนับสนุนครอบครัวในช่วงวิกฤต โดยไม่ตัดสินใจเปลี่ยนแผนการดูแลด้วยตนเอง","ไม่ต้องให้การดูแลอื่นอีก เพราะผู้ป่วยมี DNAR","ให้นักศึกษาตัดสินใจยกเลิก DNAR ชั่วคราวจนกว่าครอบครัวจะตกลงกันได้"],"ic":["❌","✅","❌","❌"],"w":["❌ ความต้องการและความทุกข์ของครอบครัวควรได้รับการรับฟังและดูแล แต่เมื่อความประสงค์ของผู้ป่วยได้รับการยืนยันและมีแผนการดูแลที่ชัดเจนแล้ว ความต้องการของครอบครัวไม่ควรถูกใช้เปลี่ยนแผนนั้นโดยอัตโนมัติ","✅ ปฏิบัติตามแผน DNAR ที่ได้รับการยืนยันสะท้อนการเคารพความประสงค์ที่ผู้ป่วยแสดงไว้ล่วงหน้า (Respect for patient preferences) พร้อมประสานทีมและดูแลครอบครัวด้วยความเข้าใจ โดยไม่จัดการความขัดแย้งนี้เพียงลำพัง","❌ DNAR หมายถึงข้อกำหนดเกี่ยวกับการไม่เริ่มการกู้ชีพเมื่อหัวใจหรือการหายใจหยุด ไม่ได้หมายความว่าผู้ป่วยจะไม่ได้รับการดูแลด้านอื่น การบรรเทาอาการ ความสุขสบาย และการสนับสนุนยังคงมีความสำคัญ","❌ นักศึกษาไม่มีอำนาจในการเปลี่ยนแปลงหรือระงับแผนการดูแลที่ทีมยืนยันไว้ ควรแจ้งผู้รับผิดชอบทันทีเมื่อเกิดความขัดแย้ง"],"l":["หลัก Autonomy / Respect for Patient Preferences — เคารพความประสงค์ที่ผู้ป่วยแสดงไว้ล่วงหน้า","หลัก Beneficence + Compassionate End-of-Life Care — ดูแลด้วยความเข้าใจแม้ในภาวะวิกฤต","หลัก Professional Responsibility — ไม่เปลี่ยนแปลงแผนการดูแลด้วยตนเอง ประสานทีมเมื่อเกิดความขัดแย้ง"],"r":["🔍 Verify — ตรวจสอบว่าเป็นแผน DNAR ที่ได้รับการยืนยันและบันทึกไว้อย่างชัดเจน","📋 Follow — ปฏิบัติตามแผนการดูแลที่กำหนด ไม่เปลี่ยนแผนด้วยตนเอง","📢 Escalate — แจ้งพยาบาลผู้รับผิดชอบ/ทีมทันทีเมื่อเกิดความขัดแย้งกับครอบครัว","❤️ Care — ให้การดูแลที่เหมาะสมต่อเนื่องและสนับสนุนครอบครัวด้วยความเข้าใจ (DNAR ไม่ได้หมายถึงหยุดดูแล)"],"qq":"ผู้ป่วยระยะท้ายมีแผน DNAR ที่ได้รับการยืนยันและบันทึกไว้อย่างชัดเจน เมื่อผู้ป่วยเกิด cardiac arrest ครอบครัวร้องขอให้ทำ CPR แนวทางใดเหมาะสมที่สุด?","qo":["ทำ CPR ตามครอบครัวทันที เพราะครอบครัวสามารถเปลี่ยนความประสงค์ของผู้ป่วยได้","ปฏิบัติตามแผน DNAR ที่ได้รับการยืนยัน แจ้งทีม และให้การดูแล/สนับสนุนผู้ป่วยและครอบครัวต่อไป","ไม่ต้องให้การดูแลใดๆ อีก เพราะ DNAR หมายถึงยุติการรักษาทั้งหมด","รอให้ครอบครัวตกลงกันก่อนแล้วจึงตัดสินใจว่าจะปฏิบัติตาม DNAR หรือไม่"],"qc":1},"en":{"e":"📜","t":"DNAR Plan When Family Requests CPR","s":"A terminal patient has a care plan the team has verified and clearly documented that CPR will not be started if their heart stops. The patient then goes into cardiac arrest, and their child at the bedside begs the team, \"Please do everything to save them!\"","c":["Start CPR as the family requests, since they are with the patient right now","Follow the verified DNAR plan, notify the responsible nurse/team immediately, and support the family through the crisis, without deciding to change the care plan yourself","Provide no further care at all, since the patient has a DNAR","Let the student decide to temporarily override the DNAR until the family reaches agreement"],"ic":["❌","✅","❌","❌"],"w":["❌ The family's needs and distress should be heard and cared for, but once the patient's wishes have been confirmed with a clear care plan, the family's request should not automatically change that plan.","✅ Following the verified DNAR plan reflects respect for wishes the patient expressed in advance (Respect for patient preferences), while coordinating with the team and caring for the family with understanding, without handling this conflict alone.","❌ DNAR refers to not starting resuscitation when the heart or breathing stops — it does not mean the patient won't receive other care. Symptom relief, comfort, and support remain important.","❌ A student has no authority to change or override a care plan the team has verified. Notify the responsible party immediately when a conflict arises."],"l":["Autonomy / Respect for Patient Preferences — respect wishes the patient expressed in advance","Beneficence + Compassionate End-of-Life Care — care with understanding even in a crisis","Professional Responsibility — don't change the care plan yourself; coordinate with the team when conflict arises"],"r":["🔍 Verify — confirm this is a DNAR plan that has been verified and clearly documented","📋 Follow — follow the defined care plan; don't change it yourself","📢 Escalate — notify the responsible nurse/team immediately when conflict with family arises","❤️ Care — continue appropriate care and support the family with understanding (DNAR does not mean stopping care)"],"qq":"A terminal patient has a DNAR plan that has been verified and clearly documented. When the patient goes into cardiac arrest, the family asks for CPR. What is most appropriate?","qo":["Perform CPR immediately per the family, since family can change the patient's wishes","Follow the verified DNAR plan, notify the team, and continue caring for/supporting the patient and family","Provide no further care at all, since DNAR means ending all treatment","Wait for the family to agree among themselves before deciding whether to follow the DNAR"],"qc":1}},{"id":20,"cat":"team","correct":1,"scores":[0,10,4],"cn":{"th":"⚡ Advocacy + Dignity ✔ — Student status ≠ obligation to remain silent; ไม่มีสูตรตายตัวว่าต้องคุยก่อนเสมอ","en":"⚡ Advocacy + Dignity ✔ — student status ≠ obligation to remain silent; there's no fixed rule to always confront first"},"conflict":{"au":[false,true,true],"be":[false,true,true],"nm":[false,true,true],"ju":[false,true,true]},"th":{"e":"👁️","t":"เห็นพฤติกรรมผิดจรรยาบรรณของรุ่นพี่","s":"ระหว่างฝึกปฏิบัติ คุณเห็นพยาบาลรุ่นพี่พูดกับผู้ป่วยสูงอายุที่ถามคำถามซ้ำว่า \"บอกไปกี่ครั้งแล้ว ทำไมจำอะไรไม่ได้เลย\" ด้วยน้ำเสียงหงุดหงิด ขณะที่ผู้ป่วยเงียบลงและมีสีหน้ากังวล","c":["เพิกเฉย กลัวกระทบความสัมพันธ์","ให้ความสำคัญกับความปลอดภัยและศักดิ์ศรีของผู้ป่วย ตอบสนองต่อสถานการณ์อย่างเหมาะสมตามบทบาท และแจ้งอาจารย์นิเทศ/พยาบาลผู้รับผิดชอบตามความรุนแรงและบริบท","รายงานทันทีโดยไม่พูดกับรุ่นพี่"],"ic":["❌","✅","⚠️"],"w":["❌ การเป็นนักศึกษาไม่ได้หมายความว่าควรเพิกเฉยเมื่อพบพฤติกรรมที่อาจกระทบศักดิ์ศรีหรือความปลอดภัยของผู้ป่วย นักศึกษาควรตอบสนองภายในขอบเขตของตน และขอความช่วยเหลือจากผู้กำกับดูแลเมื่อจำเป็น","✅ วิธีตอบสนองควรพิจารณาความรุนแรง ความปลอดภัย ความสัมพันธ์เชิงอำนาจ และความสามารถของนักศึกษาในการจัดการสถานการณ์ หากสามารถสื่อสารโดยตรงได้อย่างปลอดภัยอาจทำได้ แต่หากไม่เหมาะสมควรขอความช่วยเหลือหรือรายงานต่อผู้รับผิดชอบ — ไม่มีสูตรตายตัวว่าต้องคุยกับผู้กระทำก่อนเสมอ","⚠️ การรายงานตรงอาจเหมาะสมในบางสถานการณ์ (เช่น รุนแรง เกิดซ้ำ หรือไม่ปลอดภัยที่จะพูดตรง) แต่ไม่ควรยึดเป็นกฎตายตัวเสมอไป ควรประเมินบริบทก่อนเลือกวิธีตอบสนอง"],"l":["หลัก Advocacy + Respect for Dignity — ปกป้องศักดิ์ศรีผู้ป่วยแม้ผู้กระทำมีอาวุโสกว่า","หลัก Professional Responsibility + Moral Courage — เลือกวิธีตอบสนองที่เหมาะสมกับบริบท ไม่ใช่การเผชิญหน้าเสมอไป"],"r":["👀 Recognize — สังเกตว่าพฤติกรรมกำลังกระทบศักดิ์ศรีหรือความปลอดภัยของผู้ป่วยอย่างไร","🛡️ Protect — ให้ความสำคัญกับผู้ป่วยและลดผลกระทบที่กำลังเกิดขึ้น","💬 Respond — หากปลอดภัยและเหมาะกับบทบาท อาจสื่อสารหรือจัดการสถานการณ์อย่างสุภาพ","📢 Escalate — หากรุนแรง เกิดซ้ำ ไม่ปลอดภัย หรือเกินความสามารถของนักศึกษา ให้แจ้งผู้กำกับดูแลตามระบบ","❤️ Support — กลับมารับฟังและดูแลผู้ป่วย ไม่ให้การจัดการเรื่องบุคลากรทำให้ลืมคนที่ได้รับผลกระทบ"],"qq":"ระหว่างฝึกปฏิบัติ นักศึกษาเห็นพยาบาลรุ่นพี่พูดตำหนิผู้ป่วยสูงอายุด้วยน้ำเสียงดูถูกจนผู้ป่วยเงียบและมีสีหน้ากังวล แนวทางใดเหมาะสมที่สุด?","qo":["ไม่ควรทำอะไร เพราะนักศึกษาไม่ควรแทรกแซงการทำงานของพยาบาลรุ่นพี่","ให้ความสำคัญกับผู้ป่วย ตอบสนองอย่างเหมาะสมภายในบทบาท และแจ้งผู้กำกับดูแลตามความรุนแรงและบริบท","โต้เถียงกับพยาบาลรุ่นพี่ทันทีต่อหน้าผู้ป่วยเพื่อแสดงว่าไม่เห็นด้วย","โพสต์เหตุการณ์ลงกลุ่มนักศึกษาเพื่อถามว่าควรรายงานหรือไม่"],"qc":1},"en":{"e":"👁️","t":"Witnessing a Senior's Unethical Behavior","s":"During placement, you see a senior nurse respond to an elderly patient who asks a question again with, \"How many times have I told you? Why can't you remember anything?\" in an irritated tone, while the patient falls silent and looks anxious.","c":["Ignore it, afraid of affecting the relationship","Prioritize the patient's safety and dignity, respond appropriately within your role, and notify the instructor/responsible nurse based on severity and context","Report immediately without speaking to the senior first"],"ic":["❌","✅","⚠️"],"w":["❌ Being a student doesn't mean you should ignore behavior that may harm a patient's dignity or safety. Respond within your role, and seek help from a supervisor when needed.","✅ How to respond should consider severity, safety, power dynamics, and your own ability to handle the situation. If safe direct communication is possible, you may do that; if not, seek help or report to the responsible party — there's no fixed rule that you must always talk to the person first.","⚠️ Reporting directly may be appropriate in some situations (e.g., severe, repeated, or unsafe to address directly), but shouldn't be treated as an absolute rule. Assess context before choosing a response."],"l":["Advocacy + Respect for Dignity — protecting patient dignity even when the person involved is more senior","Professional Responsibility + Moral Courage — choose a response appropriate to context, not always confrontation"],"r":["👀 Recognize — observe how the behavior is affecting the patient's dignity or safety","🛡️ Protect — prioritize the patient and reduce the ongoing impact","💬 Respond — if safe and appropriate to your role, communicate or handle the situation politely","📢 Escalate — if severe, repeated, unsafe, or beyond your ability, notify your supervisor per the system","❤️ Support — return to listening to and caring for the patient; don't let handling the staff issue make you forget who was affected"],"qq":"During placement, a student sees a senior nurse scold an elderly patient in a demeaning tone, causing the patient to fall silent and look anxious. What is most appropriate?","qo":["Do nothing, since a student shouldn't interfere with a senior nurse's work","Prioritize the patient, respond appropriately within your role, and notify a supervisor based on severity and context","Argue with the senior nurse immediately in front of the patient to show disagreement","Post about the incident in a student group chat to ask whether it should be reported"],"qc":1}},{"id":21,"cat":"team","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Non-maleficence ✔ — Report observations, not diagnoses","en":"⚡ Non-maleficence ✔ — report observations, not diagnoses"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[false,true,false,false],"ju":[false,true,false,false]},"th":{"e":"🍺","t":"สงสัยว่าบุคลากรอาจไม่พร้อมต่อการปฏิบัติงานอย่างปลอดภัย","s":"ระหว่างฝึกปฏิบัติงาน คุณสังเกตว่าแพทย์คนหนึ่งพูดไม่ชัด เดินไม่มั่นคง และมีกลิ่นคล้ายแอลกอฮอล์จากลมหายใจ ขณะกำลังจะเข้าตรวจผู้ป่วย","c":["รอจนมีหลักฐานแน่ชัดว่าแพทย์ดื่มสุราก่อนจึงรายงาน","แจ้งผู้รับผิดชอบโดยเร็ว โดยรายงานสิ่งที่สังเกตได้และความกังวลด้านความปลอดภัย โดยไม่สรุปสาเหตุเอง","ถามแพทย์ต่อหน้าผู้ป่วยทันทีว่า \"คุณหมอเมาหรือเปล่า?\"","ไม่ดำเนินการเพราะนักศึกษาไม่มีสิทธิประเมินแพทย์"],"ic":["❌","✅","❌","❌"],"w":["❌ นักศึกษาไม่มีหน้าที่พิสูจน์หรือวินิจฉัยสาเหตุ การรอให้แน่ใจอาจทำให้ผู้ป่วยตกอยู่ในความเสี่ยงนานขึ้น เมื่อมี reasonable safety concern ควรรายงานทันที","✅ รายงานสิ่งที่สังเกตได้และความกังวลด้านความปลอดภัยอย่างเป็นกลาง โดยไม่วินิจฉัยหรือกล่าวหาสาเหตุด้วยตนเอง — การรายงานข้อกังวลไม่เท่ากับการกล่าวหาว่าบุคคลนั้นกระทำผิด","❌ การเผชิญหน้าต่อหน้าผู้ป่วยอาจทำให้เกิดความขัดแย้ง ล่าช้าในการจัดการความเสี่ยง และเกินขอบเขตบทบาทของนักศึกษา","❌ การเพิกเฉยไม่ใช่ทางเลือกที่เหมาะสมเมื่อมีความกังวลด้านความปลอดภัยของผู้ป่วย นักศึกษาสามารถรายงานข้อสังเกตได้แม้ไม่มีอำนาจประเมินบุคลากรโดยตรง"],"l":["หลัก Non-maleficence / Patient Safety — ความปลอดภัยของผู้ป่วยมาก่อน","หลัก Professional Responsibility + Moral Courage — กล้ารายงานข้อกังวลผ่านช่องทางที่เหมาะสม","ทักษะ Objective Reporting — รายงานสิ่งที่สังเกตได้ ไม่ใช่ข้อสรุปหรือการวินิจฉัย"],"r":["👁️ Observe — แยกสิ่งที่เห็น/ได้ยิน/สังเกตออกจากข้อสรุป (เช่น พูดไม่ชัด เดินเซ กลิ่นคล้ายแอลกอฮอล์)","🛡️ Protect — หากมีความเสี่ยงต่อผู้ป่วย ให้ความปลอดภัยมาก่อน","📢 Report — แจ้ง concern ต่อพยาบาลผู้รับผิดชอบ/อาจารย์นิเทศหรือผู้เหมาะสมโดยเร็ว","⬆️ Escalate — หากความเสี่ยงยังไม่ได้รับการจัดการ ให้ดำเนินต่อผ่านระบบที่เหมาะสม ไม่ปล่อยผ่านเพราะบุคคลนั้นมีอำนาจสูงกว่า","🤝 Support — ให้ระบบดูแลทั้งความปลอดภัยของผู้ป่วยและบุคลากรที่อาจกำลังมีปัญหา"],"qq":"ระหว่างฝึกปฏิบัติ นักศึกษาสังเกตว่าแพทย์คนหนึ่งพูดไม่ชัด เดินไม่มั่นคง และมีกลิ่นคล้ายแอลกอฮอล์จากลมหายใจ ขณะที่กำลังจะดูแลผู้ป่วย แนวทางใดเหมาะสมที่สุด?","qo":["รอจนมีหลักฐานแน่ชัดว่าแพทย์ดื่มสุราก่อนจึงรายงาน","แจ้งผู้รับผิดชอบโดยเร็ว โดยรายงานสิ่งที่สังเกตได้และความกังวลด้านความปลอดภัย โดยไม่สรุปสาเหตุเอง","ถามแพทย์ต่อหน้าผู้ป่วยทันทีว่า \"คุณหมอเมาหรือเปล่า?\"","ไม่ดำเนินการเพราะนักศึกษาไม่มีสิทธิประเมินแพทย์"],"qc":1},"en":{"e":"🍺","t":"Concern a Staff Member May Not Be Fit for Duty","s":"During placement, you notice a physician slurring their speech, walking unsteadily, and smelling faintly of alcohol just before entering a patient exam.","c":["Wait until there's clear evidence the physician has been drinking before reporting","Notify the responsible party promptly, reporting what you observed and your safety concern, without concluding the cause yourself","Ask the physician directly in front of the patient, \"Are you drunk, doctor?\"","Take no action, since a student has no right to evaluate a physician"],"ic":["❌","✅","❌","❌"],"w":["❌ A student has no duty to prove or diagnose the cause. Waiting to be certain may leave the patient at risk longer. When there's a reasonable safety concern, report promptly.","✅ Report what you observed and your safety concern objectively, without diagnosing or accusing a cause yourself — reporting a concern is not the same as accusing someone of wrongdoing.","❌ Confronting them in front of the patient may create conflict, delay managing the risk, and exceed a student's role.","❌ Doing nothing is not appropriate when there's a patient-safety concern. A student can report an observation even without authority to formally evaluate the staff member."],"l":["Non-maleficence / Patient Safety — patient safety comes first","Professional Responsibility + Moral Courage — have the courage to report a concern through an appropriate channel","Skill: Objective Reporting — report what you observed, not a conclusion or diagnosis"],"r":["👁️ Observe — separate what you saw/heard/observed from any conclusion (e.g. slurred speech, unsteady gait, smell of alcohol)","🛡️ Protect — if there's risk to the patient, prioritize safety","📢 Report — notify the responsible nurse/instructor or appropriate person promptly","⬆️ Escalate — if the risk isn't addressed, continue through the appropriate system; don't let it pass because the person has more authority","🤝 Support — let the system look after both patient safety and the staff member who may be struggling"],"qq":"During placement, a student notices a physician slurring speech, walking unsteadily, and smelling faintly of alcohol while about to care for a patient. What is most appropriate?","qo":["Wait for clear evidence the physician has been drinking before reporting","Notify the responsible party promptly, reporting what was observed and the safety concern, without concluding a cause","Ask the physician directly in front of the patient, \"Are you drunk, doctor?\"","Take no action, since a student has no right to evaluate a physician"],"qc":1}},{"id":22,"cat":"team","correct":1,"scores":[0,10,0],"cn":{"th":"⚡ Moral Courage ✔ — Speaking up ≠ proving others wrong; Communication ≠ resolution","en":"⚡ Moral Courage ✔ — Speaking up ≠ proving others wrong; Communication ≠ resolution"},"conflict":{"au":[true,true,true],"be":[false,true,false],"nm":[false,true,false],"ju":[false,true,false]},"th":{"e":"🗣️","t":"ทีมมีความเห็นไม่ตรงกันในการรักษา","s":"ระหว่างทีมกำลังเตรียมส่งผู้ป่วยไปทำหัตถการ นักศึกษาสังเกตเห็นข้อมูลบางอย่างที่อาจเพิ่มความเสี่ยง แต่สมาชิกทีมคนอื่นเห็นว่าสามารถดำเนินการต่อได้","c":["เงียบ เพราะเป็นคนใหม่","แจ้งข้อกังวลด้านความปลอดภัยอย่างชัดเจนและสุภาพ พร้อมข้อมูลที่สังเกตได้ หากข้อกังวลยังไม่ได้รับการพิจารณา ให้สื่อสารซ้ำหรือขอความช่วยเหลือผ่านผู้รับผิดชอบตามความเหมาะสม","ออกจากห้องประชุมเพราะไม่เห็นด้วย"],"ic":["❌","✅","❌"],"w":["❌ การเป็นสมาชิกใหม่ไม่ได้ทำให้ข้อกังวลด้านความปลอดภัยมีคุณค่าน้อยลง ทุกคนในทีมมีหน้าที่สื่อสารเมื่อพบสิ่งที่อาจกระทบความปลอดภัยของผู้ป่วย","✅ การ speak up ไม่ได้หมายถึงการกล่าวหาว่าทีมตัดสินใจผิด แต่เป็นการนำข้อมูลหรือข้อกังวลด้านความปลอดภัยเข้าสู่การพิจารณาของทีม หากยังไม่ได้รับการตรวจสอบหรือแก้ไข ควรสื่อสารให้ชัดขึ้นหรือขอความช่วยเหลือต่อ ไม่ใช่ปล่อยผ่านเพียงเพราะพูดไปครั้งหนึ่งแล้ว","❌ การหลีกเลี่ยงสถานการณ์ไม่ได้ทำให้ข้อกังวลด้านความปลอดภัยได้รับการจัดการ"],"l":["หลัก Patient Safety + Professional Responsibility — ทุกคนในทีมมีหน้าที่สื่อสารข้อกังวลด้านความปลอดภัย","หลัก Moral Courage + Respectful Team Communication — กล้าพูดอย่างสุภาพโดยไม่ต้องพิสูจน์ว่าตนถูก","ทักษะ Speaking Up / Assertive Communication — เช่น การใช้ SBAR/CUS เพื่อสื่อสารอย่างเป็นระบบ"],"r":["🔍 Notice — ระบุให้ได้ว่ากังวลเรื่องอะไร และมีข้อมูลอะไรสนับสนุน","🗣️ Speak — แจ้ง concern อย่างชัดเจน สุภาพ และเน้น patient safety (เช่น \"หนูกังวลเรื่องความปลอดภัยของผู้ป่วยค่ะ เพราะ...\")","🔁 Clarify — หากทีมไม่เข้าใจหรือไม่ตอบสนอง ให้สื่อสารซ้ำโดยใช้ข้อมูลที่เฉพาะเจาะจงขึ้น","⬆️ Escalate — หากความเสี่ยงสำคัญยังไม่ได้รับการจัดการ ให้ขอความช่วยเหลือจากผู้กำกับดูแล/ผู้รับผิดชอบ","✅ Confirm — ตรวจสอบว่าข้อกังวลได้รับการรับรู้และมีการดำเนินการที่เหมาะสมแล้ว"],"qq":"ระหว่างทำงานกับทีม นักศึกษาสังเกตเห็นข้อมูลที่อาจเกี่ยวข้องกับความปลอดภัยของผู้ป่วย จึงแจ้งข้อกังวล แต่สมาชิกทีมตอบว่า \"ไม่เป็นไร ทำแบบเดิมต่อได้\" นักศึกษายังคงกังวลอยู่ ควรทำอย่างไรเหมาะสมที่สุด?","qo":["เงียบ เพราะได้แจ้งไปแล้วและทีมเป็นผู้รับผิดชอบ","ยืนยันว่าทีมตัดสินใจผิดและปฏิเสธทำงานต่อทันที","อธิบายข้อกังวลและข้อมูลที่พบให้ชัดเจนอีกครั้ง และหากยังไม่ได้รับการจัดการให้ขอความช่วยเหลือจากผู้กำกับดูแล/ผู้รับผิดชอบ","รอดูว่าผู้ป่วยจะเกิดอันตรายหรือไม่ก่อน แล้วค่อยรายงาน"],"qc":2},"en":{"e":"🗣️","t":"Team Disagreement Before a Procedure","s":"While the team is preparing to send a patient for a procedure, a student notices information that may increase risk, but other team members feel it's fine to proceed.","c":["Stay silent, since you're new","Clearly and politely raise the safety concern with the observed information; if the concern isn't addressed, restate it or seek help from the responsible party as appropriate","Leave the meeting room because you disagree"],"ic":["❌","✅","❌"],"w":["❌ Being a new team member doesn't make a safety concern less valid. Everyone on the team has a duty to communicate when they notice something that may affect patient safety.","✅ Speaking up doesn't mean accusing the team of deciding wrong — it means bringing information or a safety concern into the team's consideration. If it hasn't been addressed or resolved, communicate more clearly or seek further help, rather than letting it go just because you've spoken once already.","❌ Avoiding the situation doesn't get the safety concern addressed."],"l":["Patient Safety + Professional Responsibility — everyone on the team has a duty to communicate safety concerns","Moral Courage + Respectful Team Communication — have the courage to speak politely without needing to prove you're right","Skill: Speaking Up / Assertive Communication — e.g. using SBAR/CUS for systematic communication"],"r":["🔍 Notice — identify what you're concerned about and what information supports it","🗣️ Speak — raise the concern clearly, politely, and with an emphasis on patient safety","🔁 Clarify — if the team doesn't understand or respond, communicate again using more specific information","⬆️ Escalate — if a significant risk remains unaddressed, seek help from a supervisor/responsible party","✅ Confirm — verify the concern has been acknowledged and appropriately acted upon"],"qq":"While working with the team, a student notices information that may relate to patient safety and raises the concern, but a team member says, \"It's fine, let's keep going as planned.\" The student is still concerned. What is most appropriate?","qo":["Stay silent, since you already raised it and the team is responsible","Insist the team decided wrong and refuse to continue immediately","Explain the concern and the information found more clearly again, and if still not addressed, seek help from a supervisor/responsible party","Wait to see if harm occurs to the patient before reporting"],"qc":2}},{"id":23,"cat":"team","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Non-maleficence ✔ — Knowledge ≠ skill ≠ competence; รู้ขอบเขตตัวเองคือจริยธรรม","en":"⚡ Non-maleficence ✔ — Knowledge ≠ skill ≠ competence; knowing your limits IS ethics"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[false,true,false,false],"ju":[false,true,false,false]},"th":{"e":"🚫","t":"รับงานเกินความสามารถ","s":"หัวหน้ามอบหมายหัตถการที่คุณไม่เคยทำและยังไม่ได้รับการฝึกอบรม โดยบอกว่า \"ดูจาก YouTube แล้วทำได้เลย\"","c":["ทำตามที่ได้รับมอบหมาย เพราะผู้มอบหมายย่อมประเมินแล้วว่านักศึกษาทำได้","แจ้งอย่างตรงไปตรงมาว่ายังไม่เคยได้รับการฝึกหรือยังไม่ได้รับการประเมินความสามารถสำหรับหัตถการนี้ และขอคำแนะนำ การสอน หรือการกำกับดูแลที่เหมาะสมก่อนปฏิบัติ","ดูวิดีโอขั้นตอนอย่างละเอียดแล้วทำกับผู้ป่วยเอง เพราะมีแหล่งข้อมูลให้ศึกษาแล้ว","ปฏิเสธหัตถการทุกกรณีและไม่เข้าร่วมเรียนรู้ เพราะไม่เคยทำมาก่อน"],"ic":["❌","✅","❌","❌"],"w":["❌ การได้รับมอบหมายไม่ได้ทำให้ข้อจำกัดด้านความสามารถหายไป นักศึกษายังต้องประเมินความพร้อมของตนและแจ้งเมื่อจำเป็นต้องได้รับการสอนหรือกำกับเพิ่มเติม","✅ การรู้ขอบเขตความสามารถของตนและขอความช่วยเหลือเมื่อจำเป็น เป็นส่วนหนึ่งของการปฏิบัติอย่างรับผิดชอบ ไม่ใช่การหลีกเลี่ยงการเรียนรู้ แต่เป็นการทำให้การเรียนรู้เกิดขึ้นภายใต้การสอนและการกำกับที่เหมาะสม โดยไม่เพิ่มความเสี่ยงให้ผู้ป่วย","❌ การดูสื่อการสอนไม่เท่ากับการได้รับการฝึก ประเมิน competency และ supervision ที่เหมาะสมสำหรับการปฏิบัติกับผู้ป่วยจริง (Knowledge ≠ Skill ≠ Competence)","❌ นักศึกษามาฝึกปฏิบัติเพื่อเรียนรู้สิ่งที่ยังไม่เคยทำ การปฏิเสธเรียนรู้ทุกกรณีไม่ใช่คำตอบที่เหมาะสม ควรเรียนรู้ภายใต้การสอนและกำกับดูแลที่เหมาะสมแทน"],"l":["หลัก Professional Responsibility / Competence — รู้ขอบเขตความสามารถของตนเอง","หลัก Non-maleficence + Patient Safety — ไม่เพิ่มความเสี่ยงให้ผู้ป่วยจากการปฏิบัติโดยขาดความพร้อม","ทักษะ Recognizing Limits + Seeking Supervision — ขอการสอน/กำกับดูแลอย่างเหมาะสม"],"r":["🔍 Recognize — ประเมินว่าตนเคยได้รับการฝึกและมีความพร้อมสำหรับหัตถการนั้นหรือไม่","💬 Disclose — แจ้งข้อจำกัดของตนอย่างตรงไปตรงมา ไม่แสร้งว่าทำได้","🙋 Seek — ขอคำแนะนำ การสอน หรือ supervision ที่เหมาะสม","📚 Learn — ใช้แหล่งเรียนรู้ต่างๆ เพื่อเตรียมตัว โดยเข้าใจว่าสื่อออนไลน์เป็นเพียงส่วนหนึ่งของการเรียนรู้","✅ Perform — ปฏิบัติเมื่อมีความพร้อมและอยู่ภายใต้ระดับการกำกับที่เหมาะสม"],"qq":"นักศึกษาถูกขอให้ทำหัตถการที่เคยอ่านและดูวิดีโอสาธิต แต่ยังไม่เคยฝึกหรือได้รับการประเมินความสามารถ แนวทางใดเหมาะสมที่สุด?","qo":["ทำเอง เพราะเข้าใจขั้นตอนจากวิดีโอแล้ว","ปฏิเสธการเรียนหัตถการนี้ทั้งหมด เพราะยังไม่เคยทำ","แจ้งระดับประสบการณ์ของตนและขอการสอน/กำกับดูแลที่เหมาะสมก่อนปฏิบัติกับผู้ป่วย","ให้เพื่อนนักศึกษาที่เคยทำหนึ่งครั้งเป็นผู้รับรองว่าตนสามารถทำได้"],"qc":2},"en":{"e":"🚫","t":"Assigned a Procedure Beyond Your Competence","s":"A supervisor assigns you a procedure you've never performed and haven't been trained for, saying, \"Just watch it on YouTube and you'll be able to do it.\"","c":["Do as assigned, since whoever assigned it must have judged you capable","State honestly that you haven't been trained or assessed as competent for this procedure, and ask for guidance, teaching, or appropriate supervision before proceeding","Watch the video steps carefully and perform it on the patient yourself, since the resource is available","Refuse this procedure entirely and don't participate in learning it at all, since you've never done it"],"ic":["❌","✅","❌","❌"],"w":["❌ Being assigned something doesn't eliminate a competence gap. A student must still assess their own readiness and disclose when more teaching or supervision is needed.","✅ Knowing your competence boundaries and asking for help when needed is part of responsible practice — not avoiding learning, but making sure learning happens under appropriate teaching and supervision without adding risk to the patient.","❌ Watching instructional media is not the same as receiving training, having competency assessed, and appropriate supervision for practicing on a real patient (Knowledge ≠ Skill ≠ Competence).","❌ A student comes to placement to learn things they haven't done before. Refusing to learn under any circumstance isn't the right answer — learn under appropriate teaching and supervision instead."],"l":["Professional Responsibility / Competence — know the boundaries of your own competence","Non-maleficence + Patient Safety — don't add risk to the patient by practicing while unprepared","Skill: Recognizing Limits + Seeking Supervision — appropriately ask for teaching/supervision"],"r":["🔍 Recognize — assess whether you've been trained and are ready for this procedure","💬 Disclose — honestly disclose your limitations; don't pretend you can do it","🙋 Seek — ask for guidance, teaching, or appropriate supervision","📚 Learn — use various learning resources to prepare, understanding online media is only part of learning","✅ Perform — perform when ready and under an appropriate level of supervision"],"qq":"A student is asked to perform a procedure they've read about and watched a demonstration video of, but have never practiced or had their competency assessed. What is most appropriate?","qo":["Do it yourself, since you understand the steps from the video","Refuse to learn this procedure entirely, since you've never done it","Disclose your experience level and ask for appropriate teaching/supervision before practicing on a patient","Have a classmate who has done it once vouch that you can do it"],"qc":2}},{"id":24,"cat":"team","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Professional Accountability ✔ — Event time ≠ documentation time; Correct the record, don't rewrite its history","en":"⚡ Professional Accountability ✔ — Event time ≠ documentation time; correct the record, don't rewrite its history"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[false,true,false,false],"ju":[false,true,false,false]},"th":{"e":"📝","t":"ลืมบันทึกการให้ยา","s":"คุณลืมบันทึกการให้ยาผู้ป่วย 2 ชั่วโมงที่แล้ว เพื่อนแนะนำให้แก้เวลาให้ดูเหมือนบันทึกทันเวลา","c":["ปรับเวลาในระบบให้เหมือนว่าบันทึกไว้ตั้งแต่ตอนให้ยา เพราะเป็นเวลาที่ให้ยาจริง","แจ้งผู้กำกับดูแลตามความเหมาะสม และบันทึกข้อเท็จจริงด้วยวิธีที่ระบบกำหนดสำหรับข้อมูลที่ตกหล่น โดยไม่ทำให้ประวัติการบันทึกคลาดเคลื่อน","ไม่ต้องบันทึกแล้ว เพราะผ่านมานานและผู้ป่วยไม่มีอาการผิดปกติ","ขอให้เพื่อนที่อยู่ในเหตุการณ์เป็นผู้บันทึกแทน เพราะจะได้ไม่ปรากฏว่าตนลืมบันทึก"],"ic":["❌","✅","❌","❌"],"w":["❌ แม้เวลาที่ให้ยาจะเป็นข้อมูลจริง แต่การบันทึกย้อนหลังควรทำในลักษณะที่รักษาความถูกต้องและตรวจสอบย้อนกลับได้ตามระบบ ไม่ควรทำให้ดูเหมือนว่าการบันทึกเกิดขึ้นตรงเวลาทั้งที่ไม่ได้เกิดขึ้นจริง","✅ เมื่อพบว่าลืมบันทึก ควรแจ้งผู้กำกับดูแลและบันทึกข้อมูลตามข้อเท็จจริงโดยใช้วิธีแก้ไข/บันทึกย้อนหลังที่ระบบของสถานพยาบาลกำหนด — แก่นสำคัญคือรักษาความถูกต้องและตรวจสอบย้อนหลังได้ของบันทึก ไม่ใช่แค่การทำ Late Entry","❌ บันทึกไม่ครบถ้วนเป็นความผิดทางวิชาชีพ และอาจกระทบการดูแลต่อเนื่องของผู้ป่วย","❌ ข้อมูลอาจเป็นจริง แต่การให้ผู้อื่นบันทึกแทนเพื่อปกปิดว่าตนลืมบันทึกทำให้ประวัติการบันทึกไม่ตรงกับความเป็นจริงว่าใครทำอะไรเมื่อใด"],"l":["หลัก Professional Accountability + Integrity — รักษาความถูกต้องและโปร่งใสของบันทึก","หลัก Patient Safety — ข้อมูลที่ถูกต้องสำคัญต่อการดูแลต่อเนื่อง","ทักษะ Accurate and Transparent Documentation — แยกเวลาที่เหตุการณ์เกิดขึ้นจริงกับเวลาที่บันทึก และรักษาความสามารถในการตรวจสอบย้อนหลัง"],"r":["🔍 Recognize — เมื่อพบว่ามีข้อมูลที่ควรบันทึกแต่ตกหล่น อย่าเพิกเฉยหรือปกปิด","✅ Verify — ตรวจสอบข้อเท็จจริงที่จำเป็น เช่น ยา ขนาด และเวลาที่ให้จริงเท่าที่สามารถยืนยันได้","📢 Inform — แจ้งพยาบาลผู้รับผิดชอบ/อาจารย์นิเทศตามความเหมาะสม","📝 Document — บันทึกตามข้อเท็จจริงโดยใช้วิธี correction/late documentation ที่ระบบกำหนด และรักษาความสามารถในการตรวจสอบย้อนหลัง","🔄 Follow — ตรวจสอบว่าข้อมูลสำคัญต่อการดูแลต่อเนื่องได้รับการสื่อสารครบถ้วน"],"qq":"นักศึกษาพบว่าตนลืมบันทึกการให้ยาที่เกิดขึ้นก่อนหน้านี้ 2 ชั่วโมง และจำเวลาที่ให้ยาได้ แนวทางใดเหมาะสมที่สุด?","qo":["ปรับเวลาในระบบให้เหมือนว่าบันทึกไว้ตั้งแต่ตอนให้ยา เพราะเป็นเวลาที่ให้ยาจริง","ไม่ต้องบันทึกแล้ว เพราะผ่านมานานและผู้ป่วยไม่มีอาการผิดปกติ","แจ้งผู้กำกับดูแลตามความเหมาะสม และบันทึกข้อเท็จจริงด้วยวิธีที่ระบบกำหนดสำหรับข้อมูลที่ตกหล่น โดยไม่ทำให้ประวัติการบันทึกคลาดเคลื่อน","ขอให้เพื่อนที่อยู่ในเหตุการณ์เป็นผู้บันทึกแทน เพราะจะได้ไม่ปรากฏว่าตนลืมบันทึก"],"qc":2},"en":{"e":"📝","t":"Forgot to Document a Medication","s":"You forgot to document giving a patient medication 2 hours ago. A classmate suggests changing the timestamp to make it look like it was documented on time.","c":["Adjust the system time to look like it was documented right when the medication was given, since that's the true administration time","Notify your supervisor as appropriate, and document the facts using the method the system defines for missed entries, without distorting the documentation history","Don't bother documenting it now, since it's been a while and the patient shows no abnormal symptoms","Ask the classmate who was present to document it instead, so it won't show that you forgot"],"ic":["❌","✅","❌","❌"],"w":["❌ Even though the administration time is real, backdating an entry should be done in a way that preserves accuracy and traceability per the system — it should not be made to look like it was recorded on time when it wasn't.","✅ When you find you forgot to document, notify your supervisor and record the facts using the correction/late-entry method the facility's system defines — the key is preserving accuracy and traceability, not just doing \"a late entry.\"","❌ Incomplete documentation is a professional offense and may affect continuity of care.","❌ The information may be true, but having someone else document it to hide that you forgot makes the record inaccurate about who did what and when."],"l":["Professional Accountability + Integrity — maintain the accuracy and transparency of records","Patient Safety — accurate information matters for continuity of care","Skill: Accurate and Transparent Documentation — separate when the event actually occurred from when it was documented, and preserve traceability"],"r":["🔍 Recognize — when you find information that should have been documented was missed, don't ignore or hide it","✅ Verify — verify necessary facts, such as the medication, dose, and actual time given, to the extent you can confirm them","📢 Inform — notify the responsible nurse/instructor as appropriate","📝 Document — document the facts using the correction/late-documentation method the system defines, preserving traceability","🔄 Follow — check that information important to continuity of care has been fully communicated"],"qq":"A student finds they forgot to document giving medication 2 hours earlier and remembers the actual time given. What is most appropriate?","qo":["Adjust the system time to look like it was documented right when the medication was given, since that's the true time","Don't bother documenting anymore, since it's been a while and the patient shows no abnormal symptoms","Notify your supervisor as appropriate, and document the facts using the method the system defines for missed entries, without distorting the record","Ask the classmate who was present to document it instead, so it won't show that you forgot"],"qc":2}},{"id":25,"cat":"legal","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Confidentiality ✔ — Public figure ≠ reduced confidentiality; No name ≠ anonymous when context identifies the patient","en":"⚡ Confidentiality ✔ — being a public figure ≠ reduced confidentiality; no name ≠ anonymous when context identifies the patient"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[false,true,false,false],"ju":[false,true,false,false]},"th":{"e":"📰","t":"พยาบาลและสื่อมวลชน","s":"นักข่าวโทรมาถามข้อมูลเกี่ยวกับผู้ป่วยชื่อดังที่อยู่ในโรงพยาบาล","c":["ยืนยันได้ เพราะไม่ได้เปิดเผยการวินิจฉัย","ไม่ยืนยันหรือเปิดเผยข้อมูล และส่งต่อคำขอไปยังผู้รับผิดชอบตามระบบของสถานพยาบาล","ยืนยันได้ เพราะสื่อรายงานเรื่องการเข้ารักษาไปแล้ว","บอกได้เฉพาะว่าอาการคงที่โดยไม่พูดชื่อผู้ป่วย"],"ic":["❌","✅","❌","❌"],"w":["❌ การยืนยันว่าผู้ป่วยรักษาอยู่ที่นี่จริง ก็ถือเป็นการเปิดเผยข้อมูลเกี่ยวกับผู้ป่วยแล้ว แม้จะไม่ได้พูดถึงการวินิจฉัยก็ตาม","✅ ไม่เปิดเผย ไม่ยืนยัน และไม่เพิ่มเติมข้อมูลเกี่ยวกับการรับบริการหรือการรักษาของผู้ป่วยแก่บุคคลภายนอกโดยพลการ — ความเป็นบุคคลสาธารณะไม่ได้ทำให้ความเป็นส่วนตัวด้านสุขภาพหายไป ควรส่งต่อคำขอไปยังช่องทางที่สถานพยาบาลกำหนด","❌ แม้ข้อมูลบางส่วนจะปรากฏต่อสาธารณะแล้ว บุคลากรก็ไม่ควรใช้ข้อมูลที่ได้รับจากบทบาทในการดูแลมายืนยันหรือเพิ่มเติมข้อมูลแก่สื่อโดยพลการ","❌ การไม่พูดชื่อไม่ได้ทำให้ข้อมูลกลายเป็น anonymous เมื่อบริบททำให้ทราบอยู่แล้วว่าหมายถึงผู้ป่วยคนใด"],"l":["หลัก Confidentiality + Privacy — ความเป็นบุคคลสาธารณะไม่ลดมาตรฐานการรักษาความลับ","หลัก Professional Responsibility / Professional Boundaries — ส่งต่อคำขอผ่านช่องทางที่หน่วยงานกำหนด แทนการตอบเอง"],"r":["⏸️ Pause — อย่าตอบทันทีแม้ผู้ถามจะบอกว่าข้อมูลเป็นข่าวอยู่แล้ว","🔒 Protect — ไม่ยืนยัน ไม่เพิ่มเติม และไม่เปิดเผยข้อมูลผู้ป่วยจากบทบาทการดูแล","📤 Refer — ส่งต่อคำขอไปยังผู้รับผิดชอบ/ช่องทางที่สถานพยาบาลกำหนด"],"qq":"ผู้สื่อข่าวถามนักศึกษาว่าบุคคลมีชื่อเสียงที่มีข่าวว่าเข้ารักษาในโรงพยาบาลยังพักรักษาอยู่หรือไม่ และบอกว่า \"ไม่ต้องบอกโรคก็ได้ แค่ยืนยันว่าอยู่ที่นี่จริง\" นักศึกษาควรทำอย่างไรเหมาะสมที่สุด?","qo":["ยืนยันได้ เพราะไม่ได้เปิดเผยการวินิจฉัย","ยืนยันได้ เพราะสื่อรายงานเรื่องการเข้ารักษาไปแล้ว","ไม่ยืนยันหรือเปิดเผยข้อมูล และส่งต่อคำขอไปยังผู้รับผิดชอบตามระบบของสถานพยาบาล","บอกได้เฉพาะว่าอาการคงที่โดยไม่พูดชื่อผู้ป่วย"],"qc":2},"en":{"e":"📰","t":"Nurses and the Media","s":"A journalist calls asking about a well-known patient at the hospital.","c":["Confirm it, since you're not disclosing the diagnosis","Do not confirm or disclose information, and refer the request to the responsible party per the facility's system","Confirm it, since the media already reported the admission","Only say the condition is stable, without naming the patient"],"ic":["❌","✅","❌","❌"],"w":["❌ Confirming that a patient is actually receiving care here is itself disclosing information about that patient, even without mentioning the diagnosis.","✅ Do not disclose, confirm, or add information about a patient's admission or treatment to an outside party on your own initiative — being a public figure doesn't erase health privacy. Refer the request to the channel the facility designates.","❌ Even though some information has already appeared publicly, staff should not use information from their caregiving role to confirm or add to it for the media on their own initiative.","❌ Not saying the name doesn't make the information anonymous when the context already makes clear which patient is meant."],"l":["Confidentiality + Privacy — being a public figure doesn't lower the standard of confidentiality","Professional Responsibility / Professional Boundaries — refer the request through the facility's designated channel rather than answering yourself"],"r":["⏸️ Pause — don't answer immediately even if the asker says the information is already news","🔒 Protect — don't confirm, add to, or disclose patient information from your caregiving role","📤 Refer — refer the request to the responsible party/channel the facility designates"],"qq":"A journalist asks a student whether a well-known figure reported to be hospitalized is still admitted, saying, \"You don't have to say the illness, just confirm they're here.\" What is most appropriate?","qo":["Confirm it, since you're not disclosing the diagnosis","Confirm it, since the media already reported the admission","Do not confirm or disclose information, and refer the request to the responsible party per the facility's system","Only say the condition is stable, without naming the patient"],"qc":2}},{"id":26,"cat":"legal","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Patient consent ✔ — Patient consent ≠ professional authorization; Competence ≠ independent authorization","en":"⚡ Patient consent ✔ — Patient consent ≠ professional authorization; Competence ≠ independent authorization"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[false,true,false,false],"ju":[false,true,false,false]},"th":{"e":"🎓","t":"ขอบเขตนักศึกษาพยาบาล","s":"นักศึกษาพยาบาลเคยฝึกกิจกรรมการพยาบาลหนึ่งและสามารถปฏิบัติได้ภายใต้การกำกับดูแล แต่ตามแนวทางของแหล่งฝึกยังไม่ได้รับอนุญาตให้ทำกิจกรรมดังกล่าวโดยอิสระ ขณะที่พยาบาลผู้กำกับไม่อยู่ ผู้ป่วยบอกว่า \"ทำให้เลยก็ได้ ฉันไว้ใจคุณ\"","c":["ทำให้ผู้ป่วย เพราะเคยฝึกจนทำได้แล้ว","อธิบายว่าต้องดำเนินการตามระดับการกำกับที่กำหนด และประสานผู้รับผิดชอบก่อนปฏิบัติ","ทำได้เพราะผู้ป่วยรับทราบว่าเป็นนักศึกษาและยินยอมแล้ว","ปฏิเสธการทำกิจกรรมนี้ตลอดการฝึก เพราะนักศึกษาไม่ควรทำหัตถการกับผู้ป่วย"],"ic":["❌","✅","❌","❌"],"w":["❌ Previous experience ไม่ได้ทำให้เกิดการอนุญาตให้ปฏิบัติโดยอิสระโดยอัตโนมัติ ต้องพิจารณาระดับการกำกับที่แหล่งฝึกกำหนดสำหรับกิจกรรมนั้น","✅ นักศึกษาควรปฏิบัติกิจกรรมการพยาบาลภายในขอบเขตการเรียนรู้ ระดับสมรรถนะ และระดับการกำกับดูแลที่กำหนดโดยหลักสูตรและแหล่งฝึก แม้จะเคยทำได้ภายใต้การกำกับมาก่อน ก็ควรประสานผู้รับผิดชอบก่อนปฏิบัติโดยอิสระ","❌ ความยินยอมของผู้ป่วยมีความสำคัญ แต่ไม่ได้เปลี่ยนระดับความสามารถ ขอบเขตการเรียนรู้ หรือข้อกำหนดด้าน supervision ของนักศึกษา (Patient consent ≠ professional authorization)","❌ การปฏิเสธทำกิจกรรมนี้ตลอดไปไม่ใช่คำตอบที่เหมาะสม เพราะนักศึกษาสามารถปฏิบัติได้ภายใต้การกำกับที่เหมาะสม เป้าหมายคือเรียนรู้และปฏิบัติอย่างปลอดภัย ไม่ใช่หลีกเลี่ยงตลอดไป"],"l":["หลัก Professional Responsibility — รู้บทบาทและขอบเขตของตนโดยไม่ขยายเพียงเพราะมีคนขอให้ทำ","หลัก Patient Safety + Accountability — ปฏิบัติภายใต้ระดับการกำกับที่เหมาะสม","แนวคิด Scope of Learning / Appropriate Supervision — ระดับการกำกับกำหนดโดยหลักสูตรและแหล่งฝึก ไม่ใช่ดุลยพินิจของนักศึกษาเอง"],"r":["🧭 Know — รู้ระดับความสามารถและบทบาทของตน","✅ Check — ตรวจสอบว่ากิจกรรมนั้นต้องมี supervision ระดับใดในแหล่งฝึก","💬 Explain — อธิบายแก่ผู้ป่วยอย่างสุภาพ ไม่ทำให้รู้สึกว่าถูกปฏิเสธการดูแล","📞 Coordinate — ประสานพยาบาลผู้รับผิดชอบ/อาจารย์นิเทศ","👍 Perform — ปฏิบัติเมื่ออยู่ภายใต้เงื่อนไขและระดับการกำกับที่เหมาะสม"],"qq":"นักศึกษาพยาบาลเคยฝึกหัตถการหนึ่งจนสามารถทำได้ภายใต้การกำกับ แต่แหล่งฝึกยังกำหนดให้ต้องมีการกำกับสำหรับหัตถการนี้ ผู้ป่วยทราบว่าเป็นนักศึกษาและขอให้ทำให้โดยลำพัง ข้อใดเหมาะสมที่สุด?","qo":["ทำได้ เพราะผู้ป่วยให้ความยินยอมแล้ว","ทำได้ เพราะนักศึกษาเคยปฏิบัติหัตถการนี้สำเร็จมาก่อน","ปฏิบัติตามระดับการกำกับที่แหล่งฝึกกำหนด และประสานผู้รับผิดชอบก่อนดำเนินการ","ห้ามทำหัตถการนี้อีกจนกว่าจะสำเร็จการศึกษา"],"qc":2},"en":{"e":"🎓","t":"Scope of Nursing Student Practice","s":"A nursing student has practiced a nursing activity before and can perform it under supervision, but per the facility's guidance has not yet been authorized to do it independently. While the supervising nurse is away, the patient says, \"Just go ahead — I trust you.\"","c":["Do it for the patient, since you've already practiced it successfully","Explain that you must follow the required level of supervision, and coordinate with the responsible party before proceeding","Do it, since the patient knows you're a student and has consented","Refuse to do this activity for the entire placement, since students shouldn't perform procedures on patients"],"ic":["❌","✅","❌","❌"],"w":["❌ Previous experience doesn't automatically authorize independent practice — the level of supervision the facility requires for that activity still applies.","✅ A student should practice nursing activities within the scope of learning, competency level, and supervision level set by the curriculum and facility. Even if you've done it successfully under supervision before, coordinate with the responsible party before practicing independently.","❌ The patient's consent matters, but it doesn't change a student's competence level, scope of learning, or supervision requirements (Patient consent ≠ professional authorization).","❌ Refusing this activity forever isn't the right answer, since a student can practice it under appropriate supervision — the goal is to learn and practice safely, not avoid it indefinitely."],"l":["Professional Responsibility — know your role and boundaries without expanding them just because someone asks","Patient Safety + Accountability — practice under the appropriate level of supervision","Concept: Scope of Learning / Appropriate Supervision — the supervision level is set by the curriculum and facility, not the student's own discretion"],"r":["🧭 Know — know your competence level and role","✅ Check — check what level of supervision this activity requires at your facility","💬 Explain — explain to the patient politely, without making them feel their care is being refused","📞 Coordinate — coordinate with the responsible nurse/instructor","👍 Perform — perform when the appropriate conditions and level of supervision are met"],"qq":"A nursing student has practiced a procedure enough to do it under supervision, but the facility still requires supervision for this procedure. The patient knows they're a student and asks them to do it alone. What is most appropriate?","qo":["Do it, since the patient has consented","Do it, since the student has performed this procedure successfully before","Follow the level of supervision the facility requires, and coordinate with the responsible party before proceeding","Never perform this procedure again until graduation"],"qc":2}},{"id":27,"cat":"legal","correct":1,"scores":[0,10,0,0]
