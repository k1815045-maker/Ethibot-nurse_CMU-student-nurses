,"cn":{"th":"⚡ Professional Responsibility ✔ — Empathy ≠ admission; Threat of litigation ≠ end of patient care","en":"⚡ Professional Responsibility ✔ — Empathy ≠ admission; threat of litigation ≠ end of patient care"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[false,true,false,false],"ju":[false,true,false,false]},"th":{"e":"⚖️","t":"ผู้ป่วยขู่จะฟ้อง","s":"ผู้ป่วยไม่พอใจการดูแลและพูดกับคุณว่า \"ถ้าเรื่องนี้ไม่มีใครรับผิดชอบ ฉันจะร้องเรียนและฟ้องโรงพยาบาล\" คุณยังไม่ทราบข้อเท็จจริงทั้งหมดของเหตุการณ์","c":["อธิบายทันทีว่าโรงพยาบาลไม่ได้ทำผิด เพื่อป้องกันความเข้าใจผิด","รับฟังอย่างสงบ ไม่โต้เถียงหรือให้คำมั่นเกินบทบาท ประเมินว่ามีประเด็นด้านความปลอดภัยที่ต้องแก้ไขทันทีหรือไม่ และแจ้งผู้รับผิดชอบเพื่อดำเนินการตามระบบของสถานพยาบาล","รับปากว่าจะมีผู้รับผิดชอบค่าเสียหายเพื่อให้ผู้ป่วยสงบลง","หยุดสนทนาทันที เพราะเมื่อผู้ป่วยพูดถึงการฟ้องแล้วควรให้ฝ่ายกฎหมายเป็นผู้พูดเท่านั้น"],"ic":["❌","✅","❌","❌"],"w":["❌ นักศึกษายังไม่ทราบข้อเท็จจริงทั้งหมด การรีบปฏิเสธความรับผิดอาจทำให้ผู้ป่วยรู้สึกไม่ได้รับการรับฟัง และอาจไม่ตรงกับข้อเท็จจริงที่ยังไม่ได้ตรวจสอบ","✅ แสดงความเข้าใจโดยไม่ยอมรับหรือปฏิเสธข้อเท็จจริงที่ยังไม่ตรวจสอบ (เช่น \"เข้าใจว่าคุณกังวลกับสิ่งที่เกิดขึ้นค่ะ ดิฉันจะประสานพยาบาลผู้รับผิดชอบเพื่อให้เรื่องนี้ได้รับการตรวจสอบ\") หากข้อร้องเรียนเกี่ยวข้องกับความปลอดภัย ต้องให้ความสำคัญกับการประเมินและจัดการความปลอดภัยของผู้ป่วยก่อนหรือพร้อมกับการแจ้งผู้รับผิดชอบ","❌ การรับปากเรื่องความรับผิดหรือค่าเสียหายเกินบทบาทของนักศึกษา และอาจไม่ตรงกับข้อเท็จจริงที่ยังไม่ได้ตรวจสอบ","❌ ผู้ป่วยยังเป็นผู้ป่วยที่ต้องได้รับการดูแลต่อเนื่อง การหยุดสื่อสารทันทีอาจทำให้ concern ที่แท้จริงไม่ได้รับการรับฟังหรือจัดการ"],"l":["หลัก Professional Responsibility + Accountability — รับฟังและดำเนินการตามระบบโดยไม่ตัดสินล่วงหน้า","หลัก Respect for Persons + Patient Safety — ผู้ป่วยยังคงได้รับการดูแลต่อเนื่องแม้ไม่พอใจ","ทักษะ Complaint Handling / Therapeutic Communication — Empathy ไม่เท่ากับการยอมรับข้อเท็จจริงที่ยังไม่ตรวจสอบ"],"r":["👂 Listen — รับฟังโดยไม่โต้เถียง","🔎 Assess — หาว่าข้อร้องเรียนมีประเด็นความปลอดภัยหรือความต้องการเร่งด่วนหรือไม่","💬 Respond — แสดงความเข้าใจและอธิบายเฉพาะสิ่งที่อยู่ในบทบาท/ข้อเท็จจริงที่ทราบ","📢 Escalate — แจ้งพยาบาลผู้รับผิดชอบ/อาจารย์นิเทศ และเข้าสู่ระบบรับข้อร้องเรียนตามความเหมาะสม","📝 Document — บันทึกข้อเท็จจริงที่จำเป็นอย่างเป็นกลางตามระบบ (คำพูดที่ผู้ป่วยกล่าว ไม่ใช่การตัดสิน)"],"qq":"ผู้ป่วยไม่พอใจการดูแลและพูดกับนักศึกษาว่า \"ถ้าเรื่องนี้ไม่มีใครรับผิดชอบ ฉันจะร้องเรียนและฟ้องโรงพยาบาล\" นักศึกษายังไม่ทราบข้อเท็จจริงทั้งหมด แนวทางใดเหมาะสมที่สุด?","qo":["อธิบายทันทีว่าโรงพยาบาลไม่ได้ทำผิด เพื่อป้องกันความเข้าใจผิด","รับปากว่าจะมีผู้รับผิดชอบค่าเสียหายเพื่อให้ผู้ป่วยสงบลง","รับฟังข้อกังวล ประเมินว่ามีปัญหาด้านความปลอดภัยที่ต้องจัดการหรือไม่ และแจ้งผู้รับผิดชอบเพื่อดำเนินการตามระบบ","หยุดสนทนาทันที เพราะเมื่อผู้ป่วยพูดถึงการฟ้องแล้วควรให้ฝ่ายกฎหมายเป็นผู้พูดเท่านั้น"],"qc":2},"en":{"e":"⚖️","t":"Patient Threatens to Sue","s":"A patient is unhappy with their care and tells you, \"If no one takes responsibility for this, I'm going to file a complaint and sue the hospital.\" You don't yet know the full facts of the situation.","c":["Explain immediately that the hospital did nothing wrong, to prevent a misunderstanding","Listen calmly, without arguing or making promises beyond your role; assess whether there's a safety issue needing immediate attention, and notify the responsible party to act per the facility's system","Promise that someone will be held responsible for damages to calm the patient down","End the conversation immediately, since once a patient mentions suing, only legal staff should speak to them"],"ic":["❌","✅","❌","❌"],"w":["❌ You don't yet know the full facts. Rushing to deny responsibility may make the patient feel unheard, and may not match facts that haven't been verified yet.","✅ Show understanding without accepting or denying unverified facts (e.g., \"I understand you're concerned about what happened. I'll coordinate with the responsible nurse to have this looked into\"). If the complaint involves a safety issue, prioritize assessing and managing patient safety before or alongside notifying the responsible party.","❌ Promising liability or damages is beyond a student's role, and may not match facts that haven't been verified yet.","❌ The patient is still a patient who needs continued care. Ending communication immediately may mean the real concern goes unheard or unaddressed."],"l":["Professional Responsibility + Accountability — listen and act per the system without prejudging","Respect for Persons + Patient Safety — the patient still receives continued care even when unhappy","Skill: Complaint Handling / Therapeutic Communication — empathy is not the same as accepting unverified facts"],"r":["👂 Listen — listen without arguing","🔎 Assess — determine whether the complaint involves a safety issue or an urgent need","💬 Respond — show understanding and explain only what's within your role/what you know as fact","📢 Escalate — notify the responsible nurse/instructor and enter the complaint system as appropriate","📝 Document — objectively document necessary facts per the system (what the patient said, not a judgment)"],"qq":"A patient is unhappy with their care and tells a student, \"If no one takes responsibility for this, I'm going to file a complaint and sue the hospital.\" The student doesn't yet know the full facts. What is most appropriate?","qo":["Explain immediately that the hospital did nothing wrong, to prevent a misunderstanding","Promise that someone will be held responsible for damages to calm the patient down","Listen to the concern, assess whether there's a safety issue to address, and notify the responsible party to act per the system","End the conversation immediately, since once a patient mentions suing, only legal staff should speak to them"],"qc":2}},{"id":28,"cat":"legal","correct":3,"scores":[0,0,4,10],"cn":{"th":"⚡ Autonomy ✔ — Respect ≠ Agreement; Refusal of chemotherapy ≠ refusal of all care","en":"⚡ Autonomy ✔ — Respect ≠ Agreement; refusal of chemotherapy ≠ refusal of all care"},"conflict":{"au":[false,false,false,true],"be":[false,true,false,true],"nm":[false,false,false,false],"ju":[false,false,false,true]},"th":{"e":"🙅","t":"ผู้ป่วยปฏิเสธการรักษา","s":"ผู้ป่วยมะเร็งระยะท้ายที่รู้สึกตัวดีและสื่อสารรู้เรื่อง สามารถมีส่วนร่วมในการตัดสินใจได้ ปฏิเสธเคมีบำบัดทั้งที่แพทย์แนะนำ ครอบครัวขอให้คุณช่วยโน้มน้าวให้ผู้ป่วยยอมรับการรักษา","c":["ช่วยครอบครัวโน้มน้าว เพราะการรักษาต่อมีโอกาสเป็นประโยชน์ต่อผู้ป่วย","บอกครอบครัวว่าไม่มีสิทธิแสดงความคิดเห็นและยุติการสนทนา","รับการปฏิเสธทันทีโดยไม่ต้องสำรวจเพิ่มเติม เพราะเป็นสิทธิของผู้ป่วย","รับฟังเหตุผลและความเข้าใจของผู้ป่วย สนับสนุนให้ได้รับข้อมูลที่จำเป็นโดยไม่กดดัน และประสานทีมเพื่อวางแผนการดูแลตามการตัดสินใจของผู้ป่วย"],"ic":["❌","❌","⚠️","✅"],"w":["❌ การโน้มน้าวโดยใช้แรงกดดันจากครอบครัวหรือความกลัวอาจลดความเป็นอิสระในการตัดสินใจของผู้ป่วย การให้ข้อมูลและคำแนะนำทำได้ แต่ต้องไม่ใช้การบังคับหรือสร้างแรงกดดัน","❌ ครอบครัวที่ขอให้ช่วยพูดมักเกิดจากความรัก ความกลัว หรือความหวัง ไม่ควรถูกทำให้เป็นฝ่ายผิดหรือถูกปฏิเสธไม่ให้มีส่วนร่วม ควรรับฟังความกังวลของครอบครัวไปพร้อมกับให้การตัดสินใจของผู้ป่วยเป็นศูนย์กลาง","⚠️ การเคารพการปฏิเสธไม่ได้หมายถึงเพียงรับคำว่า \"ไม่\" แล้วจบ ควรสำรวจว่าผู้ป่วยเข้าใจสถานการณ์ ทางเลือก และผลที่อาจเกิดขึ้นหรือไม่ก่อน","✅ การเคารพ Autonomy คือการสนับสนุนให้ผู้ป่วยตัดสินใจอย่างมีข้อมูลและเป็นอิสระ ไม่ใช่การยอมรับแบบ passive หรือบังคับให้เปลี่ยนใจ — Refusal of chemotherapy ไม่เท่ากับ refusal of all care จึงควรประสานทีมเพื่อวางแผนการดูแลต่อเนื่องตามเป้าหมายของผู้ป่วย"],"l":["หลัก Autonomy — สนับสนุนการตัดสินใจอย่างมีข้อมูลและเป็นอิสระ ไม่ใช่การยอมรับแบบ passive","หลัก Beneficence + Respect for Persons — ให้ข้อมูลและคำแนะนำโดยไม่บังคับหรือสร้างแรงกดดัน","ทักษะ Informed Refusal / Shared Decision-Making — การประเมิน capacity ไม่ใช่การตัดสินจากว่าผู้ป่วยเลือกตรงกับคำแนะนำของทีมหรือไม่"],"r":["🔍 Explore — รับฟังว่าเหตุใดผู้ป่วยจึงไม่ต้องการรักษาต่อ และอะไรสำคัญต่อเขา","🧠 Assess — ประเมินความเข้าใจและสังเกตว่ามีเหตุให้สงสัยเรื่อง capacity หรือแรงกดดันหรือไม่","💬 Inform — ช่วยให้ได้รับข้อมูลที่จำเป็นภายในบทบาท และประสานผู้ที่เหมาะสมสำหรับข้อมูลเฉพาะการรักษา","🤝 Support — สนับสนุนการตัดสินใจโดยสมัครใจ ไม่บังคับให้เลือกตามทีม/ครอบครัว","👥 Coordinate — ประสานทีมเพื่อวางแผนการดูแลต่อเนื่องตามเป้าหมายของผู้ป่วย (ปฏิเสธคีโม ≠ ไม่ต้องดูแลต่อ)"],"qq":"ผู้ป่วยมะเร็งที่สามารถสื่อสารและตัดสินใจได้บอกว่าไม่ต้องการรับ chemotherapy ต่อ ครอบครัวขอให้นักศึกษาช่วยพูดให้ผู้ป่วยเปลี่ยนใจ แนวทางใดเหมาะสมที่สุด?","qo":["ช่วยครอบครัวโน้มน้าว เพราะการรักษาต่อมีโอกาสเป็นประโยชน์ต่อผู้ป่วย","บอกครอบครัวว่าไม่มีสิทธิแสดงความคิดเห็นและยุติการสนทนา","รับการปฏิเสธทันทีโดยไม่ต้องสำรวจเพิ่มเติม เพราะเป็นสิทธิของผู้ป่วย","รับฟังเหตุผลและความเข้าใจของผู้ป่วย สนับสนุนให้ได้รับข้อมูลที่จำเป็นโดยไม่กดดัน และประสานทีมเพื่อวางแผนการดูแลตามการตัดสินใจของผู้ป่วย"],"qc":3},"en":{"e":"🙅","t":"Patient Refuses Treatment","s":"A terminal cancer patient who is alert, communicative, and able to participate in decision-making refuses chemotherapy despite the physician's recommendation. The family asks you to help persuade the patient to accept treatment.","c":["Help the family persuade them, since continuing treatment may benefit the patient","Tell the family they have no right to weigh in and end the conversation","Accept the refusal immediately without exploring further, since it's the patient's right","Listen to the patient's reasons and understanding, support them in getting necessary information without pressure, and coordinate with the team to plan care per the patient's decision"],"ic":["❌","❌","⚠️","✅"],"w":["❌ Persuading using pressure from family or fear may reduce the patient's decision-making independence. Providing information and advice is fine, but should not involve coercion or pressure.","❌ A family asking you to help persuade often comes from love, fear, or hope — they shouldn't be treated as wrong or excluded from participating. Listen to their concerns while keeping the patient's decision central.","⚠️ Respecting a refusal doesn't just mean accepting \"no\" and moving on — you should first explore whether the patient understands the situation, options, and possible outcomes.","✅ Respecting Autonomy means supporting the patient to decide with information and independence, not passive acceptance or pressuring them to change their mind — refusal of chemotherapy ≠ refusal of all care, so coordinate with the team to plan continued care per the patient's goals."],"l":["Autonomy — support decisions made with information and independence, not passive acceptance","Beneficence + Respect for Persons — provide information and advice without coercion or pressure","Skill: Informed Refusal / Shared Decision-Making — assessing capacity is not the same as judging whether the patient chose in line with the team's recommendation"],"r":["🔍 Explore — listen to why the patient doesn't want to continue treatment and what matters to them","🧠 Assess — assess understanding and watch for reasons to question capacity or pressure","💬 Inform — help them get necessary information within your role, and refer to the right person for treatment-specific information","🤝 Support — support a voluntary decision; don't force them to choose per the team/family","👥 Coordinate — coordinate with the team to plan continued care per the patient's goals (refusing chemo ≠ no more care)"],"qq":"A cancer patient who can communicate and decide says they don't want to continue chemotherapy. The family asks the student to help change their mind. What is most appropriate?","qo":["Help the family persuade them, since continuing treatment may benefit the patient","Tell the family they have no right to weigh in and end the conversation","Accept the refusal immediately without exploring further, since it's the patient's right","Listen to the patient's reasons and understanding, support them in getting necessary information without pressure, and coordinate with the team to plan care per the patient's decision"],"qc":3}},{"id":29,"cat":"legal","correct":2,"scores":[0,0,10,0],"cn":{"th":"⚡ Research Integrity ✔ — Ethics approval ≠ automatic data access; Supervisor instruction ≠ automatic authorization","en":"⚡ Research Integrity ✔ — ethics approval ≠ automatic data access; supervisor instruction ≠ automatic authorization"},"conflict":{"au":[false,false,true,false],"be":[false,false,true,false],"nm":[false,false,true,false],"ju":[false,false,true,false]},"th":{"e":"🔬","t":"ขอบเขตนักศึกษาและการวิจัย","s":"อาจารย์ขอให้นักศึกษาช่วยรวบรวมข้อมูลจากเวชระเบียนผู้ป่วยสำหรับโครงการวิจัย โดยบอกว่าไม่จำเป็นต้องติดต่อผู้ป่วย นักศึกษายังไม่ทราบว่าโครงการได้รับการรับรองด้านจริยธรรมแล้วหรือไม่ และไม่ทราบว่ากระบวนการที่ได้รับอนุมัติกำหนดเรื่องการใช้ข้อมูลและความยินยอมไว้อย่างไร","c":["เก็บข้อมูลได้ เพราะอาจารย์เป็นผู้รับผิดชอบโครงการ","ปฏิเสธทันที เพราะงานวิจัยทุกชนิดต้องได้รับ consent จากผู้ป่วยเป็นรายบุคคลเสมอ","ยังไม่เริ่มเก็บข้อมูล และขอตรวจสอบว่าโครงการได้รับการรับรองแล้วหรือไม่ รวมถึงขอบเขตการเข้าถึงข้อมูลและกระบวนการ consent/waiver ที่ได้รับอนุมัติ","เก็บเฉพาะข้อมูลที่ไม่มีชื่อผู้ป่วยได้ทันที เพราะถือว่าไม่มีความเสี่ยงด้านจริยธรรม"],"ic":["❌","❌","✅","❌"],"w":["❌ การเป็นผู้รับผิดชอบโครงการไม่ได้ทำให้การเข้าถึงหรือเก็บข้อมูลถูกต้องโดยอัตโนมัติ นักศึกษายังควรตรวจสอบว่าโครงการได้รับการรับรองและมีขอบเขตอนุญาตอย่างไร","❌ การกำหนดว่า \"งานวิจัยทุกชนิดต้องได้รับ consent จากผู้ป่วยเป็นรายบุคคลเสมอ\" แคบเกินไป บางโครงการอาจได้รับ waiver of consent ตามที่คณะกรรมการจริยธรรมพิจารณาอนุมัติ ความสะดวกหรือข้อจำกัดด้านเวลาไม่ใช่เหตุผลให้ข้ามกระบวนการ แต่การตัดสินใจเรื่อง consent/waiver ก็ไม่ใช่สิ่งที่นักศึกษาตัดสินเองเช่นกัน","✅ ก่อนเข้าถึงหรือเก็บข้อมูลเพื่อการวิจัย ไม่ควรสรุปเองว่า \"มี consent จึงทำได้\" หรือ \"ไม่มี consent จึงทำไม่ได้เสมอ\" แต่ควรตรวจสอบว่าโครงการได้รับการรับรองอย่างไร ตนมีบทบาทและสิทธิเข้าถึงข้อมูลเพียงใด และกระบวนการ consent/waiver ที่ได้รับอนุมัติกำหนดไว้อย่างไร แล้วจึงดำเนินการภายในขอบเขตนั้น","❌ การเอาชื่อออกอาจช่วยลดความเสี่ยงด้าน privacy แต่ไม่ได้ทำให้สามารถเริ่มโครงการหรือเข้าถึงข้อมูลนอกกระบวนการที่ได้รับอนุมัติโดยอัตโนมัติ (De-identification เป็นเพียง safeguard ไม่ใช่ automatic authorization)"],"l":["หลัก Research Integrity + Professional Responsibility — ดำเนินการภายในขอบเขตของโครงการที่ได้รับอนุมัติ","หลัก Respect for Persons + Privacy/Confidentiality — คุ้มครองผู้เข้าร่วมวิจัยตามกระบวนการที่กำหนด","ทักษะ Responsible Conduct of Research — ตรวจสอบการรับรองและขอบเขตก่อนเริ่มเก็บข้อมูล ไม่ใช่ตัดสินใจเอง"],"r":["⏸️ Pause — หากยังไม่ทราบสถานะหรือขอบเขตของโครงการ อย่าเริ่มเก็บข้อมูลเพียงเพราะได้รับคำสั่ง","✅ Verify — ตรวจสอบว่าโครงการผ่านกระบวนการรับรองด้านจริยธรรมที่เกี่ยวข้องแล้วหรือไม่","🔍 Clarify — ตรวจสอบบทบาทของนักศึกษา ข้อมูลที่ได้รับอนุญาตให้เข้าถึง และกระบวนการ consent/waiver ที่ได้รับอนุมัติ","🔒 Protect — ใช้ข้อมูลเท่าที่จำเป็นและรักษาความเป็นส่วนตัว/ความลับตามกระบวนการของโครงการและหน่วยงาน","▶️ Proceed — เริ่มดำเนินการเมื่อบทบาทและกระบวนการได้รับการยืนยันแล้ว"],"qq":"นักศึกษาถูกขอให้ดึงข้อมูลผู้ป่วยจากเวชระเบียนเพื่อใช้ในโครงการวิจัย แต่ยังไม่ทราบรายละเอียดการรับรองโครงการและกระบวนการใช้ข้อมูล สิ่งใดเหมาะสมที่สุดก่อนเริ่มเก็บข้อมูล?","qo":["เก็บได้หากลบชื่อและเลขประจำตัวออกทั้งหมด","เก็บได้หากอาจารย์ผู้วิจัยเป็นผู้สั่งโดยตรง","ตรวจสอบการรับรองโครงการ ขอบเขตการเข้าถึงข้อมูล และกระบวนการ consent/waiver ที่ได้รับอนุมัติ","ปฏิเสธทุกกรณีที่ผู้ป่วยไม่ได้ลงนาม consent เป็นรายบุคคล"],"qc":2},"en":{"e":"🔬","t":"Student Scope and Research","s":"An instructor asks a student to help collect data from patient records for a research project, saying there's no need to contact patients. The student doesn't yet know whether the project has received ethics approval, or what the approved process specifies about data use and consent.","c":["Collect the data, since the instructor is responsible for the project","Refuse immediately, since all research always requires individual patient consent","Don't start collecting data yet, and ask to verify whether the project has been approved, including the scope of data access and the approved consent/waiver process","Collect only data without patient names right away, since that's considered ethically risk-free"],"ic":["❌","❌","✅","❌"],"w":["❌ Being responsible for the project doesn't automatically make accessing or collecting data proper. A student should still verify how the project was approved and what scope is permitted.","❌ Stating that \"all research always requires individual patient consent\" is too narrow — some projects may have an approved waiver of consent from the ethics committee. Convenience or time pressure isn't a reason to skip the process, but deciding on consent/waiver isn't something a student decides either.","✅ Before accessing or collecting data for research, don't assume \"there's consent so it's fine\" or \"there's no consent so it's never fine\" — verify how the project was approved, what role and data access rights you have, and what the approved consent/waiver process specifies, then proceed within that scope.","❌ Removing names may reduce privacy risk, but doesn't automatically let you start the project or access data outside the approved process (de-identification is a safeguard, not automatic authorization)."],"l":["Research Integrity + Professional Responsibility — act within the scope of the approved project","Respect for Persons + Privacy/Confidentiality — protect research participants per the defined process","Skill: Responsible Conduct of Research — verify approval and scope before collecting data; don't decide it yourself"],"r":["⏸️ Pause — if you don't know the project's status or scope, don't start collecting data just because you were told to","✅ Verify — check whether the project has passed the relevant ethics approval process","🔍 Clarify — verify your role, what data you're authorized to access, and the approved consent/waiver process","🔒 Protect — use only necessary data and maintain privacy/confidentiality per the project's and facility's process","▶️ Proceed — begin once your role and the process have been confirmed"],"qq":"A student is asked to pull patient data from records for a research project, but doesn't yet know the details of the project's approval or data-use process. What is most appropriate before starting to collect data?","qo":["Collect it if all names and ID numbers are removed","Collect it if the supervising researcher instructs directly","Verify the project's approval, the scope of data access, and the approved consent/waiver process","Refuse in every case where the patient hasn't individually signed consent"],"qc":2}},{"id":30,"cat":"clinical","correct":3,"scores":[0,0,0,10],"cn":{"th":"⚡ Non-maleficence + Autonomy ✔ — Agitation ≠ automatic dangerousness; Least restrictive first","en":"⚡ Non-maleficence + Autonomy ✔ — agitation ≠ automatic dangerousness; least restrictive approach first"},"conflict":{"au":[false,false,false,true],"be":[false,false,true,true],"nm":[false,false,false,true],"ju":[true,true,true,true]},"th":{"e":"🧠","t":"ผู้ป่วยจิตเวชปฏิเสธยาและเริ่มกระวนกระวาย","s":"ขณะดูแลผู้ป่วยในหอผู้ป่วยจิตเวช ผู้ป่วยปฏิเสธยาที่ได้รับตามแผนการรักษาและเริ่มพูดเสียงดังว่าไม่ต้องการรับยา คุณสังเกตว่าผู้ป่วยมีความกระวนกระวายมากขึ้น แต่ยังไม่ทราบสาเหตุของการปฏิเสธ","c":["ยืนยันให้ผู้ป่วยรับยาทันที เพราะการปฏิเสธยาแสดงว่าอาการทางจิตเวชกำลังรุนแรงขึ้น","ปล่อยผู้ป่วยไว้โดยไม่ประเมินเพิ่มเติม เพราะผู้ป่วยมีสิทธิปฏิเสธยา","ขอให้เจ้าหน้าที่ช่วยควบคุมตัวเพื่อให้ยา เพราะผู้ป่วยเริ่มพูดเสียงดัง","ประเมินความปลอดภัย สื่อสารอย่างสงบ สำรวจเหตุผลของการปฏิเสธ และประสานพยาบาลผู้รับผิดชอบ/ทีมตามระดับความเสี่ยง"],"ic":["❌","❌","❌","✅"],"w":["❌ การปฏิเสธยาไม่ได้แปลว่าอาการทางจิตเวชกำลังรุนแรงขึ้นเสมอไป การตีความ psychiatric diagnosis ว่าเป็นอันตรายหรือไม่มีความสามารถตัดสินใจโดยอัตโนมัติเป็นการตีตราที่ต้องหลีกเลี่ยง","❌ Autonomy ไม่ได้แปลว่าต้องปล่อยผ่านโดยไม่ประเมิน ควรสำรวจเหตุผลของการปฏิเสธและประเมินความเสี่ยงก่อน การนิ่งเฉยไม่ใช่การเคารพสิทธิที่แท้จริง","❌ การพูดเสียงดังเพียงอย่างเดียวยังไม่เพียงพอที่จะสรุปว่าต้องใช้การบังคับ ควรเริ่มจากแนวทางที่จำกัดผู้ป่วยน้อยที่สุด (least restrictive approach) เช่น การสื่อสารและลดความตึงเครียดก่อน เว้นแต่มีความเสี่ยงทันทีต่อความปลอดภัย","✅ การปฏิเสธยาและการแสดงความไม่พอใจไม่ควรถูกตีความโดยอัตโนมัติว่าผู้ป่วยไม่มีความสามารถตัดสินใจหรือต้องถูกบังคับ ควรเริ่มจากประเมินความปลอดภัย สื่อสารอย่างสงบ สำรวจเหตุผลก่อนสรุปว่าเกิดจากอาการทางจิตเวช และขอความช่วยเหลือจากทีมตามระดับความเสี่ยง"],"l":["หลัก Non-maleficence + Respect for Autonomy — ไม่ตีตราหรือบังคับโดยไม่จำเป็น","หลัก Beneficence + Respect for Dignity — รักษาความปลอดภัยโดยเคารพผู้ป่วยให้มากที่สุด","แนวคิด Least Restrictive Approach — เริ่มจากวิธีที่จำกัดเสรีภาพน้อยที่สุดก่อนมาตรการที่จำกัดมากกว่า"],"r":["🛡️ Safety — ประเมินว่ามีความเสี่ยงทันทีต่อตนเอง ผู้อื่น หรือทีมดูแลหรือไม่ และรักษาระยะ/สิ่งแวดล้อมให้เหมาะสม","🤝 Engage — สื่อสารอย่างสงบ ไม่เผชิญหน้าหรือใช้อำนาจโดยไม่จำเป็น","🔍 Explore — รับฟังเหตุผลที่ผู้ป่วยไม่ต้องการรับยา โดยไม่สรุปว่าเป็นเพราะโรคทางจิตเวชทันที","😌 De-escalate — ลดความตึงเครียดและใช้แนวทางที่จำกัดผู้ป่วยน้อยที่สุดเท่าที่เหมาะสมกับความปลอดภัย","📢 Escalate — ขอความช่วยเหลือจากพยาบาลผู้รับผิดชอบ/ทีมเมื่อความเสี่ยงสูงขึ้นหรือสถานการณ์เกินบทบาทของนักศึกษา"],"qq":"ผู้ป่วยในหอผู้ป่วยจิตเวชปฏิเสธยาที่เสนอให้และเริ่มพูดเสียงดังว่า \"ผมไม่เอา อย่ามาบังคับผม\" ยังไม่พบว่าผู้ป่วยกำลังทำร้ายตนเองหรือผู้อื่น นักศึกษาควรทำอย่างไรเหมาะสมที่สุด?","qo":["ให้เจ้าหน้าที่ช่วยจับผู้ป่วยเพื่อให้ยาก่อนที่สถานการณ์จะรุนแรง","เดินออกทันที เพราะผู้ป่วยปฏิเสธยาแล้ว","อธิบายว่าผู้ป่วยไม่มีสิทธิปฏิเสธยาขณะอยู่ในหอจิตเวช","รักษาระยะที่ปลอดภัย สื่อสารอย่างสงบ สำรวจเหตุผลของการปฏิเสธ และแจ้งผู้รับผิดชอบเพื่อประเมินและวางแผนต่อ"],"qc":3},"en":{"e":"🧠","t":"Psychiatric Patient Refuses Medication and Becomes Agitated","s":"While caring for a patient on a psychiatric ward, the patient refuses medication per their treatment plan and starts speaking loudly that they don't want it. You notice the patient becoming more agitated, but don't yet know the reason for the refusal.","c":["Insist the patient take the medication immediately, since refusing suggests the psychiatric condition is worsening","Leave the patient without further assessment, since the patient has a right to refuse medication","Ask staff to help physically restrain the patient to give the medication, since they've started raising their voice","Assess safety, communicate calmly, explore the reason for the refusal, and coordinate with the responsible nurse/team based on the level of risk"],"ic":["❌","❌","❌","✅"],"w":["❌ Refusing medication doesn't always mean the psychiatric condition is worsening. Automatically interpreting a psychiatric diagnosis as dangerous or lacking decision-making capacity is stigma to be avoided.","❌ Autonomy doesn't mean walking away without assessment. You should explore the reason for refusal and assess risk first — staying passive isn't genuine respect for rights.","❌ Raised speech alone isn't enough to conclude that force is needed. Start with the least restrictive approach — such as communication and de-escalation — unless there's an immediate safety risk.","✅ Refusing medication and expressing displeasure should not automatically be interpreted as the patient lacking capacity or needing to be forced. Start by assessing safety, communicating calmly, exploring the reason before assuming it's due to the psychiatric condition, and seeking team help based on the level of risk."],"l":["Non-maleficence + Respect for Autonomy — don't stigmatize or force unnecessarily","Beneficence + Respect for Dignity — maintain safety while respecting the patient as much as possible","Concept: Least Restrictive Approach — start with the least freedom-limiting method before more restrictive measures"],"r":["🛡️ Safety — assess whether there's immediate risk to yourself, others, or the care team, and maintain an appropriate distance/environment","🤝 Engage — communicate calmly; don't confront or use authority unnecessarily","🔍 Explore — listen to the reason the patient doesn't want the medication, without immediately assuming it's due to the psychiatric condition","😌 De-escalate — reduce tension and use the least restrictive approach appropriate to safety","📢 Escalate — seek help from the responsible nurse/team when risk increases or the situation exceeds your role"],"qq":"A patient on a psychiatric ward refuses offered medication and starts speaking loudly, \"I don't want it, don't force me.\" There's no sign yet of the patient harming themselves or others. What is most appropriate?","qo":["Have staff help restrain the patient to give medication before things get worse","Walk away immediately, since the patient has already refused","Explain that the patient has no right to refuse medication on a psychiatric ward","Maintain a safe distance, communicate calmly, explore the reason for the refusal, and notify the responsible party to assess and plan next steps"],"qc":3}}];

const today=new Date();

function setLang(l){
  lang=l;
  document.getElementById('btn-th').className='lbtn'+(l==='th'?' on':'');
  document.getElementById('btn-en').className='lbtn'+(l==='en'?' on':'');
  updateBotNavLabels();
  renderCurrentTab();
}
function updateBotNavLabels(){
  document.getElementById('bl-home').textContent=L('home');
  document.getElementById('bl-daily').textContent=L('daily');
  document.getElementById('bl-explore').textContent=L('explore');
  document.getElementById('bl-dash').textContent=L('dash');
}
function switchTab(t,keepExpSc){
  curTab=t;
  ['home','daily','explore','dashboard'].forEach(id=>{
    document.getElementById('bnav-'+id).classList.toggle('on',id===t);
  });
  if(t==='daily')renderDaily();
  else if(t==='explore')renderExplore();
  else if(t==='dashboard')renderDashboard();
  else renderHome();
  window.scrollTo(0,0);
}
function renderCurrentTab(){switchTab(curTab);}
function setContent(html){document.getElementById('main-content').innerHTML=html;}

function updateStats(){
  const pct=Math.round(st.done/30*100);
  const r=st.done>0?st.score/Math.max(st.done*10,1):0;
  let badge,col;
  if(st.done===0){badge='—';col='#888';}
  else if(r>=0.8){badge='🟢 Ethical';col='#27500A';}
  else if(r>=0.5){badge='🟡 Learning';col='#854F0B';}
  else{badge='🔴 Risk';col:'#A32D2D';}
}

function skipToExplore(){stopTimer();switchTab('explore');}
function startTimer(){
  stopTimer();timerSec=60;updateTimerUI();
  timerInt=setInterval(()=>{timerSec--;updateTimerUI();if(timerSec<=0){stopTimer();timeUp();}},1000);
}
function stopTimer(){clearInterval(timerInt);}
function updateTimerUI(){
  const f=document.getElementById('tfill'),n=document.getElementById('tnum'),w=document.getElementById('trw');
  if(!f||!n)return;
  f.style.strokeDashoffset=220*(1-timerSec/60);
  n.textContent=timerSec;
  if(timerSec<=10){f.style.stroke='#E24B4A';n.style.color='#E24B4A';if(w)w.classList.add('urgent');}
  else if(timerSec<=20){f.style.stroke='#BA7517';n.style.color='#BA7517';}
}
function timeUp(){
  document.querySelectorAll('[id^=dc]').forEach(b=>b.disabled=true);
  setTimeout(()=>{dcStep=1;renderDaily();},1500);
}
function pickDC(idx){
  if(dcDone)return;stopTimer();dcDone=true;dcPicked=idx;
  const s=dailySC,pts=s.scores[idx],ok=idx===s.correct;
  if(ok)st.streak++;else st.streak=0;
  st.score+=pts;
  if(!st.ids.has(s.id)){st.ids.add(s.id);st.done++;}
  logAttempt(s.id,s.cat,ok,pts,'daily');
  document.querySelectorAll('[id^=dc]').forEach((b,i)=>{
    b.disabled=true;
    if(i===s.correct)b.classList.add('correct');
    else if(i===idx&&i!==s.correct)b.classList.add(pts>0?'partial':'wrong');
  });
  setTimeout(()=>{dcStep=1;renderDaily();},1200);
}
function renderDCAnalysis(){
  const s=dailySC,d=lang==='th'?s.th:s.en,idx=dcPicked??s.correct;

// ── SHARED HELPERS ─────────────────────────────────────────────────
function stepBar(active){
  const names=lang==='th'?['สถานการณ์','ตัดสินใจ','วิเคราะห์','Quiz']:['Scenario','Decision','Analysis','Quiz'];
  return '<div class="steps">'+names.map((n,i)=>'<div class="step '+(i<active?'done':i===active?'active':'')+'"><div class="step-dot">'+(i<active?'✓':i+1)+'</div>'+n+'</div>').join('')+'</div>';
}
function principleChips(s,idx){
  const p=s.conflict,pn=['Autonomy','Beneficence','Non-maleficence','Justice'],pk=['au','be','nm','ju'];
  return pk.map((k,i)=>{
    const val=p[k][idx],a=p[k],hasT=a.some(v=>v),hasF=a.some(v=>!v);
    const cls=val?(hasT&&hasF?'conflict':'ok'):'fail';
    const ic=cls==='ok'?'✅':cls==='conflict'?'⚠️':'❌';
    const vd=cls==='ok'?L('uphold'):cls==='conflict'?L('conflict'):L('violated');
    return '<div class="pchip '+cls+'"><span style="font-size:16px">'+ic+'</span><div><div class="pname">'+pn[i]+'</div><div class="pv">'+vd+'</div></div></div>';
  }).join('');
}
function analysisHTML(s,d,idx,nextCmd,backCmd){
  const pts=s.scores[idx],ok=idx===s.correct,partial=pts>0&&!ok;
  const bn=ok?{bg:'#EAF3DE',ic:'✅',t:L('correct'),s:'+'+pts+'pts',c:'#27500A'}
            :partial?{bg:'#FAEEDA',ic:'⚠️',t:L('partial'),s:'+'+pts+'pts',c:'#854F0B'}
            :{bg:'#FCEBEB',ic:'❌',t:L('wrong'),s:'0pts',c:'#A32D2D'};
  return '<div class="card">'+stepBar(2)+'<div class="analysis">'
    +'<div class="result-banner" style="background:'+bn.bg+'">'
    +'<div style="font-size:26px;flex-shrink:0">'+bn.ic+'</div>'
    +'<div><div style="font-size:16px;font-weight:600;color:'+bn.c+'">'+bn.t+'</div>'
    +'<div style="font-size:14px;color:'+bn.c+'">'+bn.s+'</div></div></div>'
    +'<div><div class="slabel">💬 '+L('why')+'</div><div class="why-box">'+d.w[idx]+'</div></div>'
    +'<div><div class="slabel">⚖️ Ethical Conflict Analysis</div><div class="pgrid">'+principleChips(s,idx)+'</div></div>'
    +'<div class="cflict">'+s.cn[lang]+'</div>'
    +'<div><div class="slabel">§ '+L('laws')+'</div><div class="law-box">'+d.l.map(x=>'<div class="law-row">'+x+'</div>').join('')+'</div></div>'
    +'<div><div class="slabel">✅ Real Life</div><div class="real-box">'+d.r.map(r=>'<div class="real-item" onclick="this.querySelector(\'.chk\').classList.toggle(\'on\')"><div class="chk"></div>'+r+'</div>').join('')+'</div></div>'
    +'</div>'
    +'<div class="nav-row">'
    +(backCmd?'<button class="nbtn" onclick="'+backCmd+'">← '+L('retry')+'</button>':'')
    +'<button class="nbtn skip" onclick="startRandom();switchTab(\'explore\')">↷ '+L('skip')+'</button>'
    +'<button class="nbtn primary" onclick="'+nextCmd+'">Quiz →</button></div></div>';
}

function scenarioTitle_(id){
  const s=SC.find(x=>x.id===id);

  return d.t;
}
function renderDashboard(){
  setContent(
    '<div style="font-size:16px;font-weight:600;color:var(--txt);margin-bottom:10px;display:flex;align-items:center;gap:8px">📊 Analytics Dashboard</div>'
    +'<div style="padding:30px 10px;text-align:center;color:var(--txt3);font-size:13px">⏳ '+L('dash_loading')+'</div>'
  );

  if(!WEBAPP_URL||WEBAPP_URL.indexOf('PASTE_YOUR')===0){
    setContent(
      '<div style="font-size:16px;font-weight:600;color:var(--txt);margin-bottom:10px;display:flex;align-items:center;gap:8px">📊 Analytics Dashboard</div>'
      +'<div class="ins-card" style="background:#FCEBEB;border:0.5px solid #F09595"><span style="font-size:18px;flex-shrink:0">⚠️</span><span style="font-size:14px;color:#A32D2D;line-height:1.65">'+L('dash_error')+' (WEBAPP_URL ยังไม่ได้ตั้งค่าในโค้ด)</span></div>'
    );
    return;
  }

  fetch(WEBAPP_URL)
    .then(r=>r.json())
    .then(data=>{
      if(curTab!=='dashboard')return; // ผู้ใช้เปลี่ยนแท็บไปแล้วระหว่างรอโหลด
      if(!data.ok){renderDashError();return;}
      if(!data.hasData){renderDashEmpty();return;}
      renderDashReal(data);
    })
    .catch(()=>{ if(curTab==='dashboard')renderDashError(); });
}
function renderDashError(){
  setContent(
    '<div style="font-size:16px;font-weight:600;color:var(--txt);margin-bottom:10px;display:flex;align-items:center;gap:8px">📊 Analytics Dashboard</div>'
    +'<div class="ins-card" style="background:#FCEBEB;border:0.5px solid #F09595"><span style="font-size:18px;flex-shrink:0">⚠️</span><span style="font-size:14px;color:#A32D2D;line-height:1.65">'+L('dash_error')+'</span></div>'
    +'<div class="nav-row"><button class="nbtn primary" onclick="renderDashboard()">↺ '+(lang==='th'?'ลองใหม่':'Retry')+'</button></div>'
  );
}
function renderDashEmpty(){
  setContent(
    '<div style="font-size:16px;font-weight:600;color:var(--txt);margin-bottom:10px;display:flex;align-items:center;gap:8px">📊 Analytics Dashboard</div>'
    +'<div class="ins-card" style="background:#EAF3DE;border:0.5px solid #B8D9A0"><span style="font-size:18px;flex-shrink:0">📭</span><span style="font-size:14px;color:#27500A;line-height:1.65">'+L('dash_nodata')+'</span></div>'
  );
}
function renderDashReal(data){
  const missedRows=(data.mostMissed||[]).map(m=>{
    const cInfo=CAT[m.cat]||{fg:'#666'};
    return '<div class="bar-row"><div class="bar-lbl">'+scenarioTitle_(m.id)+'</div><div class="bar-bg"><div class="bar-fill" style="width:'+m.wrongPct+'%;background:'+cInfo.fg+'"></div></div><div class="bar-pct">'+m.wrongPct+'%</div></div>';
  }).join('') || '<div style="font-size:12px;color:var(--txt3)">'+(lang==='th'?'ยังไม่มีข้อมูลเพียงพอ':'Not enough data yet')+'</div>';

  const topMissed=(data.mostMissed&&data.mostMissed[0])?data.mostMissed[0]:null;
  const insightCard=topMissed
    ? '<div class="ins-card" style="background:#FCEBEB;border:0.5px solid #F09595"><span style="font-size:18px;flex-shrink:0">🚨</span><span style="font-size:14px;color:#A32D2D;line-height:1.65"><strong>'+topMissed.wrongPct+'%</strong> '+(lang==='th'?'ตอบผิด scenario':'wrong on scenario')+' "'+scenarioTitle_(topMissed.id)+'"</span></div>'
    : '';

  setContent(
    '<div style="font-size:16px;font-weight:600;color:var(--txt);margin-bottom:10px;display:flex;align-items:center;gap:8px">📊 Analytics Dashboard'
    +'<span style="font-size:11px;font-weight:400;color:#27500A;background:#EAF3DE;padding:2px 8px;border-radius:999px">🟢 '+L('dash_live')+'</span></div>'
    +'<div class="kpi-g">'
    +'<div class="kpi"><div class="kpi-n" style="color:#A32D2D">'+data.scenariosDone+'</div><div class="kpi-l">'+(lang==='th'?'Scenarios ทำแล้ว':'Scenarios Done')+'</div></div>'
    +'<div class="kpi"><div class="kpi-n" style="color:#185FA5">'+data.avgScore+'</div><div class="kpi-l">'+(lang==='th'?'คะแนนเฉลี่ย':'Avg Score')+'</div></div>'
    +'<div class="kpi"><div class="kpi-n" style="color:#854F0B">'+data.wrongFirstTryPct+'%</div><div class="kpi-l">'+(lang==='th'?'ตอบผิดครั้งแรก':'Wrong 1st Try')+'</div></div></div>'
    +'<div style="font-size:12px;color:var(--txt3);margin-bottom:14px">👥 '+data.uniqueStudents+' '+L('students')+' · 📝 '+data.totalAttempts+' '+L('attempts')+'</div>'
    +'<div style="font-size:14px;font-weight:500;color:var(--txt2);margin-bottom:8px">⚠️ '+L('most_missed')+'</div>'
    +'<div class="bar-chart">'+missedRows+'</div>'
    +insightCard
    +'<div style="font-size:14px;font-weight:500;color:var(--txt2);margin-bottom:8px">🏅 Badge Distribution</div>'
    +'<div class="badge-row">'
    +'<div class="badge-card" style="background:#EAF3DE"><div style="font-size:20px">🟢</div><div style="font-size:14px;font-weight:500;color:#27500A">Ethical Nurse</div><div style="font-size:11px;color:#3B6D11">'+data.badges.green+' '+L('users')+'</div></div>'
    +'<div class="badge-card" style="background:#FAEEDA"><div style="font-size:20px">🟡</div><div style="font-size:14px;font-weight:500;color:#854F0B">Learning</div><div style="font-size:11px;color:#BA7517">'+data.badges.yellow+' '+L('users')+'</div></div>'
    +'<div class="badge-card" style="background:#FCEBEB"><div style="font-size:20px">🔴</div><div style="font-size:14px;font-weight:500;color:#A32D2D">Risk Zone</div><div style="font-size:11px;color:#E24B4A">'+data.badges.red+' '+L('users')+'</div></div></div>'
    +'<div class="nav-row"><button class="nbtn" onclick="renderDashboard()">↺ '+(lang==='th'?'รีเฟรช':'Refresh')+'</button></div>'
  );
}

renderHome();
</script>
</body>
</html>
