
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EthiBot Nurse — CMU Nursing Ethics</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --red:#A32D2D;--red-l:#FCEBEB;--red-m:#F09595;
  --green:#27500A;--green-l:#EAF3DE;--green-m:#97C459;
  --amber:#633806;--amber-l:#FAEEDA;--amber-m:#EF9F27;
  --blue:#0C447C;--blue-l:#E6F1FB;--blue-m:#85B7EB;
  --purple:#3C3489;--purple-l:#EEEDFE;--purple-m:#AFA9EC;
  --bg:#FFFFFF;--bg2:#F7F7F5;--bg3:#F1EFE8;
  --txt:#1A1A1A;--txt2:#555552;--txt3:#888780;
  --bdr:rgba(0,0,0,0.12);--bdr2:rgba(0,0,0,0.2);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1C1C1E;--bg2:#2C2C2E;--bg3:#3A3A3C;--txt:#F2F2F7;--txt2:#AEAEB2;--txt3:#636366;--bdr:rgba(255,255,255,0.12);--bdr2:rgba(255,255,255,0.2)}
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.5}

/* LAYOUT */
.app{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(60px + env(safe-area-inset-bottom,8px))}
.hdr{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:0.5px solid var(--bdr);position:sticky;top:0;background:var(--bg);z-index:10}
.hdr-logo{width:38px;height:38px;border-radius:10px;background:var(--red-l);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.hdr-title{font-size:16px;font-weight:600;color:var(--txt)}
.hdr-sub{font-size:12px;color:var(--txt2)}
.lang-sw{margin-left:auto;display:flex;border:0.5px solid var(--bdr2);border-radius:8px;overflow:hidden;flex-shrink:0}
.lbtn{padding:5px 12px;font-size:14px;font-weight:500;border:none;cursor:pointer;background:var(--bg);color:var(--txt2);font-family:inherit}
.lbtn.on{background:var(--red);color:#FCEBEB}
.content{flex:1;padding:12px 16px;overflow-y:auto}

/* BOTTOM NAV — always visible */
.bot-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:0.5px solid var(--bdr);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom,0)}
.bot-nav-inner{max-width:600px;margin:0 auto;display:flex;width:100%}
.bnav{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border:none;background:none;cursor:pointer;font-family:inherit;color:var(--txt3);font-size:10px;gap:2px;transition:color .15s}
.bnav-ico{font-size:22px;line-height:1}
.bnav.on{color:var(--red)}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 16px 8px}
.stat{background:var(--bg2);border-radius:8px;padding:8px 4px;text-align:center}
.stat-n{font-size:18px;font-weight:600;line-height:1}
.stat-l{font-size:10px;color:var(--txt2);margin-top:3px}
.prog-row{display:flex;align-items:center;gap:10px;padding:0 16px 10px}
.prog-bg{flex:1;background:var(--bg3);border-radius:999px;height:5px;overflow:hidden}
.prog-fill{height:5px;border-radius:999px;background:var(--red);transition:width .5s}

/* CARDS */
.card{background:var(--bg);border:0.5px solid var(--bdr);border-radius:14px;overflow:hidden;margin-bottom:10px}
.dc-hdr{background:var(--red);padding:12px 16px;display:flex;align-items:center;gap:10px}
.timer-wrap{display:flex;flex-direction:column;align-items:center;padding:14px 16px 8px}
.timer-ring{position:relative;width:80px;height:80px;margin-bottom:8px}
.timer-svg{transform:rotate(-90deg)}
.timer-track{fill:none;stroke:var(--bg3);stroke-width:6}
.timer-fill{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;stroke-dasharray:220;stroke-dashoffset:0;transition:stroke-dashoffset .9s linear,stroke .3s}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;color:var(--txt)}
.dc-sit{font-size:16px;color:var(--txt2);line-height:1.7;padding:4px 16px 10px;text-align:center}

/* CHOICES */
.choices{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px}
.choice{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--bdr);background:var(--bg);cursor:pointer;font-family:inherit;text-align:left;width:100%;transition:all .15s;min-height:52px}
.choice:active{transform:scale(0.98)}
.ckey{width:30px;height:30px;border-radius:8px;background:var(--bg2);border:0.5px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0;color:var(--txt2)}
.ctxt{font-size:16px;color:var(--txt);line-height:1.5;flex:1;padding-top:2px}
.cico{font-size:16px;flex-shrink:0;opacity:0;padding-top:4px}
.choice.correct{border-color:#3B6D11;background:var(--green-l)}.choice.correct .ckey{background:#3B6D11;color:#fff;border-color:#3B6D11}.choice.correct .cico{opacity:1}
.choice.wrong{border-color:#E24B4A;background:var(--red-l)}.choice.wrong .ckey{background:#E24B4A;color:#fff;border-color:#E24B4A}.choice.wrong .cico{opacity:1}
.choice.partial{border-color:#BA7517;background:var(--amber-l)}.choice.partial .ckey{background:#BA7517;color:#fff;border-color:#BA7517}.choice.partial .cico{opacity:1}
.choice:disabled{cursor:default}

/* STEPS */
.steps{display:flex;border-bottom:0.5px solid var(--bdr)}
.step{flex:1;padding:8px 4px;text-align:center;font-size:11px;font-weight:500;color:var(--txt3)}
.step-dot{width:20px;height:20px;border-radius:50%;background:var(--bg2);border:0.5px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:11px;margin:0 auto 3px}
.step.done{color:var(--green)}.step.done .step-dot{background:var(--green-l);border-color:#3B6D11;color:var(--green)}
.step.active{color:var(--red)}.step.active .step-dot{background:var(--red-l);border-color:var(--red);color:var(--red)}

/* ANALYSIS */
.analysis{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.result-banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px}
.slabel{font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pchip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:0.5px solid transparent}
.pchip.ok{background:var(--green-l);border-color:var(--green-m)}.pchip.ok .pname{color:var(--green);font-size:14px;font-weight:600}.pchip.ok .pv{color:#3B6D11}
.pchip.fail{background:var(--red-l);border-color:var(--red-m)}.pchip.fail .pname{color:var(--red);font-size:14px;font-weight:600}.pchip.fail .pv{color:var(--red)}
.pchip.conflict{background:var(--amber-l);border-color:var(--amber-m)}.pchip.conflict .pname{color:var(--amber);font-size:14px;font-weight:600}.pchip.conflict .pv{color:#854F0B}
.pv{font-size:11px;margin-top:1px}
.cflict{background:var(--amber-l);border:0.5px solid var(--amber-m);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--amber);line-height:1.6}
.why-box{background:var(--bg2);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--txt2);line-height:1.7}
.law-box{background:var(--blue-l);border:0.5px solid var(--blue-m);border-radius:10px;padding:10px 12px}
.law-row{font-size:14px;color:var(--blue);line-height:1.7;display:flex;gap:6px}
.law-row::before{content:"§";flex-shrink:0;opacity:.5}
.real-box{background:var(--purple-l);border:0.5px solid var(--purple-m);border-radius:10px;padding:10px 12px}
.real-item{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--purple);line-height:1.6;margin-bottom:4px;cursor:pointer}
.chk{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--purple-m);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s}
.chk.on{background:var(--purple);border-color:var(--purple);color:#fff}

/* QUIZ */
.quiz-wrap{padding:14px 16px}
.quiz-q{font-size:16px;font-weight:500;color:var(--txt);margin-bottom:12px;line-height:1.5}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopt{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bdr);background:var(--bg);cursor:pointer;font-family:inherit;font-size:16px;color:var(--txt);text-align:left;width:100%;transition:all .15s}
.qopt:active{transform:scale(0.98)}
.qopt.qok{border-color:#3B6D11;background:var(--green-l);color:var(--green)}
.qopt.qfail{border-color:#E24B4A;background:var(--red-l);color:var(--red)}
.quiz-fb{margin-top:10px;font-size:14px;color:var(--txt2);line-height:1.6;padding:10px 12px;border-radius:10px;background:var(--bg2)}

/* NAV ROW */
.nav-row{display:flex;gap:8px;padding:12px 16px;border-top:0.5px solid var(--bdr)}
.nbtn{flex:1;padding:12px;font-size:16px;font-weight:500;border-radius:12px;border:0.5px solid var(--bdr);background:var(--bg2);color:var(--txt2);cursor:pointer;font-family:inherit;transition:all .15s}
.nbtn:active{transform:scale(0.97)}
.nbtn.primary{background:var(--red);color:#FCEBEB;border-color:var(--red)}
.nbtn.skip{background:var(--bg2);color:var(--txt3);border-style:dashed;font-size:14px}

/* EXPLORE */
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ctab{font-size:14px;padding:6px 14px;border-radius:999px;border:0.5px solid var(--bdr);background:var(--bg2);color:var(--txt2);cursor:pointer;font-family:inherit;transition:all .15s}
.ctab.on{background:var(--red);color:#FCEBEB;border-color:var(--red)}
.srch-box{display:flex;align-items:center;gap:8px;background:var(--bg2);border:0.5px solid var(--bdr);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.srch-inp{flex:1;border:none;background:transparent;font-size:16px;font-family:inherit;color:var(--txt);outline:none}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media(min-width:480px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mc{background:var(--bg2);border:0.5px solid var(--bdr);border-radius:12px;padding:12px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;position:relative}
.mc:active{transform:scale(0.97)}
.mc-done{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--green-l);border:1px solid var(--green-m);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--green)}
.mc-num{font-size:11px;color:var(--txt3);margin-bottom:3px}
.mc-ico{font-size:20px;margin-bottom:5px}
.mc-ttl{font-size:14px;font-weight:500;color:var(--txt);line-height:1.4;flex:1}
.mc-cat{font-size:10px;padding:2px 8px;border-radius:999px;margin-top:6px;display:inline-block}
.sc-sit{font-size:16px;color:var(--txt2);line-height:1.7;padding:10px 14px;background:var(--bg2);border-radius:10px;border-left:3px solid var(--red)}

/* HOME */
.home-hero{background:var(--red);border-radius:16px;padding:20px;margin-bottom:12px;color:#FCEBEB}
.home-hero-title{font-size:22px;font-weight:600;margin-bottom:4px}
.home-hero-sub{font-size:14px;opacity:.8;margin-bottom:14px}
.home-cta{background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.4);border-radius:10px;padding:11px 20px;font-size:16px;font-weight:600;color:#FCEBEB;cursor:pointer;font-family:inherit;width:100%;transition:all .15s}
.home-cta:active{transform:scale(0.97)}
.section-title{font-size:16px;font-weight:600;color:var(--txt);margin-bottom:10px}
.cat-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.cat-card{border-radius:12px;padding:12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px;border:0.5px solid transparent}
.cat-card:active{transform:scale(0.97)}
.cat-ico{font-size:24px;flex-shrink:0}
.cat-info-name{font-size:14px;font-weight:600}
.cat-info-count{font-size:11px;margin-top:1px}
.recent-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.recent-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border-radius:10px;cursor:pointer;border:0.5px solid var(--bdr)}
.recent-item:active{transform:scale(0.98)}
.ri-ico{font-size:20px;flex-shrink:0}
.ri-ttl{font-size:14px;font-weight:500;color:var(--txt);flex:1}
.ri-cat{font-size:10px;padding:1px 7px;border-radius:999px}
.ri-arr{font-size:16px;color:var(--txt3)}
.tip-card{background:var(--blue-l);border:0.5px solid var(--blue-m);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14px;color:var(--blue);line-height:1.6}

/* DASHBOARD */
.kpi-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--bg2);border-radius:12px;padding:12px 8px;text-align:center}
.kpi-n{font-size:22px;font-weight:600}
.kpi-l{font-size:10px;color:var(--txt2);margin-top:3px;line-height:1.3}
.bar-chart{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-lbl{font-size:12px;color:var(--txt2);width:110px;flex-shrink:0;line-height:1.3}
.bar-bg{flex:1;background:var(--bg3);border-radius:999px;height:8px;overflow:hidden}
.bar-fill{height:8px;border-radius:999px;transition:width .8s}
.bar-pct{font-size:12px;color:var(--txt2);width:34px;text-align:right;flex-shrink:0}
.ins-card{border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.65;display:flex;gap:8px}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.badge-card{border-radius:12px;padding:10px 12px;flex:1;min-width:80px;text-align:center}
.safety{background:var(--green-l);border:0.5px solid var(--green-m);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--green);margin-bottom:10px;display:flex;gap:6px}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.urgent .timer-fill{stroke:#E24B4A;animation:pulse .5s ease-in-out infinite}
.urgent .timer-num{color:#E24B4A}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-logo">🏥</div>
    <div><div class="hdr-title">EthiBot Nurse</div><div class="hdr-sub">CMU Nursing Ethics · 30 Scenarios</div></div>
    <div class="lang-sw">
      <button class="lbtn on" id="btn-th" onclick="setLang('th')">TH</button>
      <button class="lbtn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="content" id="main-content"></div>
</div>

<!-- BOTTOM NAV -->
<div class="bot-nav">
  <div class="bot-nav-inner">
    <button class="bnav on" id="bnav-home" onclick="switchTab('home')">
      <span class="bnav-ico">🏠</span><span id="bl-home">หน้าหลัก</span>
    </button>
    <button class="bnav" id="bnav-daily" onclick="switchTab('daily')">
      <span class="bnav-ico">🎯</span><span id="bl-daily">Daily</span>
    </button>
    <button class="bnav" id="bnav-explore" onclick="switchTab('explore')">
      <span class="bnav-ico">📚</span><span id="bl-explore">Explore</span>
    </button>
    <button class="bnav" id="bnav-dashboard" onclick="switchTab('dashboard')">
      <span class="bnav-ico">📊</span><span id="bl-dash">Dashboard</span>
    </button>
  </div>
</div>

<script>
let lang='th', curTab='home';
let timerInt=null, timerSec=60, dcPicked=null, dcDone=false, dcStep=0;
let expCat='all', expSc=null, expStep=0, expPicked=null;
const st={score:0,done:0,streak:0,ids:new Set()};

// ══════════════════════════════════════════════════════════════════
// BACKEND CONFIG — วาง Web App URL ที่ได้จาก Google Apps Script ตรงนี้
// (ดูวิธี deploy ในไฟล์ Code.gs ที่มาคู่กัน) ต้องลงท้ายด้วย /exec
// ══════════════════════════════════════════════════════════════════
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxo1LKfPPy-xj1U09W29fJQaI9M_IiCLijA2RpsAiYIzhzL9qWo8Gn1z9RRGVrIXXk9/exec';

// ── รหัสอ้างอิงนักศึกษา (ใช้จับคู่กับ Pre/Post-test และรวมข้อมูลเป็นรายคน) ──
function getStudentCode(){
  let code=localStorage.getItem('ethibot_code');
  if(!code){
    code=(prompt(lang==='th'
      ?'กรุณากรอกรหัสอ้างอิงนักศึกษา (รหัสเดียวกับที่ใช้ตอนทำ Pre-Test)\nรหัสนี้จะถูกจดจำไว้ในเครื่องนี้':
      'Please enter your student reference code (same one used in the Pre-Test)\nThis will be remembered on this device')||'').trim();
    if(!code)code='anon-'+Math.random().toString(36).slice(2,8);
    localStorage.setItem('ethibot_code',code);
  }
  return code;
}

// ── บันทึกความคืบหน้าไว้ในเครื่องนี้ (กันรีเซ็ตเมื่อ refresh) ──
function saveLocalState(){
  try{
    localStorage.setItem('ethibot_state',JSON.stringify({score:st.score,done:st.done,streak:st.streak,ids:Array.from(st.ids)}));
  }catch(e){}
}
function loadLocalState(){
  try{
    const raw=localStorage.getItem('ethibot_state');
    if(!raw)return;
    const d=JSON.parse(raw);
    st.score=d.score||0;st.done=d.done||0;st.streak=d.streak||0;
    st.ids=new Set(d.ids||[]);
  }catch(e){}
}
loadLocalState();

// ── ส่งข้อมูลการตอบแต่ละครั้งไปเก็บที่ Google Sheets (fire-and-forget) ──
function logAttempt(scenarioId,cat,correct,pts,mode){
  saveLocalState();
  if(!WEBAPP_URL||WEBAPP_URL.indexOf('PASTE_YOUR')===0)return; // ยังไม่ได้ตั้งค่า backend
  try{
    fetch(WEBAPP_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // ใช้ text/plain เพื่อเลี่ยง CORS preflight
      body:JSON.stringify({code:getStudentCode(),id:scenarioId,cat:cat,mode:mode,correct:!!correct,pts:pts,ts:Date.now()})
    }).catch(()=>{/* เงียบไว้ถ้าออฟไลน์ ไม่ให้กระทบการเล่น */});
  }catch(e){}
}

const LABELS={
  th:{home:'หน้าหลัก',daily:'Daily',explore:'Explore',dash:'Dashboard',
      sec_to_decide:'วินาทีในการตัดสินใจ',why:'ทำไม',laws:'หลักการจริยธรรม',
      correct:'ถูกต้อง!',partial:'พอใช้',wrong:'ไม่ถูกต้อง',
      retry:'ลองใหม่',back:'กลับ',menu:'เมนู',next:'ถัดไป',
      skip:'ข้าม / เปลี่ยนข้อ',decide:'ตัดสินใจ',all:'ทั้งหมด',
      tip:'💡 เคล็ดลับ: กด "ข้าม" ได้ตลอดเวลาเพื่อไปเล่นข้ออื่น',
      edu:'คำแนะนำเพื่อการศึกษาเท่านั้น',random:'สุ่ม Scenario',
      most_missed:'Scenarios ที่ตอบผิดมากที่สุด',mock:'ข้อมูลจำลองสำหรับการแสดงตัวอย่างระบบ',
      users:'คน',hero_sub:'ฝึกตัดสินใจทางจริยธรรม ผ่าน 30 สถานการณ์จริง',

const SC=[{"id":1,"cat":"clinical","correct":2,"scores":[0,4,10],"cn":{"th":"⚡ Confidentiality ✔ — ไม่เห็นหน้า/ชื่อ ก็ยังต้องปกป้องข้อมูลจากบริบทการดูแล","en":"⚡ Confidentiality ✔ — even without face/name, care-context images still need protection"},"conflict":{"au":[true,true,true],"be":[false,true,true],"nm":[false,true,true],"ju":[true,true,true]},"th":{"e":"📸","t":"โพสต์รูปแผลผู้ป่วย","s":"ระหว่างฝึกปฏิบัติงาน นักศึกษาพยาบาลถ่ายภาพแผลหลังผ่าตัดของผู้ป่วยไว้ด้วยโทรศัพท์ส่วนตัว และคิดจะโพสต์ลง Instagram พร้อมข้อความ #NursingLife เพื่อแชร์ประสบการณ์การฝึก ในภาพไม่เห็นใบหน้าหรือชื่อผู้ป่วย","c":["โพสต์ได้เลย ไม่เห็นหน้าผู้ป่วย","ขอ consent ผู้ป่วยก่อนโพสต์","ไม่โพสต์หรือแชร์ภาพ และปรึกษาพยาบาลผู้รับผิดชอบ/อาจารย์นิเทศเพื่อจัดการภาพที่ถ่ายไว้ตามแนวทางของสถานพยาบาล"],"ic":["❌","⚠️","✅"],"w":["❌ แม้ไม่เห็นใบหน้าหรือชื่อผู้ป่วย ภาพที่เกิดจากบริบทการดูแลยังมีประเด็นเรื่อง privacy, confidentiality และขอบเขตวิชาชีพ การไม่มีข้อมูลระบุตัวตนโดยตรงไม่ได้แปลว่าโพสต์ได้โดยอัตโนมัติ","⚠️ แม้ผู้ป่วยจะยินยอม การใช้ภาพที่เกิดจากบริบทการดูแลเพื่อโพสต์ในบัญชีส่วนตัวยังต้องพิจารณาวัตถุประสงค์ ความจำเป็น ความเป็นส่วนตัว ขอบเขตวิชาชีพ และนโยบายของสถานพยาบาล การขออนุญาตเพียงอย่างเดียวจึงไม่เพียงพอที่จะสรุปว่าโพสต์ได้","✅ ไม่ควรโพสต์หรือแชร์ภาพที่ได้จากบริบทการดูแลผู้ป่วยเพื่อวัตถุประสงค์ส่วนตัว ควรปรึกษาพยาบาลผู้รับผิดชอบ/อาจารย์นิเทศเพื่อจัดการภาพที่ถ่ายไว้อย่างเหมาะสมตามแนวทางของสถานพยาบาล — การไม่มีชื่อหรือใบหน้าไม่ได้ทำให้ clinical image สามารถนำไปใช้ได้โดยอัตโนมัติ"],"l":["หลัก Confidentiality + Privacy — ข้อมูลจากบริบทการดูแลยังต้องได้รับการปกป้องแม้ไม่มีชื่อหรือใบหน้า","หลัก Professional Boundaries + Professional Responsibility — ข้อมูลที่เข้าถึงจากบทบาทการดูแลไม่ควรถูกใช้เพื่อวัตถุประสงค์ส่วนตัวโดยพลการ","ทักษะ Responsible Handling of Clinical Images — Purpose ≠ automatic permission (ทั้ง consent และวัตถุประสงค์การศึกษา)"],"r":["🎯 Purpose — ก่อนถ่ายหรือใช้ภาพทางคลินิก ต้องมีวัตถุประสงค์ที่เหมาะสม","✅ Permission — ตรวจสอบว่าการถ่าย/ใช้ภาพได้รับอนุญาตตามกระบวนการของแหล่งฝึกหรือไม่ ไม่ใช่พิจารณาเฉพาะ consent ของผู้ป่วย","🔒 Minimize — ใช้ข้อมูลเท่าที่จำเป็นและลดข้อมูลที่สามารถระบุตัวผู้ป่วยได้","📵 Protect — ไม่เก็บหรือส่งต่อผ่านอุปกรณ์/ช่องทางส่วนตัวโดยพลการ","📋 Share appropriately — หากจำเป็นต้องใช้เพื่อการดูแลหรือการเรียน ให้ใช้เฉพาะช่องทางและกระบวนการที่ได้รับอนุญาต"],"qq":"นักศึกษาต้องการใช้ภาพแผลของผู้ป่วยเพื่ออภิปรายกรณีศึกษากับเพื่อน จึงคิดจะส่งภาพจากโทรศัพท์ส่วนตัวเข้า LINE กลุ่มนักศึกษา แม้ภาพจะไม่เห็นใบหน้าผู้ป่วย แนวทางใดเหมาะสมที่สุด?","qo":["ส่งได้ เพราะไม่มีใบหน้าจึงไม่ถือว่าเกี่ยวข้องกับผู้ป่วย","ส่งได้ถ้าบอกเพื่อนว่าใช้เพื่อการศึกษาเท่านั้น","ส่งได้หากลบชื่อผู้ป่วยออกก่อน","ไม่ส่งผ่านกลุ่มส่วนตัวโดยพลการ และตรวจสอบแนวทางของแหล่งฝึก/ใช้ช่องทางและข้อมูลที่ได้รับอนุญาตสำหรับการเรียนรู้"],"qc":3},"en":{"e":"📸","t":"Posting Patient Wound Photo","s":"During clinical placement, a nursing student photographs a post-surgical wound on a personal phone and is thinking of posting it on Instagram with #NursingLife to share the training experience. Neither the patient's face nor name is visible in the photo.","c":["Post it — the patient's face is not visible","Ask the patient for consent before posting","Do not post or share the photo, and consult the responsible nurse/instructor about handling the photo per facility guidance"],"ic":["❌","⚠️","✅"],"w":["❌ Even without a visible face or name, an image from the care context still raises privacy, confidentiality, and professional-boundary issues. The absence of direct identifiers does not automatically make posting acceptable.","⚠️ Even with patient consent, using a care-context image on a personal account still requires considering purpose, necessity, privacy, professional boundaries, and facility policy. Consent alone is not sufficient to conclude posting is appropriate.","✅ Clinical images should not be posted or shared for personal purposes. Consult the responsible nurse/instructor about proper handling per facility guidance — the absence of a name or face does not automatically make a clinical image usable."],"l":["Confidentiality + Privacy — care-context information must still be protected even without a name or face","Professional Boundaries + Professional Responsibility — information accessed through a caregiving role should not be used for personal purposes without authorization","Skill: Responsible Handling of Clinical Images — purpose ≠ automatic permission (whether from consent or educational intent)"],"r":["🎯 Purpose — before capturing or using a clinical image, there must be an appropriate purpose","✅ Permission — check whether capturing/using the image is authorized by facility process, not just patient consent","🔒 Minimize — use only what is necessary and reduce identifiable information","📵 Protect — do not store or forward via personal devices/channels without authorization","📋 Share appropriately — if needed for care or learning, use only authorized channels and processes"],"qq":"A student wants to use a wound photo to discuss a case study with classmates, and is thinking of sending it from a personal phone into a student LINE group. Even though the patient's face is not visible, what is most appropriate?","qo":["Send it — no face means it doesn't count as patient-related","Send it if you tell classmates it's for educational use only","Send it if the patient's name is removed first","Do not send it via a private group; check facility guidance and use authorized channels/data for learning"],"qc":3}},{"id":2,"cat":"clinical","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Autonomy ผู้ป่วย ✔ ปะทะ Role Clarity — ลายเซ็นไม่เท่ากับ informed consent ที่สมบูรณ์","en":"⚡ Patient Autonomy ✔ vs Role Clarity — a signature ≠ a complete informed consent process"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[false,true,false,false],"ju":[false,true,false,false]},"th":{"e":"📋","t":"Informed Consent โดยนักศึกษา","s":"ก่อนการผ่าตัด แพทย์มีภารกิจเร่งด่วนและขอให้นักศึกษาพยาบาลไปอธิบายประโยชน์ ความเสี่ยง และทางเลือกของการผ่าตัดแก่ผู้ป่วยแทน พร้อมนำแบบฟอร์มให้ผู้ป่วยลงนาม นักศึกษายังไม่ได้รับมอบหมายหรือเตรียมความพร้อมให้เป็นผู้ให้ข้อมูลเฉพาะเกี่ยวกับหัตถการดังกล่าว","c":["อธิบายจากข้อมูลที่ตนทราบและให้ผู้ป่วยเซ็น เพราะแพทย์เป็นผู้มอบหมาย","แจ้งว่าตนไม่ควรดำเนินกระบวนการดังกล่าวแทนผู้รับผิดชอบโดยลำพัง และประสานให้ผู้ที่มีบทบาทและข้อมูลเหมาะสมมาอธิบายแก่ผู้ป่วย","ให้ผู้ป่วยเซ็นก่อน แล้วบอกว่าหากสงสัยสามารถถามแพทย์ภายหลัง","ขอให้เพื่อนนักศึกษาที่เคยเห็นการผ่าตัดนี้มาอธิบายแทน"],"ic":["❌","✅","❌","❌"],"w":["❌ คำสั่งจากผู้มีอำนาจมากกว่าไม่ได้ทำให้ competence/role/responsibility ของนักศึกษาเปลี่ยนโดยอัตโนมัติ เมื่อได้รับมอบหมายงานที่ตนอาจไม่มีบทบาทหรือความพร้อมเพียงพอ ควรแจ้งข้อจำกัดและขอให้ผู้รับผิดชอบดำเนินการ","✅ นักศึกษาต้องรู้ว่าข้อมูลหรือการตัดสินใจส่วนใดเกินบทบาทของตน — ไม่ได้แปลว่านักศึกษาไม่มีส่วนเกี่ยวข้องกับ informed consent เลย แต่ไม่ควรรับหน้าที่ให้ข้อมูลเฉพาะที่เกินความรู้หรือบทบาทของตนแล้วทำให้กระบวนการดูเสร็จสมบูรณ์เพียงเพราะได้รับคำสั่งจากผู้อาวุโสกว่า","❌ การมีลายเซ็นในแบบฟอร์มไม่ได้แปลว่ากระบวนการ informed consent สมบูรณ์ หากผู้ป่วยยังไม่ได้รับข้อมูลที่จำเป็นหรือยังไม่มีโอกาสถามและตัดสินใจอย่างสมัครใจ การให้เซ็นก่อนแล้วค่อยตอบคำถามภายหลังกลับลำดับความสำคัญของกระบวนการ","❌ เพื่อนนักศึกษาที่เคยเห็นการผ่าตัดไม่ได้มีบทบาทหรือความรู้ที่เหมาะสมในการให้ข้อมูลเฉพาะเกี่ยวกับหัตถการแก่ผู้ป่วยเช่นกัน"],"l":["หลัก Autonomy + Professional Responsibility — ผู้ป่วยต้องได้รับข้อมูลที่เหมาะสมเพื่อตัดสินใจด้วยตนเอง","หลัก Veracity / Respect for Persons — ความซื่อสัตย์ต่อกระบวนการตัดสินใจของผู้ป่วย","แนวคิด Role Clarity + Informed Decision-Making — ลายเซ็นไม่เท่ากับกระบวนการ consent ที่สมบูรณ์"],"r":["🔍 Clarify — ดูว่าตนถูกขอให้ทำอะไร (ให้ข้อมูลทั่วไป, อธิบายข้อมูลเฉพาะหัตถการ, ตรวจสอบความเข้าใจ หรือจัดการเอกสาร)","🧭 Recognize — รู้ขอบเขตความรู้และบทบาทของตน","🤝 Support — รับฟังคำถามและช่วยผู้ป่วยสื่อสารสิ่งที่ยังไม่เข้าใจ","📢 Refer — ให้ผู้ที่มีบทบาทและความรู้เหมาะสมตอบคำถามสำคัญที่เกี่ยวกับการตัดสินใจ","✅ Confirm — ช่วยตรวจสอบว่าผู้ป่วยยังมีคำถามหรือความกังวลที่ต้องส่งต่อหรือไม่"],"qq":"ก่อนทำหัตถการ ผู้ป่วยบอกนักศึกษาว่า \"ฉันเซ็นเอกสารแล้ว แต่ยังไม่เข้าใจว่ามีความเสี่ยงอะไรบ้าง\" นักศึกษาควรทำอย่างไรเหมาะสมที่สุด?","qo":["บอกว่าผู้ป่วยเซ็นแล้วจึงถือว่ายินยอมเรียบร้อย","อธิบายความเสี่ยงทั้งหมดเองจากที่เคยเรียนมา","รับฟังและตรวจสอบว่าผู้ป่วยยังสงสัยเรื่องใด แล้วประสานผู้รับผิดชอบที่เหมาะสมให้ข้อมูลก่อนดำเนินการต่อ","บอกผู้ป่วยให้รอถามหลังทำหัตถการ เพราะเซ็นเอกสารไปแล้ว"],"qc":2},"en":{"e":"📋","t":"Informed Consent by Student","s":"Before surgery, a physician has an urgent task and asks a nursing student to explain the benefits, risks, and alternatives of the procedure to the patient instead, and bring the signed consent form. The student has not been assigned or prepared to serve as the information-provider for this procedure.","c":["Explain from what you know and have the patient sign, since the physician delegated it","State that you should not carry out this process on behalf of the responsible provider alone, and arrange for someone with the appropriate role and knowledge to explain to the patient","Have the patient sign first, and say they can ask the physician later if unsure","Ask a classmate who has seen this surgery before to explain instead"],"ic":["❌","✅","❌","❌"],"w":["❌ An order from someone with more authority does not automatically change a student's competence/role/responsibility. When assigned a task beyond one's role or readiness, the limitation should be disclosed and the responsible person asked to proceed.","✅ A student must know which information or decisions are beyond their role — this doesn't mean students have no part in informed consent at all, but they should not take on providing procedure-specific information beyond their knowledge or role just because a senior instructed it.","❌ A signature on the form doesn't mean the informed consent process is complete if the patient hasn't received necessary information or had a chance to ask questions and decide voluntarily. Signing first and answering questions later reverses the proper sequence.","❌ A classmate who has seen the surgery also lacks the appropriate role or knowledge to provide procedure-specific information to the patient."],"l":["Autonomy + Professional Responsibility — patients need appropriate information to decide for themselves","Veracity / Respect for Persons — honesty toward the patient's decision-making process","Concept: Role Clarity + Informed Decision-Making — a signature is not the same as a complete consent process"],"r":["🔍 Clarify — identify what you're actually being asked to do (general info, procedure-specific explanation, checking understanding, or paperwork)","🧭 Recognize — know the boundaries of your knowledge and role","🤝 Support — listen to questions and help the patient communicate what they don't understand","📢 Refer — let someone with the appropriate role and knowledge answer key decision-relevant questions","✅ Confirm — help check whether the patient still has questions or concerns to pass along"],"qq":"Before a procedure, a patient tells a student, \"I signed the form, but I still don't understand the risks.\" What should the student do?","qo":["Say that signing already means consent is complete","Explain all the risks yourself from what you learned in class","Listen and check what the patient is still unsure about, then arrange for the appropriate provider to give information before proceeding","Tell the patient to ask after the procedure since they already signed"],"qc":2}},{"id":3,"cat":"clinical","correct":1,"scores":[0,10,4],"cn":{"th":"⚡ Non-maleficence ✔ ปะทะ Team Loyalty — ผู้ป่วยปลอดภัยมาก่อนเสมอ ไม่ใช่การกล่าวโทษ","en":"⚡ Non-maleficence ✔ vs Team Loyalty — patient safety always comes first, not blaming a colleague"},"conflict":{"au":[true,true,true],"be":[false,true,true],"nm":[false,true,false],"ju":[false,true,true]},"th":{"e":"💊","t":"รายงานความผิดพลาดทางยา","s":"คุณสังเกตว่าเพื่อนพยาบาลให้ยาผิดขนาด แต่ผู้ป่วยยังไม่มีอาการผิดปกติ","c":["ไม่บอกใคร เพราะผู้ป่วยยังปกติ","ประเมินผู้ป่วยทันที แจ้งพยาบาลผู้รับผิดชอบ/อาจารย์นิเทศหรือผู้ที่เกี่ยวข้องตามระบบ เพื่อให้ได้รับการประเมินและดูแลต่ออย่างเหมาะสม และดำเนินการรายงานเหตุการณ์ตามแนวทางของหน่วยงาน","บอกเพื่อนก่อน ให้เพื่อนรายงานเอง"],"ic":["❌","✅","⚠️"],"w":["❌ การที่ผู้ป่วยยังไม่มีอาการไม่ได้หมายความว่าไม่มีความเสี่ยง การนิ่งเฉยอาจทำให้ผู้ป่วยไม่ได้รับการประเมินและการติดตามที่จำเป็น และไม่สอดคล้องกับ Non-maleficence และ Professional Accountability","✅ ความปลอดภัยของผู้ป่วยมาก่อนเสมอ: ประเมินอาการ แจ้งผู้รับผิดชอบโดยไม่ชักช้า และดำเนินการรายงานตามระบบ — การรายงานเหตุการณ์คือการรายงานข้อเท็จจริงเพื่อให้ผู้ป่วยได้รับการดูแลและระบบเรียนรู้ป้องกันการเกิดซ้ำ ไม่ใช่การกล่าวโทษเพื่อน ส่วนการกล้ารายงานแม้กระทบความสัมพันธ์กับเพื่อนร่วมงานสะท้อน Moral Courage","⚠️ การพูดคุยกับเพื่อนอาจเป็นส่วนหนึ่งของการจัดการเหตุการณ์ได้ แต่ไม่ควรทำให้การประเมินผู้ป่วยและการแจ้งผู้รับผิดชอบตามระบบล่าช้า ผู้พบเหตุการณ์ยังมีหน้าที่ช่วยให้มั่นใจว่าผู้ป่วยได้รับการดูแลอย่างเหมาะสม"],"l":["หลัก Non-maleficence / Patient Safety — ความปลอดภัยของผู้ป่วยมาก่อนเสมอ","หลัก Professional Accountability + Moral Courage — รายงานข้อเท็จจริงเพื่อการดูแลและป้องกันการเกิดซ้ำ ไม่ใช่การกล่าวโทษ","ทักษะ Error Recognition + Timely Escalation — ไม่รอให้เกิดอาการก่อนจึงรายงาน"],"r":["🩺 ประเมินอาการและความปลอดภัยของผู้ป่วยทันที","📢 แจ้งพยาบาลผู้รับผิดชอบ/อาจารย์นิเทศตามระบบโดยเร็ว","💊 ตรวจสอบชื่อยา ขนาดยา เวลา และข้อมูลที่เกี่ยวข้อง เพื่อให้ทีมประเมินแนวทางจัดการต่อ","👀 ติดตามอาการผู้ป่วยตามแผนที่ทีมกำหนด","📝 บันทึกข้อมูลการดูแลตามข้อเท็จจริง และดำเนินการ incident reporting ตามระบบของหน่วยงาน"],"qq":"เมื่อพบว่าผู้ป่วยได้รับยาผิดขนาด แม้ยังไม่มีอาการผิดปกติ แนวทางใดเหมาะสมที่สุด?","qo":["รอดูอาการก่อน หากมีความผิดปกติจึงแจ้งผู้รับผิดชอบ","คุยกับเพื่อนที่ให้ยาก่อน และให้เพื่อนตัดสินใจว่าจะรายงานหรือไม่","ประเมินผู้ป่วยทันที แจ้งผู้รับผิดชอบโดยไม่ชักช้า และดำเนินการดูแล/ติดตามและรายงานตามระบบ","บันทึกเหตุการณ์ไว้ก่อน แต่ยังไม่ต้องแจ้งเพราะผู้ป่วยไม่มีอาการ"],"qc":2},"en":{"e":"💊","t":"Reporting a Medication Error","s":"You notice a colleague gave a patient the wrong medication dose, but the patient currently shows no abnormal symptoms.","c":["Say nothing since the patient seems fine","Assess the patient immediately, notify the responsible nurse/instructor or relevant party through the system so the patient receives appropriate evaluation and continued care, and report the incident per facility procedure","Tell the colleague first and let them decide whether to report"],"ic":["❌","✅","⚠️"],"w":["❌ The absence of symptoms now doesn't mean there's no risk. Staying silent may mean the patient doesn't receive necessary assessment and monitoring, which conflicts with Non-maleficence and Professional Accountability.","✅ Patient safety always comes first: assess symptoms, notify the responsible party without delay, and report per system procedure — incident reporting means reporting facts so the patient gets proper care and the system can learn to prevent recurrence, not blaming a colleague. Reporting despite the risk to a peer relationship reflects Moral Courage.","⚠️ Talking with the colleague can be part of managing the situation, but should not delay assessing the patient or notifying the responsible party through the system. Whoever discovers the incident still has a duty to help ensure the patient receives appropriate care."],"l":["Non-maleficence / Patient Safety — patient safety always comes first","Professional Accountability + Moral Courage — report facts for care and prevention, not blame","Skill: Error Recognition + Timely Escalation — don't wait for symptoms before reporting"],"r":["🩺 Assess the patient's condition and safety immediately","📢 Notify the responsible nurse/instructor through the system promptly","💊 Check the medication name, dose, time, and related information so the team can plan next steps","👀 Monitor the patient per the plan the team sets","📝 Document care facts, and complete incident reporting per facility procedure"],"qq":"Upon finding a patient received the wrong medication dose, even with no abnormal symptoms yet, what is the most appropriate approach?","qo":["Wait and observe; notify the responsible party only if something abnormal appears","Talk to the colleague who gave the medication first, and let them decide whether to report","Assess the patient immediately, notify the responsible party without delay, and continue care/monitoring and reporting per the system","Document the incident but hold off notifying anyone since the patient has no symptoms"],"qc":2}},{"id":4,"cat":"clinical","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Confidentiality ✔ — ญาติใกล้ชิดไม่ได้แปลว่ามีสิทธิรับข้อมูลโดยอัตโนมัติ","en":"⚡ Confidentiality ✔ — being a close relative doesn't automatically grant a right to information"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[false,true,false,false],"ju":[false,true,false,false]},"th":{"e":"👨‍👩‍👧","t":"ครอบครัวขอทราบผลการวินิจฉัย","s":"ผู้ป่วยหญิงที่รู้สึกตัวดีและมีความสามารถในการตัดสินใจได้รับการวินิจฉัยว่าเป็นมะเร็ง ลูกของผู้ป่วยขอทราบผลการวินิจฉัย แต่ผู้ป่วยบอกคุณอย่างชัดเจนว่าไม่ต้องการให้ลูกทราบ","c":["บอกการวินิจฉัย เพราะเป็นบุตรของผู้ป่วยและควรได้รับรู้เพื่อช่วยดูแล","ไม่เปิดเผยการวินิจฉัยโดยไม่ได้รับอนุญาตจากผู้ป่วย รับฟังความกังวลของบุตร และประสานทีมตามความเหมาะสม","บอกว่า \"ไม่ได้เป็นมะเร็ง\" เพื่อรักษาความลับของผู้ป่วย","บอกให้ไปถามแพทย์ เพราะแพทย์เป็นผู้ตัดสินใจว่าจะเปิดเผยข้อมูลได้หรือไม่"],"ic":["❌","✅","❌","❌"],"w":["❌ ความสัมพันธ์ทางครอบครัวเพียงอย่างเดียวไม่ได้ทำให้ข้อมูลสุขภาพของผู้ป่วยสามารถเปิดเผยได้โดยอัตโนมัติ ความใกล้ชิดทางเครือญาติไม่ใช่ automatic permission","✅ การเคารพ Autonomy รวมถึงการเคารพความประสงค์เกี่ยวกับการเปิดเผยข้อมูล การรักษาความลับไม่ได้หมายถึงการทอดทิ้งครอบครัว ยังสามารถรับฟังความกังวลและประสานทีมเพื่อช่วยเหลือการสื่อสารได้ (Protect information without abandoning the family)","❌ การรักษาความลับไม่ได้แปลว่าต้องให้ข้อมูลเท็จ — Declining to disclose ≠ lying การบอกข้อมูลเท็จละเมิด Veracity แม้เจตนาจะปกป้องความลับก็ตาม","❌ ประเด็นไม่ได้อยู่ที่ว่าใครมีอำนาจมากกว่าระหว่างแพทย์กับพยาบาล แต่อยู่ที่ว่าข้อมูลนี้ควรถูกเปิดเผยแก่บุคคลนี้หรือไม่ตามความประสงค์ของผู้ป่วย การประสานแพทย์/ทีมควรทำเพื่อช่วยจัดการการสื่อสาร ไม่ใช่โยนภาระเรื่องความลับไปให้ผู้อื่น"],"l":["หลัก Confidentiality + Privacy — ข้อมูลที่ได้รับจากความสัมพันธ์ในการดูแลต้องได้รับการปกป้อง ไม่เปิดเผยแก่สมาชิกครอบครัวเพียงเพราะมีความสัมพันธ์ทางเครือญาติ","หลัก Autonomy — สิทธิผู้ป่วยกำหนดการเปิดเผยข้อมูลของตนเอง","หลัก Veracity — การไม่เปิดเผยข้อมูล (declining to disclose) ต่างจากการให้ข้อมูลเท็จ (lying)"],"r":["🔒 Protect — ไม่เปิดเผยข้อมูลที่ผู้ป่วยไม่อนุญาต","🤝 Acknowledge — รับฟังและยอมรับว่าครอบครัวอาจมีความกังวลโดยไม่เปิดเผยข้อมูลเพิ่ม","🔍 Explore — เมื่อเหมาะสม สำรวจความต้องการของผู้ป่วยเกี่ยวกับการสื่อสารกับครอบครัว","💬 Support — ช่วยผู้ป่วยคิดว่าจะสื่อสารอย่างไร หากผู้ป่วยต้องการ","👥 Coordinate — ประสานทีมเมื่อสถานการณ์ต้องการการช่วยเหลือเพิ่มเติม"],"qq":"ผู้ป่วยบอกว่าไม่ต้องการให้พี่สาวทราบผลตรวจ ต่อมาพี่สาวบอกนักศึกษาว่า \"ฉันเป็นคนพามารักษาทุกครั้ง บอกผลตรวจฉันได้เลย\" นักศึกษาควรทำอย่างไรเหมาะสมที่สุด?","qo":["บอกได้ เพราะพี่สาวเป็นผู้ดูแลหลัก","บอกเฉพาะผลที่ไม่รุนแรง","ไม่เปิดเผยข้อมูลโดยไม่ได้รับอนุญาตจากผู้ป่วย และรับฟัง/ประสานความช่วยเหลือตามความเหมาะสม","บอกให้พี่สาวถามแพทย์แทน"],"qc":2},"en":{"e":"👨‍👩‍👧","t":"Family Asks About Diagnosis","s":"A female patient who is alert and capable of decision-making has been diagnosed with cancer. Her child asks about the diagnosis, but the patient has clearly told you she does not want her child to know.","c":["Tell the child the diagnosis, since they are the patient's child and should know to help with care","Do not disclose the diagnosis without the patient's permission; listen to the child's concerns and coordinate with the team as appropriate","Say \"it's not cancer\" to protect the patient's confidentiality","Tell them to ask the physician, since the physician decides whether to disclose information"],"ic":["❌","✅","❌","❌"],"w":["❌ A family relationship alone does not automatically make a patient's health information disclosable. Closeness of kinship is not automatic permission.","✅ Respecting Autonomy includes respecting the patient's wishes about disclosure. Protecting confidentiality doesn't mean abandoning the family — you can still listen to their concerns and coordinate the team to help with communication (Protect information without abandoning the family).","❌ Protecting confidentiality does not mean giving false information — Declining to disclose ≠ lying. Giving false information violates Veracity even with an intent to protect confidentiality.","❌ The issue isn't which profession has more authority between physician and nurse — it's whether this information should be disclosed to this person according to the patient's wishes. Coordinating with the physician/team should help manage communication, not offload the confidentiality burden onto someone else."],"l":["Confidentiality + Privacy — information from the care relationship must be protected, not disclosed to family members merely due to kinship","Autonomy — the patient's right to determine disclosure of their own information","Veracity — declining to disclose is different from lying"],"r":["🔒 Protect — do not disclose information the patient hasn't authorized","🤝 Acknowledge — listen and acknowledge the family's possible concerns without disclosing more","🔍 Explore — when appropriate, explore the patient's wishes about communicating with family","💬 Support — help the patient think through how to communicate, if they want to","👥 Coordinate — involve the team when the situation needs additional support"],"qq":"A patient says she doesn't want her sister to know the test results. Later the sister tells the student, \"I'm the one who brings her in every time — you can tell me.\" What is most appropriate?","qo":["Tell her, since the sister is the primary caregiver","Tell her only the mild results","Do not disclose without the patient's permission, and listen/coordinate support as appropriate","Tell the sister to ask the physician instead"],"qc":2}},{"id":5,"cat":"team","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Moral Courage ✔ ปะทะ Authority Gradient — คำยืนยันจากผู้มีอำนาจ ≠ ข้อกังวลคลี่คลายแล้ว","en":"⚡ Moral Courage ✔ vs Authority Gradient — confirmation from authority ≠ concern resolved"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,true],"nm":[false,true,false,false],"ju":[false,true,false,false]},"th":{"e":"⚕️","t":"ขัดแย้งกับคำสั่งแพทย์","s":"ระหว่างฝึกปฏิบัติงาน คุณตรวจพบคำสั่งยาที่สงสัยว่าอาจไม่ปลอดภัย เนื่องจากขนาดยาสูงกว่าที่คาด จึงสอบถามแพทย์ผู้สั่ง แพทย์ตอบเพียงว่า \"สั่งตามนั้น ให้ไปได้เลย\" โดยยังไม่ได้อธิบายข้อมูลที่ช่วยคลี่คลายข้อกังวล","c":["ดำเนินการตามคำสั่ง เพราะแพทย์ยืนยันแล้วและเป็นผู้รับผิดชอบคำสั่ง","ยังไม่ดำเนินการในส่วนที่มีข้อกังวล ตรวจสอบข้อมูลเพิ่มเติม และแจ้งพยาบาลผู้รับผิดชอบ/อาจารย์นิเทศเพื่อยกระดับตามระบบหากข้อกังวลยังไม่คลี่คลาย","ปฏิเสธคำสั่งทันทีและแจ้งผู้ป่วยว่าแพทย์สั่งยาผิด","รอดูว่าบุคลากรคนอื่นจะสังเกตเห็นปัญหาหรือไม่ เพราะนักศึกษาอาจเข้าใจผิด"],"ic":["❌","✅","❌","❌"],"w":["❌ การได้รับคำสั่งจากบุคลากรที่มีอำนาจมากกว่าไม่ได้ทำให้หน้าที่ในการสังเกตและสื่อสารความเสี่ยงต่อผู้ป่วยหมดไป — Physician confirmation ≠ concern resolved การยืนยันจากผู้มีอำนาจไม่ใช่เหตุผลให้หยุดตั้งคำถามเมื่อยังไม่คลี่คลาย","✅ เมื่อมีข้อกังวลที่ยังไม่ได้รับการคลี่คลาย ควรตรวจสอบและขอความช่วยเหลือตามระบบก่อนดำเนินการต่อ ไม่จำเป็นต้องพิสูจน์ว่าผู้สั่งรักษาผิด เพียงแต่ต้องสื่อสารสิ่งที่กังวลและยกระดับจนกว่าประเด็นด้านความปลอดภัยจะได้รับการคลี่คลาย (graded assertiveness: Question → Concern → Escalate)","❌ นักศึกษาไม่ได้อยู่ในสถานะที่จะสรุปหรือประกาศว่าคำสั่งรักษาผิดพลาด การปฏิเสธทันทีและบอกผู้ป่วยเช่นนั้นอาจสร้างความสับสนและความขัดแย้งโดยไม่จำเป็น ควรตรวจสอบและยกระดับผ่านระบบแทน","❌ การรอให้ผู้อื่นสังเกตเห็นปัญหาไม่ใช่การปฏิบัติหน้าที่อย่างรับผิดชอบ เมื่อมีข้อกังวลที่มีเหตุผลเพียงพอควรสื่อสารและดำเนินการเอง ไม่ปล่อยผ่านเพราะไม่แน่ใจในตนเอง"],"l":["หลัก Non-maleficence / Patient Safety — ความปลอดภัยของผู้ป่วยมาก่อน","หลัก Professional Responsibility — Accountability + หน้าที่ speak up","ทักษะการสื่อสาร: Graded Assertiveness (Question → Concern → Escalate) และระบบ Appropriate Escalation"],"r":["👀 Notice — สังเกตความผิดปกติหรือสิ่งที่อาจเป็นความเสี่ยง","🔍 Verify — ตรวจสอบข้อมูลที่สามารถตรวจสอบได้ภายในบทบาท เช่น คำสั่ง ข้อมูลผู้ป่วย หรือแหล่งข้อมูลที่ได้รับอนุญาต","🗣️ Speak — สื่อสารข้อกังวลอย่างชัดเจนและเฉพาะเจาะจง","⬆️ Escalate — หาก concern ยังไม่คลี่คลาย ให้แจ้งผู้กำกับดูแลและใช้ช่องทาง escalation ของหน่วยงาน","✅ Confirm — ก่อนดำเนินการ ตรวจสอบว่าประเด็นด้านความปลอดภัยได้รับการแก้ไขอย่างเหมาะสมแล้ว (Escalation ≠ resolution)"],"qq":"นักศึกษาตรวจพบคำสั่งยาที่สงสัยว่าอาจไม่ปลอดภัย หลังสอบถามแล้วผู้สั่งยืนยันให้ดำเนินการแต่ข้อกังวลยังไม่ได้รับการคลี่คลาย แนวทางใดเหมาะสมที่สุด?","qo":["ทำตามทันทีเพราะผู้สั่งยืนยันแล้ว","ปฏิเสธและบอกผู้ป่วยว่าผู้สั่งรักษาทำผิด","รอให้พยาบาลคนอื่นเป็นผู้สังเกตเอง","ตรวจสอบเพิ่มเติม สื่อสารข้อกังวลอย่างชัดเจน และยกระดับตามระบบหากยังมีความกังวลด้านความปลอดภัย"],"qc":3},"en":{"e":"⚕️","t":"Disagreeing with a Doctor's Order","s":"During clinical placement, you find a medication order you suspect may be unsafe because the dose is higher than expected, and ask the prescribing physician. The physician replies only, \"Just give it as ordered,\" without addressing the safety concern.","c":["Proceed with the order, since the physician confirmed it and is responsible for it","Hold off on the part you're concerned about, verify further information, and notify the responsible nurse/instructor to escalate through the system if the concern remains unresolved","Refuse the order immediately and tell the patient the physician ordered it wrong","Wait to see if another staff member notices the problem, since you might be mistaken"],"ic":["❌","✅","❌","❌"],"w":["❌ Receiving an order from someone with more authority does not eliminate the duty to observe and communicate risk to the patient — Physician confirmation ≠ concern resolved. Authority confirmation is not a reason to stop questioning when the issue is unresolved.","✅ When a concern remains unresolved, verify and seek help through the system before proceeding. You don't need to prove the prescriber wrong — just communicate the concern and escalate until the safety issue is resolved (graded assertiveness: Question → Concern → Escalate).","❌ A student is not in a position to conclude or announce that an order is wrong. Refusing immediately and telling the patient this way could create unnecessary confusion and conflict — verify and escalate through the system instead.","❌ Waiting for someone else to notice is not a responsible way to act. When you have a reasonably grounded concern, you should communicate and act yourself, not let it pass because you're unsure of yourself."],"l":["Non-maleficence / Patient Safety — patient safety comes first","Professional Responsibility — accountability + duty to speak up","Communication skill: Graded Assertiveness (Question → Concern → Escalate) and Appropriate Escalation"],"r":["👀 Notice — observe anything unusual or potentially risky","🔍 Verify — check information verifiable within your role, such as the order, patient data, or authorized sources","🗣️ Speak — communicate the concern clearly and specifically","⬆️ Escalate — if the concern remains unresolved, notify your supervisor and use the facility's escalation channel","✅ Confirm — before proceeding, verify the safety issue has been properly addressed (Escalation ≠ resolution)"],"qq":"A student finds a medication order they suspect may be unsafe. After asking, the prescriber confirms it should proceed, but the concern remains unresolved. What is most appropriate?","qo":["Proceed immediately since the prescriber confirmed it","Refuse and tell the patient the prescriber made a mistake","Wait for another nurse to notice it themselves","Verify further, communicate the concern clearly, and escalate through the system if the safety concern persists"],"qc":3}},{"id":6,"cat":"digital","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Privacy ✔ — Ethics approval ไม่ได้แปลว่ามีสิทธิเข้าถึงข้อมูลผู้ป่วยโดยอัตโนมัติ","en":"⚡ Privacy ✔ — ethics approval doesn't automatically grant a right to access patient data"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[false,true,false,false],"ju":[false,true,false,false]},"th":{"e":"🔒","t":"นักวิจัยขอข้อมูลผู้ป่วย","s":"นักวิจัยติดต่อพยาบาลในหอผู้ป่วยและขอรายชื่อกับเบอร์โทรศัพท์ของผู้ป่วยเบาหวาน เพื่อโทรเชิญเข้าร่วมโครงการวิจัย โดยบอกว่าโครงการได้รับการรับรองด้านจริยธรรมแล้ว แต่คุณยังไม่ทราบว่ากระบวนการ recruitment ที่ได้รับอนุมัติอนุญาตให้ส่งข้อมูลผู้ป่วยแก่ทีมวิจัยในลักษณะนี้หรือไม่","c":["ส่งข้อมูลได้ เพราะโครงการได้รับการรับรองด้านจริยธรรมแล้ว","ยังไม่ส่งข้อมูล และตรวจสอบกระบวนการที่ได้รับอนุมัติ บทบาทของผู้ขอข้อมูล และช่องทางการเข้าถึง/ใช้ข้อมูลของหน่วยงานก่อน","ส่งเฉพาะชื่อโดยไม่ส่งเบอร์โทร เพราะถือว่าเปิดเผยข้อมูลน้อยลง","ส่งได้หากผู้วิจัยรับปากว่าจะใช้ข้อมูลเฉพาะเพื่อ recruitment"],"ic":["❌","✅","❌","❌"],"w":["❌ การรับรองด้านจริยธรรมการวิจัย (ethics approval) ไม่ได้แปลว่าบุคคลนั้นมีสิทธิเข้าถึงข้อมูลผู้ป่วยจากระบบโดยอัตโนมัติ — IRB approval ≠ automatic permission to access patient data","✅ ก่อนส่งข้อมูลผู้ป่วยให้บุคคลอื่น ต้องตรวจสอบว่าผู้ขอมีสิทธิได้รับข้อมูลเพื่อวัตถุประสงค์นั้นหรือไม่ และใช้ช่องทางที่หน่วยงานอนุญาต — Pause แล้ว Verify ไม่ใช่ปฏิเสธทันทีหรืออนุมัติทันที","❌ การลดข้อมูลระบุตัวบุคคลเป็นมาตรการลดความเสี่ยง แต่ไม่ได้สร้างสิทธิในการเข้าถึงหรือใช้ข้อมูลขึ้นมาเอง — De-identification ≠ authorization","❌ คำรับปากของผู้ขอไม่ใช่กระบวนการตรวจสอบที่เชื่อถือได้ ยังต้องตรวจสอบผ่านกระบวนการและช่องทางที่หน่วยงานกำหนดก่อนเปิดเผยข้อมูล — Consent/promise ≠ automatic permission"],"l":["หลัก Privacy + Confidentiality — ข้อมูลผู้ป่วยต้องได้รับการปกป้องแม้ผู้ขอมีเจตนาดี","หลัก Professional Responsibility + Respect for Persons — ตรวจสอบสิทธิและกระบวนการก่อนเปิดเผยข้อมูล","ทักษะ Responsible Data Handling — Ethics approval ≠ automatic data access, Consent ≠ automatic permission, De-identification ≠ authorization"],"r":["⏸️ Pause — อย่าส่งข้อมูลทันทีเพียงเพราะผู้ขอเป็นนักวิจัย","🎯 Purpose — ตรวจสอบว่าจะนำข้อมูลไปใช้เพื่ออะไร","✅ Authorization — ตรวจสอบว่าบุคคลนั้นและกระบวนการดังกล่าวได้รับอนุญาตให้เข้าถึง/ใช้ข้อมูลหรือไม่","🔒 Minimize — หากได้รับอนุญาต ใช้เฉพาะข้อมูลที่จำเป็นตามวัตถุประสงค์และขอบเขตที่กำหนด","🛡️ Protect — ใช้ช่องทางและมาตรการปกป้องข้อมูลตามระบบของหน่วยงาน"],"qq":"นักวิจัยแจ้งว่าโครงการได้รับการรับรองด้านจริยธรรมแล้ว และขอเบอร์โทรศัพท์ของผู้ป่วยจากหอผู้ป่วยเพื่อเชิญเข้าร่วมงานวิจัย นักศึกษายังไม่ทราบว่าการส่งข้อมูลดังกล่าวอยู่ในกระบวนการ recruitment ที่ได้รับอนุมัติหรือไม่ ควรทำอย่างไร?","qo":["ส่งได้ เพราะ ethics approval ครอบคลุมการใช้ข้อมูลทั้งหมดของโครงการ","ส่งได้หากใช้ข้อมูลเพื่อการวิจัยเท่านั้น","ยังไม่ส่ง และตรวจสอบกระบวนการ/ผู้รับผิดชอบที่ได้รับอนุญาตให้เข้าถึงและใช้ข้อมูลก่อน","ส่งเฉพาะเบอร์โทรโดยไม่ระบุโรคก็เพียงพอ"],"qc":2},"en":{"e":"🔒","t":"Researcher Requests Patient Data","s":"A researcher contacts a nurse on the ward and asks for the names and phone numbers of diabetic patients to invite them to join a research project, saying the project has received ethics approval — but you don't yet know whether the approved recruitment process actually authorizes releasing patient information to the research team this way.","c":["You can send the data, since the project has ethics approval","Don't send it yet; first check the approved process, the requester's role, and the facility's data access/use channel","Send only the names, not phone numbers, since that discloses less","You can send it if the researcher promises to use it only for recruitment"],"ic":["❌","✅","❌","❌"],"w":["❌ Research ethics approval doesn't mean that person automatically has a right to access patient data from the system — IRB approval ≠ automatic permission to access patient data.","✅ Before sending patient information to someone else, verify whether the requester has a right to that data for that purpose, and use a channel the facility authorizes — Pause then Verify, not immediate refusal or immediate approval.","❌ Reducing identifying information is a risk-mitigation measure, but doesn't create a right to access or use data on its own — De-identification ≠ authorization.","❌ A verbal promise from the requester is not a reliable verification process. You still need to verify through the facility's designated process and channel before disclosing data — Consent/promise ≠ automatic permission."],"l":["Privacy + Confidentiality — patient data must be protected even when the requester has good intentions","Professional Responsibility + Respect for Persons — verify rights and process before disclosing data","Skill: Responsible Data Handling — Ethics approval ≠ automatic data access, Consent ≠ automatic permission, De-identification ≠ authorization"],"r":["⏸️ Pause — don't send data immediately just because the requester is a researcher","🎯 Purpose — check what the data will be used for","✅ Authorization — verify whether that person and process are authorized to access/use the data","🔒 Minimize — if authorized, use only what's necessary within the defined scope","🛡️ Protect — use channels and safeguards per the facility's system"],"qq":"A researcher says a project has ethics approval and asks for a patient's phone number from the ward to invite them to a study. The student doesn't know whether sending this falls within the approved recruitment process. What should they do?","qo":["Send it, since ethics approval covers all uses in the project","Send it if it's only used for research","Don't send it yet; verify the process/responsible party authorized to access and use the data first","Sending just the phone number without the diagnosis is sufficient"],"qc":2}},{"id":7,"cat":"digital","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Confidentiality ✔ — ไม่มีผู้ป่วยในภาพ ≠ ไม่มีข้อมูลผู้ป่วย","en":"⚡ Confidentiality ✔ — no patient in the photo ≠ no patient information"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[false,true,false,false],"ju":[false,true,false,false]},"th":{"e":"📱","t":"Selfie ที่มี Whiteboard ผู้ป่วย","s":"เพื่อนถ่าย selfie ที่ nurses station ชื่อผู้ป่วยติดมาในพื้นหลัง กำลังจะโพสต์","c":["ปล่อยให้โพสต์ เพราะไม่มีผู้ป่วยอยู่ในภาพ","แจ้งเพื่อนให้หยุดการโพสต์/แชร์ภาพ และชี้ให้เห็นว่ามีข้อมูลผู้ป่วยปรากฏอยู่ พร้อมจัดการภาพตามแนวทางของแหล่งฝึก","ให้เพื่อนเบลอเฉพาะชื่อผู้ป่วยแล้วโพสต์ได้ทันที","ไม่ต้องพูดกับเพื่อน แต่รายงานอาจารย์หลังจากโพสต์แล้ว"],"ic":["❌","✅","❌","❌"],"w":["❌ แม้ไม่มีภาพผู้ป่วย แต่ชื่อหรือข้อมูลที่ปรากฏบน whiteboard อาจทำให้ระบุตัวบุคคลหรือเปิดเผยข้อมูลเกี่ยวกับการรับบริการสุขภาพได้ — No patient in the photo ≠ no patient information","✅ เมื่อพบข้อมูลผู้ป่วยในฉากหลังขณะที่เพื่อนกำลังจะโพสต์ ควรหยุดการเผยแพร่ก่อนเกิดขึ้น (Notice → Stop → Protect) แล้วจัดการภาพตามแนวทางของแหล่งฝึก","❌ การเบลอชื่อผู้ป่วยเพียงอย่างเดียวไม่ได้ทำให้โพสต์ได้โดยอัตโนมัติ ยังต้องพิจารณาข้อมูลอื่นในภาพ นโยบายของแหล่งฝึก และบุคคลอื่นที่อาจติดภาพ — Removing one identifier ≠ automatic permission to post","❌ การไม่เตือนเพื่อนก่อนแล้วรอรายงานทีหลังปล่อยให้การเปิดเผยข้อมูลเกิดขึ้นไปแล้ว ทั้งที่สามารถป้องกันได้ทันทีอย่างปลอดภัย"],"l":["หลัก Confidentiality + Privacy — ข้อมูลอาจถูกเปิดเผยผ่านฉากหลังได้แม้ผู้ป่วยไม่อยู่ในภาพ","หลัก Advocacy + Professional Responsibility — ปกป้องผู้ป่วยรวมถึงการ speak up เมื่อเห็นเพื่อนกำลังจะเปิดเผยข้อมูลโดยไม่ตั้งใจ","ทักษะ Environmental Awareness — ตรวจสอบทั้ง foreground และ background ก่อนถ่ายหรือแชร์ภาพในพื้นที่ดูแลผู้ป่วย"],"r":["🔍 Scan — ก่อนถ่าย/โพสต์ภาพในพื้นที่ดูแลผู้ป่วย ตรวจสอบสิ่งที่ปรากฏทั้งในภาพและฉากหลัง","🛑 Stop — หากพบข้อมูลผู้ป่วย ให้หยุดการโพสต์หรือส่งต่อก่อน","🔒 Protect — หลีกเลี่ยงการเผยแพร่ข้อมูลหรือสิ่งที่สามารถเชื่อมโยงถึงผู้ป่วย","✅ Check — ตรวจสอบนโยบายของแหล่งฝึกเกี่ยวกับการถ่ายภาพและ social media","📢 Follow up — หากข้อมูลถูกเผยแพร่ไปแล้ว ให้แจ้งผู้รับผิดชอบและดำเนินการตามกระบวนการของหน่วยงาน"],"qq":"นักศึกษาถ่ายภาพตนเองในพื้นที่ปฏิบัติงาน ในภาพไม่เห็นผู้ป่วย แต่ด้านหลังมีหน้าจอที่แสดงข้อมูลการรักษาของผู้ป่วยบางส่วน สิ่งใดเหมาะสมที่สุด?","qo":["โพสต์ได้ เพราะไม่มีใบหน้าหรือชื่อผู้ป่วย","โพสต์ได้ถ้าภาพหน้าจอมีขนาดเล็ก","โพสต์ได้หากตั้งบัญชีเป็น private","ไม่โพสต์หรือแชร์ภาพ และจัดการตามแนวทางของแหล่งฝึก เพราะข้อมูลผู้ป่วยอาจถูกเปิดเผยผ่านฉากหลังได้"],"qc":3},"en":{"e":"📱","t":"Selfie with Patient Whiteboard","s":"A classmate takes a selfie at the nurses' station and is about to post it. The patient isn't in the photo, but in the background is a whiteboard showing a patient's name.","c":["Let it be posted, since no patient is in the photo","Tell your classmate to stop posting/sharing, point out that patient information appears in the photo, and handle the image per facility guidance","Have your classmate blur just the patient's name, then post it right away","Don't say anything to your classmate, but report to an instructor after it's posted"],"ic":["❌","✅","❌","❌"],"w":["❌ Even without a patient visible, a name or information on a whiteboard may identify someone or disclose information about receiving healthcare — No patient in the photo ≠ no patient information.","✅ When you spot patient information in the background while a classmate is about to post, stop the disclosure before it happens (Notice → Stop → Protect), then handle the image per facility guidance.","❌ Blurring just the name doesn't automatically make posting acceptable — other information in the frame, facility policy, and other people who might appear also need consideration — Removing one identifier ≠ automatic permission to post.","❌ Not warning your classmate first and waiting to report afterward lets the disclosure happen even though it could have been prevented safely and immediately."],"l":["Confidentiality + Privacy — information can be disclosed through the background even without the patient in the photo","Advocacy + Professional Responsibility — protecting patients includes speaking up when you see a colleague about to unintentionally disclose information","Skill: Environmental Awareness — check both foreground and background before taking or sharing photos in patient care areas"],"r":["🔍 Scan — before taking/posting photos in a care area, check what appears both in frame and in the background","🛑 Stop — if patient information is found, stop the post or share first","🔒 Protect — avoid disclosing information or anything linkable to a patient","✅ Check — verify the facility's policy on photography and social media","📢 Follow up — if information has already been disclosed, notify the responsible party and follow facility procedure"],"qq":"A student photographs themselves in a work area. The patient isn't visible, but a monitor showing some of the patient's treatment information is in the background. What is most appropriate?","qo":["Post it, since there's no face or name visible","Post it if the screen appears small in the image","Post it if the account is set to private","Do not post or share the photo, and handle it per facility guidance, since patient information may be disclosed through the background"],"qc":3}},{"id":8,"cat":"legal","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Beneficence (บรรเทาทุกข์) ✔ — รับฟังก่อนตีความ ไม่รีบสรุปว่าเป็นคำขอเร่งความตาย","en":"⚡ Beneficence (relieve suffering) ✔ — listen before labeling; don't assume it's a request to hasten death"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[false,true,false,false],"ju":[false,true,false,false]},"th":{"e":"🕊️","t":"ผู้ป่วยระยะท้ายขอให้ความทรมานจบลง","s":"ผู้ป่วยมะเร็งระยะท้ายที่กำลังเผชิญความทุกข์จากโรคพูดกับคุณว่า \"ฉันไม่ไหวแล้ว ช่วยให้ทุกอย่างจบเร็วๆ ได้ไหม\" คุณยังไม่แน่ใจว่าผู้ป่วยหมายถึงอะไร","c":["บอกทันทีว่าไม่สามารถช่วยได้ แล้วเปลี่ยนเรื่องเพื่อไม่ให้ผู้ป่วยคิดมาก","รับฟังและสำรวจว่าผู้ป่วยหมายถึงอะไร ประเมินความทุกข์/อาการที่เกี่ยวข้อง และแจ้งพยาบาลผู้รับผิดชอบหรือทีมเพื่อช่วยจัดการอาการและเป้าหมายการดูแลอย่างเหมาะสม","บอกผู้ป่วยว่าหากยืนยันความต้องการ นักศึกษาจะช่วยหาวิธีทำให้เสียชีวิตเร็วขึ้น","บอกครอบครัวทันทีว่าผู้ป่วยต้องการเสียชีวิต โดยไม่ต้องพูดกับผู้ป่วยเพิ่มเติม"],"ic":["❌","✅","❌","❌"],"w":["❌ การตัดบทสนทนาทันทีโดยไม่รับฟังอาจทำให้พลาดโอกาสเข้าใจความทุกข์ที่แท้จริงของผู้ป่วย — Not intentionally ending life ≠ abandoning the conversation","✅ รับฟังและสำรวจว่าผู้ป่วยหมายถึงอะไรก่อนตีความ (Listen before labeling) ประเมินความทุกข์ทางกายและจิตใจ แจ้งทีมเพื่อจัดการอาการและเป้าหมายการดูแล โดยไม่ดำเนินการใดที่มีเจตนาเร่งให้ผู้ป่วยเสียชีวิต — Do not hasten death ≠ do nothing about suffering","❌ นี่คือการกระทำที่มีเจตนาทำให้ผู้ป่วยเสียชีวิต ซึ่งไม่ควรกระทำไม่ว่าในสถานการณ์ใด","❌ การแจ้งครอบครัวโดยไม่ฟังหรือสำรวจความหมายจากผู้ป่วยก่อน เป็นการข้ามขั้นตอนสำคัญและอาจไม่ตรงกับสิ่งที่ผู้ป่วยต้องการสื่อสารจริง"],"l":["หลัก Beneficence / Relief of Suffering — บรรเทาความทุกข์ทรมานภายในบทบาท","หลัก Non-maleficence + Respect for Persons — ไม่กระทำโดยเจตนาทำให้เสียชีวิต","การกระทำโดยมีเจตนาทำให้ผู้ป่วยเสียชีวิต ไม่ควรถูกเหมารวมกับการปฏิเสธการรักษา การไม่เริ่ม/ยุติการรักษาตามแผนที่เหมาะสม (เช่น DNAR) หรือการให้ยาบรรเทาอาการตามมาตรฐาน ซึ่งเป็นประเด็นที่ต้องพิจารณาแยกกัน (รายละเอียดทางกฎหมาย/แนวทาง Palliative Care ที่เจาะจง ควรเก็บใน Expert Reference และให้ผู้เชี่ยวชาญตรวจสอบก่อนใช้จริง)"],"r":["👂 Listen — อยู่กับบทสนทนาและรับฟังโดยไม่รีบตัดสิน","🔍 Clarify — สำรวจว่าคำว่า \"อยากให้จบ\" หมายถึงอะไรสำหรับผู้ป่วย","🩺 Assess — พิจารณาความทุกข์ อาการ ความกังวล และประเด็นด้านความปลอดภัยที่ต้องแจ้งทีม","❤️ Relieve — สนับสนุนการบรรเทาอาการและความทุกข์ภายในบทบาท","🤝 Coordinate — แจ้งและประสานพยาบาลผู้รับผิดชอบ/ทีมเพื่อวางแผนการดูแลที่เหมาะสม (ไม่ดำเนินการด้วยตนเองเพื่อเร่งการเสียชีวิต)"],"qq":"ผู้ป่วยระยะท้ายพูดว่า \"ไม่อยากทนแบบนี้แล้ว อยากให้มันจบ\" การตอบสนองเบื้องต้นใดเหมาะสมที่สุด?","qo":["อธิบายทันทีว่าการทำให้ผู้ป่วยเสียชีวิตเป็นสิ่งต้องห้าม","บอกว่าอย่าคิดแบบนั้นและพยายามให้กำลังใจ","รับฟัง สำรวจว่าผู้ป่วยหมายถึงอะไรและกำลังทุกข์จากอะไร พร้อมประสานทีมเพื่อประเมินและช่วยเหลือต่อ","แจ้งครอบครัวทันทีโดยไม่ถามผู้ป่วยเพิ่มเติม"],"qc":2},"en":{"e":"🕊️","t":"Terminal Patient Asks for Suffering to End","s":"A terminally ill cancer patient facing significant suffering tells you, \"I can't take it anymore — can you help end everything quickly?\" You're not yet sure what the patient means.","c":["Tell them immediately that you can't help, then change the subject so they don't dwell on it","Listen and explore what the patient means, assess their suffering/related symptoms, and notify the responsible nurse or team to help manage symptoms and care goals appropriately","Tell the patient that if they're certain, you'll help find a way to hasten death","Tell the family immediately that the patient wants to die, without discussing it with the patient further"],"ic":["❌","✅","❌","❌"],"w":["❌ Cutting off the conversation immediately without listening may miss the chance to understand the patient's real suffering — Not intentionally ending life ≠ abandoning the conversation.","✅ Listen and explore what the patient means before interpreting (Listen before labeling); assess physical and emotional suffering; notify the team to manage symptoms and care goals, without taking any action intended to hasten the patient's death — Do not hasten death ≠ do nothing about suffering.","❌ This is an action intended to cause the patient's death, which should never be done under any circumstances.","❌ Telling the family without listening or exploring the patient's meaning first skips an important step and may not reflect what the patient actually wants to communicate."],"l":["Beneficence / Relief of Suffering — relieve suffering within your role","Non-maleficence + Respect for Persons — do not act with intent to cause death","An action intended to cause a patient's death should not be conflated with refusing treatment, appropriately not starting/withdrawing treatment (e.g. DNAR), or standard symptom-relief medication, which are separate considerations (specific legal details/Palliative Care guidance should be kept in an Expert Reference and verified by specialists before real-world use)"],"r":["👂 Listen — stay with the conversation and listen without rushing to judge","🔍 Clarify — explore what \"wanting it to end\" means for this patient","🩺 Assess — consider suffering, symptoms, concerns, and any safety issues that need reporting to the team","❤️ Relieve — support symptom and suffering relief within your role","🤝 Coordinate — notify and coordinate with the responsible nurse/team to plan appropriate care (do not act alone to hasten death)"],"qq":"A terminal patient says, \"I can't bear this anymore, I want it to end.\" What is the most appropriate initial response?","qo":["Explain immediately that causing a patient's death is forbidden","Tell them not to think that way and try to encourage them","Listen, explore what the patient means and what they're suffering from, and coordinate with the team to assess and help further","Notify the family immediately without asking the patient anything more"],"qc":2}},{"id":9,"cat":"clinical","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Beneficence + Non-maleficence ✔ — ความเสี่ยงของยาต้องประเมิน ไม่ใช่เหตุผลให้ปล่อยให้ทนปวด","en":"⚡ Beneficence + Non-maleficence ✔ — medication risk requires assessment, not an excuse to withhold relief"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[false,true,false,false],"ju":[true,true,false,false]},"th":{"e":"🕯️","t":"การบรรเทาปวดในผู้ป่วยระยะท้าย","s":"ผู้ป่วยระยะท้ายมีอาการปวดมาก แม้ได้รับยาระงับปวดตามแผน และขอให้ช่วยบรรเทาอาการเพิ่มเติม คุณกังวลว่า morphine อาจทำให้ง่วงหรือกดการหายใจ","c":["งด morphine เพราะผู้ป่วยระยะท้ายมีความเสี่ยงต่อการกดการหายใจ","ประเมินความปวด ระดับความรู้สึกตัว การหายใจ และข้อมูลที่เกี่ยวข้อง ตรวจสอบแผนการรักษา แล้วดำเนินการบรรเทาอาการภายในบทบาทพร้อมติดตามผล หรือปรึกษาผู้รับผิดชอบหากมีข้อกังวล","ให้ morphine เพิ่มตามที่ผู้ป่วยต้องการทันที เพราะผู้ป่วยเป็นผู้ประเมินความปวดของตนเองได้ดีที่สุด","รอจนผู้ป่วยทนความปวดไม่ได้จึงแจ้งทีม เพื่อลดความเสี่ยงจากยา"],"ic":["❌","✅","❌","❌"],"w":["❌ ความเสี่ยงของยาเป็นเหตุผลให้ประเมิน ใช้อย่างเหมาะสม และติดตาม ไม่ใช่เหตุผลให้ละเลยความทุกข์ของผู้ป่วยโดยอัตโนมัติ — Risk requires assessment and monitoring, not automatic undertreatment","✅ Assess → Verify → Relieve safely → Monitor — ประเมิน ตรวจสอบแผน แล้วบรรเทาอาการภายในบทบาทพร้อมติดตามผล เป็น Beneficence ที่สมดุลกับ Non-maleficence — การใช้ยาบรรเทาอาการตามแผนอย่างเหมาะสมมีเป้าหมายลดความทุกข์ ไม่ควรถูกเหมารวมว่าเป็นการกระทำที่มีเจตนาเร่งการเสียชีวิต","❌ Respecting the patient's report ≠ patient-directed dosing — ผู้ป่วยเป็นแหล่งข้อมูลสำคัญเรื่องความทุกข์ของตนเอง แต่การให้ยาต้องอาศัยการประเมิน แผนการรักษา และบทบาทวิชาชีพ","❌ การรอให้ผู้ป่วยทนไม่ได้ก่อนจึงแจ้งทีมเป็นการปล่อยให้ความทุกข์ดำเนินต่อไปโดยไม่จำเป็น ความกังวลเรื่องความเสี่ยงควรนำไปสู่การประเมินและติดตามอย่างใกล้ชิด ไม่ใช่การชะลอการบรรเทาอาการ"],"l":["หลัก Beneficence + Non-maleficence — บรรเทาความทุกข์อย่างปลอดภัย ไม่ใช่ปล่อยให้ทนปวดเพราะกลัวผลข้างเคียง","หลัก Autonomy — รับฟังรายงานความปวดของผู้ป่วย แต่การให้ยาต้องอาศัยการประเมินและแผนการรักษา ไม่ใช่ผู้ป่วยกำหนดขนาดเอง","การใช้ยาบรรเทาอาการตามแผนอย่างเหมาะสมมีเป้าหมายลดความทุกข์ ไม่ควรถูกเหมารวมว่าเป็นการกระทำที่มีเจตนาเร่งการเสียชีวิต (แยกจาก #8)"],"r":["🩺 Assess — ประเมินความปวด อาการ ความรู้สึกตัว การหายใจ และข้อมูลที่เกี่ยวข้อง","📋 Verify — ตรวจสอบแผน/คำสั่งและเงื่อนไขการให้ยา","❤️ Relieve — ให้การบรรเทาอาการที่เหมาะสมภายในบทบาท ไม่ปล่อยให้ความกลัวต่อ adverse effects ทำให้ละเลยความทุกข์","👀 Monitor — ติดตาม response และ safety หลัง intervention","🔄 Reassess — ประเมินซ้ำ หากยังควบคุมอาการไม่ได้หรือมีข้อกังวล ให้ประสานทีม"],"qq":"ผู้ป่วยระยะท้ายมีคำสั่งยาบรรเทาปวดตามแผนและรายงานว่ายังปวดมาก นักศึกษากังวลเรื่องผลข้างเคียงจากยา แนวทางใดเหมาะสมที่สุด?","qo":["งดยาเพื่อหลีกเลี่ยงความเสี่ยงทั้งหมด","ให้ยาทันทีโดยไม่ต้องประเมิน เพราะเป้าหมายคือความสุขสบาย","ประเมินผู้ป่วย ตรวจสอบแผนการรักษา ให้การบรรเทาอาการอย่างเหมาะสมภายในบทบาท และติดตามทั้งผลการลดปวดและความปลอดภัย","รอให้ผู้ป่วยร้องขอซ้ำหลายครั้งก่อนเพื่อยืนยันว่าปวดจริง"],"qc":2},"en":{"e":"🕯️","t":"Pain Relief in a Terminal Patient","s":"A terminal patient is in significant pain despite receiving pain medication per the plan, and asks for additional relief. You're concerned morphine might cause drowsiness or respiratory depression.","c":["Withhold morphine because terminal patients are at risk of respiratory depression","Assess pain, level of consciousness, breathing, and related information, check the treatment plan, then provide relief within your role while monitoring, or consult the responsible party if concerned","Give more morphine right away as the patient wants, since the patient is the best judge of their own pain","Wait until the patient can't bear the pain before notifying the team, to reduce medication risk"],"ic":["❌","✅","❌","❌"],"w":["❌ Medication risk is a reason to assess, use appropriately, and monitor — not a reason to automatically neglect the patient's suffering. Risk requires assessment and monitoring, not automatic undertreatment.","✅ Assess → Verify → Relieve safely → Monitor — assess, check the plan, then relieve symptoms within your role while monitoring. This is Beneficence balanced with Non-maleficence — appropriately using symptom-relief medication per plan aims to reduce suffering and should not be conflated with an act intended to hasten death.","❌ Respecting the patient's report ≠ patient-directed dosing — the patient is an important source of information about their own suffering, but administering medication requires assessment, the treatment plan, and staying within your professional role.","❌ Waiting until the patient can't bear it before notifying the team lets suffering continue unnecessarily. Risk concerns should lead to close assessment and monitoring, not delaying relief."],"l":["Beneficence + Non-maleficence — relieve suffering safely, not withhold care out of fear of side effects","Autonomy — listen to the patient's report of pain, but dosing requires assessment and the treatment plan, not patient-set dosing","Appropriately using symptom-relief medication per plan aims to reduce suffering and should not be conflated with an act intended to hasten death (distinct from #8)"],"r":["🩺 Assess — evaluate pain, symptoms, consciousness, breathing, and related information","📋 Verify — check the plan/order and conditions for administering medication","❤️ Relieve — provide appropriate relief within your role; don't let fear of adverse effects cause neglect of suffering","👀 Monitor — track response and safety after intervention","🔄 Reassess — reassess if symptoms remain uncontrolled or concerns persist, and coordinate with the team"],"qq":"A terminal patient has a pain-relief order per plan and reports still being in significant pain. The student is concerned about medication side effects. What is most appropriate?","qo":["Withhold medication to avoid all risk","Give medication immediately without assessment, since the goal is comfort","Assess the patient, check the treatment plan, provide appropriate relief within your role, and monitor both pain relief and safety","Wait for the patient to ask repeatedly before confirming the pain is real"],"qc":2}},{"id":10,"cat":"clinical","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Non-maleficence (Child Safety) ✔ — ไม่ต้องพิสูจน์การทำร้ายก่อนจึงแจ้ง safeguarding concern","en":"⚡ Non-maleficence (Child Safety) ✔ — you don't need to prove abuse before raising a safeguarding concern"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[false,true,false,false],"ju":[false,true,false,false]},"th":{"e":"👶","t":"เด็กมีรอยช้ำที่น่ากังวล","s":"ระหว่างดูแลเด็กอายุ 7 ปี คุณพบรอยช้ำหลายตำแหน่งในลักษณะที่ทำให้กังวลว่าเด็กอาจได้รับอันตราย ขณะนี้ยังไม่มีข้อมูลเพียงพอที่จะสรุปว่าสาเหตุเกิดจากอะไร","c":["รอจนมีหลักฐานแน่ชัดว่าเด็กถูกทำร้ายก่อนจึงรายงาน","ประเมินความปลอดภัยและอาการของเด็ก บันทึกสิ่งที่สังเกตพบอย่างเป็นข้อเท็จจริง และแจ้งผู้รับผิดชอบตามกระบวนการคุ้มครองเด็กของหน่วยงาน","ถามผู้ปกครองโดยตรงว่าเป็นผู้ทำร้ายเด็กหรือไม่ และตัดสินจากคำตอบ","ถ่ายภาพรอยช้ำด้วยโทรศัพท์ส่วนตัวแล้วส่งให้เพื่อนช่วยพิจารณาว่าเป็นการทำร้ายหรือไม่"],"ic":["❌","✅","❌","❌"],"w":["❌ You do not need to prove abuse before raising a safeguarding concern — ไม่จำเป็นต้องสรุปว่าเกิดการทำร้ายแน่นอนก่อนจึงจะสามารถแจ้งข้อกังวลต่อผู้รับผิดชอบได้ การรอพิสูจน์อาจทำให้เด็กตกอยู่ในความเสี่ยงต่อไป","✅ ประเมินความปลอดภัยก่อน (Safety first) บันทึกสิ่งที่สังเกตพบอย่างเป็นข้อเท็จจริง ไม่ใช่ข้อสรุปหรือข้อกล่าวหา แล้วแจ้งผู้รับผิดชอบตามกระบวนการคุ้มครองเด็ก — Observe → Describe → Escalate ไม่ใช่ Assume → Label → Accuse. Report the concern, not an unproven conclusion","❌ การซักถามผู้ปกครองโดยตรงเพื่อหาผู้กระทำทำให้กลายเป็นผู้สอบสวน (investigator) ซึ่งไม่ใช่บทบาทของนักศึกษา — Assessment ≠ Investigation","❌ การใช้โทรศัพท์ส่วนตัวถ่ายภาพแล้วส่งให้เพื่อนพิจารณาเองเป็นการละเมิดความลับผู้ป่วยและไม่ใช่กระบวนการที่เหมาะสม"],"l":["หลัก Non-maleficence / Child Safety — ปกป้องเด็กซึ่งเป็นกลุ่มที่มีข้อจำกัดในการปกป้องตนเอง","หลัก Beneficence + Professional Responsibility (Safeguarding) — ไม่เพิกเฉยต่อ reasonable concern","ทักษะ Objective Assessment + Objective Documentation + Appropriate Reporting/Escalation — บันทึกสิ่งที่สังเกตได้ ไม่ใช่ข้อสรุปหรือข้อกล่าวหา"],"r":["🛡️ Safety — พิจารณาว่าเด็กมีอันตรายหรือความต้องการดูแลเร่งด่วนหรือไม่","🩺 Assess — ประเมินอาการและข้อมูลที่เกี่ยวข้องภายในบทบาท","📝 Document — บันทึกข้อเท็จจริงที่พบหรือคำพูดที่เกี่ยวข้องอย่างแม่นยำ ไม่เติมข้อสรุปที่ยังพิสูจน์ไม่ได้","📢 Report — แจ้งพยาบาลผู้รับผิดชอบ/อาจารย์นิเทศ และดำเนินการตามระบบ safeguarding ของหน่วยงาน","❤️ Support — ดูแลเด็กด้วยท่าทีที่ปลอดภัย ไม่กล่าวโทษ ไม่กดดัน และประสานการช่วยเหลือต่อเนื่อง"],"qq":"นักศึกษาพบลักษณะการบาดเจ็บของเด็กที่ทำให้กังวลว่าอาจมีปัญหาด้านความปลอดภัย แต่ยังไม่ทราบสาเหตุแน่ชัด ควรทำอย่างไร?","qo":["ไม่รายงานจนกว่าเด็กจะยืนยันว่าใครเป็นผู้ทำ","สอบถามผู้ปกครองจนกว่าจะได้ข้อสรุป","ประเมินความปลอดภัย บันทึกข้อเท็จจริง และแจ้งข้อกังวลต่อผู้รับผิดชอบตามระบบ","รอให้พบการบาดเจ็บซ้ำอีกครั้งเพื่อเพิ่มความมั่นใจ"],"qc":2},"en":{"e":"👶","t":"Child with Concerning Bruising","s":"While caring for a 7-year-old, you find multiple bruises in a pattern that raises concern the child may have been harmed. There is not yet enough information to conclude what caused it.","c":["Wait until there's clear evidence the child was harmed before reporting","Assess the child's safety and condition, document what you observed as objective fact, and notify the responsible party per the facility's child-protection procedure","Ask the parents directly whether they harmed the child, and judge based on their answer","Photograph the bruising on a personal phone and send it to a classmate to help judge whether it's abuse"],"ic":["❌","✅","❌","❌"],"w":["❌ You do not need to prove abuse before raising a safeguarding concern — you don't need to conclude abuse definitely occurred before you can raise a concern with the responsible party. Waiting for proof may leave the child at continued risk.","✅ Assess safety first (Safety first); document what you observed as objective fact, not conclusions or accusations, then notify the responsible party per the child-protection procedure — Observe → Describe → Escalate, not Assume → Label → Accuse. Report the concern, not an unproven conclusion.","❌ Directly interrogating the parents to find the perpetrator turns you into an investigator, which is not a student's role — Assessment ≠ Investigation.","❌ Using a personal phone to photograph and send it to a classmate for their own judgment violates patient confidentiality and is not an appropriate process."],"l":["Non-maleficence / Child Safety — protect children, who have limited ability to protect themselves","Beneficence + Professional Responsibility (Safeguarding) — do not ignore a reasonable concern","Skill: Objective Assessment + Objective Documentation + Appropriate Reporting/Escalation — document what you observed, not conclusions or accusations"],"r":["🛡️ Safety — consider whether the child is in danger or needs urgent care","🩺 Assess — assess symptoms and related information within your role","📝 Document — accurately record facts observed or relevant statements, without adding unproven conclusions","📢 Report — notify the responsible nurse/instructor and follow the facility's safeguarding system","❤️ Support — care for the child in a safe manner, without blame or pressure, and coordinate continued support"],"qq":"A student finds an injury pattern in a child that raises safety concerns, but the cause isn't yet clear. What should they do?","qo":["Don't report until the child confirms who did it","Question the parents until you reach a conclusion","Assess safety, document facts, and report the concern to the responsible party per the system","Wait to see the injury recur to be more certain"],"qc":2}},{"id":11,"cat":"clinical","correct":1,"scores":[0,10,0,0],"cn":{"th":"⚡ Non-maleficence ✔ — ความอ่อนล้าที่กระทบสมาธิควรแจ้งก่อนเกิดอันตราย ไม่ใช่หลังเกิด","en":"⚡ Non-maleficence ✔ — fatigue affecting focus should be disclosed before harm occurs, not after"},"conflict":{"au":[false,true,false,false],"be":[false,true,false,false],"nm":[false,true,false,false],"ju":[false,true,false,false]},"th":{"e":"😴","t":"การทำงานขณะเหนื่อยล้า","s":"นักศึกษาพยาบาลนอนหลับไม่เพียงพอเมื่อคืน ระหว่างฝึกปฏิบัติงานเริ่มง่วงมาก สมาธิลดลง และรู้สึกว่าตนเองอาจทำงานที่ต้องใช้ความแม่นยำได้ไม่ปลอดภัย ขณะเดียวกันยังมีงานดูแลผู้ป่วยที่ต้องดำเนินการต่อ","c":["ฝืนทำงานต่อให้เสร็จ เพราะการส่งงานให้ผู้อื่นเป็นการขาดความรับผิดชอบ","แจ้งพยาบาลผู้รับผิดชอบ/อาจารย์นิเทศว่าความอ่อนล้ากำลังกระทบความพร้อมในการปฏิบัติงาน และร่วมกันกำหนดแนวทางที่ปลอดภัย","ดื่มกาแฟและทำงานต่อโดยไม่ต้องแจ้งใคร เพราะยังไม่ได้เกิดความผิดพลาด","ออกจากหอผู้ป่วยและกลับไปพักทันทีโดยไม่ต้องแจ้งผู้รับผิดชอบ"],"ic":["❌","✅","❌","❌"],"w":["❌ Professional responsibility ไม่ได้แปลว่าต้องฝืนทำงานทุกกรณี การฝืนทำงานเมื่อสมาธิ/ความพร้อมลดลงอาจเพิ่มความเสี่ยงต่อผู้ป่วย","✅ การแจ้งข้อจำกัดที่อาจกระทบความปลอดภัยอย่างเหมาะสมเป็นส่วนหนึ่งของความรับผิดชอบ ไม่ใช่การหลีกเลี่ยงหน้าที่ — Safety action should occur before harm, not only after harm (เช่นเดียวกับ #5)","❌ การพยายามลดความง่วงด้วยตนเองไม่ได้แทนที่การแจ้งผู้กำกับดูแล เมื่อความอ่อนล้ากำลังกระทบความสามารถในการทำงานอย่างปลอดภัย — ยังไม่เกิด error ไม่ได้แปลว่าไม่ต้องทำอะไร","❌ นักศึกษาไม่ควรตัดสินใจออกจากพื้นที่ปฏิบัติงานเองโดยไม่ประสานผู้รับผิดชอบ การปรับวิธีปฏิบัติงานควรทำร่วมกับผู้กำกับดูแล"],"l":["หลัก Non-maleficence / Patient Safety — ความอ่อนล้าที่กระทบสมาธิอาจเพิ่มความเสี่ยงต่อผู้ป่วย","หลัก Professional Responsibility + Accountability — รู้ข้อจำกัดของตนเองและสื่อสารอย่างเหมาะสม","ทักษะ Self-Assessment of Readiness for Practice — Recognize → Inform → Adjust safely"],"r":["👁️ Recognize — สังเกตว่าความเหนื่อยล้ากำลังส่งผลต่อสมาธิ การตัดสินใจ หรือความสามารถในการทำงานหรือไม่","🔍 Assess — พิจารณาว่างานที่กำลังจะทำมีความเสี่ยงและต้องใช้ความแม่นยำเพียงใด","🗣️ Speak — แจ้งผู้กำกับดูแลอย่างตรงไปตรงมาเมื่อกังวลเรื่องความปลอดภัย","🔄 Adjust — ร่วมกันปรับงาน การพัก การช่วยเหลือ หรือ supervision ตามความเหมาะสม","✅ Reassess — ประเมินความพร้อมอีกครั้งก่อนกลับไปทำงานที่มีความเสี่ยง"],"qq":"ระหว่างฝึกปฏิบัติงาน นักศึกษารู้สึกง่วงมากจนเริ่มมีสมาธิลดลง แต่ยังไม่เกิดความผิดพลาด แนวทางใดเหมาะสมที่สุด?","qo":["ทำต่อจนเกิดข้อผิดพลาดจึงค่อยแจ้งอาจารย์","หลีกเลี่ยงเฉพาะงานให้ยา แต่ทำงานอื่นต่อทั้งหมดโดยไม่แจ้งใคร","แจ้งผู้กำกับดูแลถึงผลของความอ่อนล้าต่อความพร้อมในการทำงาน และร่วมกันกำหนดแนวทางที่ปลอดภัย","กลับบ้านทันทีโดยไม่ต้องประสานใคร"],"qc":2},"en":{"e":"😴","t":"Working While Fatigued","s":"A nursing student didn't get enough sleep last night. During clinical placement they become very drowsy, their focus drops, and they feel they may not be able to safely perform tasks requiring precision — while patient care work still needs to continue.","c":["Push through and finish the work, since handing it to someone else would be irresponsible","Tell the responsible nurse/instructor that fatigue is affecting readiness to practice safely, and work together to set a safe approach","Drink coffee and keep working without telling anyone, since no error has occurred yet","Leave the ward and go rest immediately without notifying the res
